/* ==========================================================================
   FONTYS WORKSPACE — DESIGN TOKENS
   Paleta "Navy Fontys": base navy profunda com azul de assinatura da marca.
   ========================================================================== */

:root {
  /* ---- Cor: superfícies (dark navy) ---- */
  --bg-base: #0a1420;
  --bg-surface: #0f1c2c;
  --bg-elevated: #16283d;
  --bg-elevated-hover: #1c3349;
  --bg-overlay: rgba(6, 12, 20, 0.74);

  /* ---- Cor: bordas (com leve matiz azul) ---- */
  --border-subtle: #1c2c40;
  --border-default: #263c56;
  --border-strong: #37516f;

  /* ---- Cor: marca Fontys — azul de assinatura → navy profundo (extraída da logo oficial) ---- */
  --brand-blue: #2e63a6;
  --brand-blue-light: #4b84c9;
  --brand-navy: #14253b;
  --brand-navy-deep: #0b1626;

  --accent-primary: var(--brand-blue);
  --accent-primary-hover: var(--brand-blue-light);
  --accent-primary-soft: rgba(46, 99, 166, 0.14);
  --accent-primary-border: rgba(46, 99, 166, 0.35);

  --accent-gradient: linear-gradient(135deg, var(--brand-blue) 0%, var(--brand-navy-deep) 100%);

  /* ---- Cor: semântica ---- */
  --color-success: #2fd07a;
  --color-success-soft: rgba(47, 208, 122, 0.14);
  --color-warning: #f6a831;
  --color-warning-soft: rgba(246, 168, 49, 0.14);
  --color-danger: #ff5c6a;
  --color-danger-soft: rgba(255, 92, 106, 0.14);
  --color-info: #4fb3ff;
  --color-info-soft: rgba(79, 179, 255, 0.14);

  /* ---- Cor: texto ---- */
  --text-primary: #eef3f7;
  --text-secondary: #93a3b8;
  --text-tertiary: #566579;
  --text-on-accent: #ffffff;
  --text-disabled: #3d4a5c;

  /* ---- Tipografia ---- */
  --font-display: "Sora", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;

  --fs-xs: 0.6875rem;   /* 11px */
  --fs-sm: 0.8125rem;   /* 13px */
  --fs-base: 0.9375rem; /* 15px */
  --fs-md: 1.0625rem;   /* 17px */
  --fs-lg: 1.375rem;    /* 22px */
  --fs-xl: 1.75rem;     /* 28px */
  --fs-xxl: 2.375rem;   /* 38px */

  --lh-tight: 1.2;
  --lh-normal: 1.5;

  /* ---- Espaçamento (escala base 4px) ---- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* ---- Raio ---- */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 999px;

  /* ---- Sombra ---- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.28);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.48);
  --shadow-glow: 0 0 0 1px var(--accent-primary-border), 0 0 24px rgba(46, 99, 166, 0.2);

  /* ---- Layout ---- */
  --sidebar-width: 248px;
  --sidebar-width-collapsed: 72px;
  --topbar-height: 64px;

  /* ---- Transições ---- */
  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 200ms;
  --dur-slow: 320ms;
}

/* ==========================================================================
   TEMA CLARO
   Sobrescreve só os tokens de superfície/texto/borda/sombra — marca (teal/navy)
   e cores semânticas seguem as mesmas em ambos os temas.
   ========================================================================== */
[data-theme="light"] {
  --bg-base: #f4f6f9;
  --bg-surface: #ffffff;
  --bg-elevated: #eef1f6;
  --bg-elevated-hover: #e4e9f0;
  --bg-overlay: rgba(15, 23, 32, 0.4);

  --border-subtle: #e3e8ef;
  --border-default: #d4dbe5;
  --border-strong: #b9c3d1;

  --accent-primary-soft: rgba(46, 99, 166, 0.12);
  --accent-primary-border: rgba(46, 99, 166, 0.4);

  --color-success-soft: rgba(47, 208, 122, 0.12);
  --color-warning-soft: rgba(246, 168, 49, 0.12);
  --color-danger-soft: rgba(255, 92, 106, 0.12);
  --color-info-soft: rgba(79, 179, 255, 0.12);

  --text-primary: #101828;
  --text-secondary: #4b5768;
  --text-tertiary: #8996a8;
  --text-disabled: #c3cbd6;

  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
  --shadow-md: 0 4px 16px rgba(16, 24, 40, 0.08);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, 0.12);
  --shadow-glow: 0 0 0 1px var(--accent-primary-border), 0 0 20px rgba(46, 99, 166, 0.14);
}

/* ==========================================================================
   FONTYS WORKSPACE — BASE
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
  font-weight: 600;
  line-height: var(--lh-tight);
  margin: 0;
  letter-spacing: -0.01em;
}

p { margin: 0; }

a { color: inherit; text-decoration: none; }

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

ul, ol { list-style: none; margin: 0; padding: 0; }

svg { display: block; }

::selection {
  background: var(--accent-primary-soft);
  color: var(--text-primary);
}

/* ---- Scrollbar ---- */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--radius-full);
}
::-webkit-scrollbar-thumb:hover { background: #4a5266; }

/* ---- Foco visível (acessibilidade) ---- */
:focus-visible {
  outline: 2px solid var(--accent-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* ---- Utilitários ---- */
.hidden { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
.text-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.text-secondary { color: var(--text-secondary); }
.text-tertiary { color: var(--text-tertiary); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ==========================================================================
   FONTYS WORKSPACE — LAYOUT DO SHELL
   ========================================================================== */

#app-root { height: 100%; }

.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr;
  grid-template-rows: 100%;
  height: 100vh;
  transition: grid-template-columns var(--dur-slow) var(--ease-standard);
}

.app-shell.is-collapsed {
  grid-template-columns: var(--sidebar-width-collapsed) 1fr;
}

/* ---------------- SIDEBAR ---------------- */

.sidebar {
  background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: var(--space-5) var(--space-3);
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-2) var(--space-6);
  white-space: nowrap;
}

.sidebar-brand .logo-mark { flex: none; }

.sidebar-brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}

.sidebar-brand-text strong {
  font-family: var(--font-display);
  font-size: var(--fs-md);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.sidebar-brand-text span {
  font-size: var(--fs-xs);
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  margin: 0 calc(var(--space-3) * -1);
  padding: 0 var(--space-3);
}

.nav-group { margin-bottom: var(--space-5); }

.nav-group-label {
  font-size: var(--fs-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-tertiary);
  padding: 0 var(--space-3);
  margin-bottom: var(--space-2);
  white-space: nowrap;
}

.nav-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-size: var(--fs-sm);
  font-weight: 500;
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard);
}

.nav-item:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
}

.nav-item.is-active {
  background: var(--accent-primary-soft);
  color: var(--text-primary);
}

.nav-item.is-active::before {
  content: "";
  position: absolute;
  left: -12px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 18px;
  border-radius: var(--radius-full);
  background: var(--accent-gradient);
  box-shadow: 0 0 8px rgba(46, 99, 166, 0.6);
}

.nav-item .nav-icon { flex: none; width: 18px; height: 18px; opacity: 0.9; }

.sidebar-footer {
  border-top: 1px solid var(--border-subtle);
  padding-top: var(--space-4);
  margin-top: var(--space-3);
}

.sidebar-collapse-btn {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: 100%;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  color: var(--text-tertiary);
  font-size: var(--fs-xs);
}
.sidebar-collapse-btn:hover { background: var(--bg-elevated); color: var(--text-secondary); }

.app-shell.is-collapsed .sidebar-brand-text,
.app-shell.is-collapsed .nav-group-label,
.app-shell.is-collapsed .nav-item span,
.app-shell.is-collapsed .sidebar-collapse-btn span {
  display: none;
}
.app-shell.is-collapsed .sidebar-brand { justify-content: center; padding-left: 0; padding-right: 0; }
.app-shell.is-collapsed .nav-item { justify-content: center; }
.app-shell.is-collapsed .nav-item.is-active::before { left: -9px; }

/* ---------------- MAIN ---------------- */

.app-main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100vh;
}

.topbar {
  height: var(--topbar-height);
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: 0 var(--space-6);
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-base);
}

.topbar-left { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
.topbar-right { display: flex; align-items: center; gap: var(--space-3); }

.topbar-title {
  font-family: var(--font-display);
  font-size: var(--fs-md);
  font-weight: 600;
  white-space: nowrap;
}

.topbar-search {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  color: var(--text-tertiary);
  font-size: var(--fs-sm);
  width: 280px;
  transition: border-color var(--dur-fast) var(--ease-standard);
}
.topbar-search:focus-within { border-color: var(--accent-primary-border); }
.topbar-search input {
  background: none; border: none; outline: none;
  color: var(--text-primary); width: 100%;
}
.topbar-search kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-tertiary);
  border: 1px solid var(--border-default);
  border-radius: 4px;
  padding: 1px 5px;
}

.icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px; height: 34px;
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  position: relative;
}
.icon-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
.icon-btn .dot {
  position: absolute; top: 6px; right: 7px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--color-danger);
  border: 2px solid var(--bg-base);
}

.user-chip {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-1) var(--space-2) var(--space-1) var(--space-1);
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
}
.user-chip:hover { background: var(--bg-elevated); }

.user-chip-wrap { position: relative; }
.user-dropdown-menu {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 120;
  min-width: 180px;
  background: var(--bg-elevated); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  padding: var(--space-2);
  display: flex; flex-direction: column; gap: 2px;
}
.user-dropdown-item {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  font-size: var(--fs-sm); color: var(--text-primary);
  background: none; border: none; text-align: left; cursor: pointer; width: 100%;
}
.user-dropdown-item:hover { background: var(--bg-base); }
.user-dropdown-item.is-danger:hover { color: var(--color-danger); }
.user-dropdown-divider { height: 1px; background: var(--border-subtle); margin: var(--space-1) 0; }

.notificacoes-menu { min-width: 320px; max-height: 420px; overflow-y: auto; padding: 0; }
.notificacoes-header {
  font-size: var(--fs-sm); font-weight: 600; padding: var(--space-3) var(--space-3) var(--space-2);
  border-bottom: 1px solid var(--border-subtle);
}
.notificacao-item { padding: var(--space-3); border-bottom: 1px solid var(--border-subtle); }
.notificacao-item:last-child { border-bottom: none; }
.notificacao-item-corpo { font-size: var(--fs-sm); line-height: 1.4; color: var(--text-primary); }
.notificacao-item-quando { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
.notificacao-item-acoes { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
.notificacao-item-acoes .btn { flex: 1; padding: 6px 10px; font-size: var(--fs-xs); }

.avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--accent-gradient);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  color: #fff;
  flex: none;
}
.avatar.lg { width: 40px; height: 40px; font-size: 14px; }

.user-chip-info { display: flex; flex-direction: column; line-height: 1.15; }
.user-chip-info strong { font-size: var(--fs-xs); font-weight: 600; }
.user-chip-info span { font-size: 10px; color: var(--text-tertiary); }

.app-content {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6);
}

@media (max-width: 960px) {
  .topbar-search { display: none; }
}

/* ============================ SIDEBAR AZUL NO TEMA CLARO ============================ */
/* No modo claro, a barra lateral mantém a identidade de marca (navy/teal)
   em vez de virar branca — funciona como uma âncora visual fixa. */

[data-theme="light"] .sidebar {
  background: linear-gradient(180deg, var(--brand-navy-deep) 0%, var(--brand-navy) 100%);
  border-right: none;
}
[data-theme="light"] .sidebar-brand-text strong { color: #ffffff; }
[data-theme="light"] .sidebar-brand-text span { color: rgba(255, 255, 255, 0.6); }
[data-theme="light"] .nav-group-label { color: rgba(255, 255, 255, 0.45); }
[data-theme="light"] .nav-item { color: rgba(255, 255, 255, 0.78); }
[data-theme="light"] .nav-item:hover { background: rgba(255, 255, 255, 0.1); color: #ffffff; }
[data-theme="light"] .nav-item.is-active { background: rgba(255, 255, 255, 0.16); color: #ffffff; }
[data-theme="light"] .sidebar-footer { border-top-color: rgba(255, 255, 255, 0.15); }
[data-theme="light"] .sidebar-collapse-btn { color: rgba(255, 255, 255, 0.65); }
[data-theme="light"] .sidebar-collapse-btn:hover { background: rgba(255, 255, 255, 0.1); color: #ffffff; }

/* ==========================================================================
   FONTYS WORKSPACE — COMPONENTES
   ========================================================================== */

/* ---- Botões ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  height: 36px;
  padding: 0 var(--space-4);
  border-radius: var(--radius-md);
  font-size: var(--fs-sm);
  font-weight: 600;
  border: 1px solid transparent;
  transition: all var(--dur-fast) var(--ease-standard);
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }

.btn-primary { background: var(--accent-gradient); color: #fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover { filter: brightness(1.08); }

.btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--border-default); }
.btn-secondary:hover { background: var(--bg-elevated-hover); }

.btn-ghost { color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg-elevated); color: var(--text-primary); }

.btn-danger { background: var(--color-danger-soft); color: var(--color-danger); }
.btn-danger:hover { background: rgba(255, 92, 106, 0.24); }

.btn-sm { height: 30px; padding: 0 var(--space-3); font-size: var(--fs-xs); }
.btn-icon { width: 36px; padding: 0; }

/* ---- Cards ---- */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-4);
}
.card-title {
  font-family: var(--font-display);
  font-size: var(--fs-base);
  font-weight: 600;
}
.card-subtitle { font-size: var(--fs-xs); color: var(--text-tertiary); margin-top: 2px; }

/* ---- KPI Card ---- */
.kpi-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-top: 2px solid var(--kpi-accent, var(--accent-primary));
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.kpi-top { display: flex; align-items: center; justify-content: space-between; }
.kpi-label { font-size: var(--fs-xs); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.kpi-icon {
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--kpi-accent, var(--accent-primary)) 16%, transparent);
  color: var(--kpi-accent, var(--accent-primary));
}
.kpi-value {
  font-family: var(--font-mono);
  font-size: var(--fs-xxl);
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.kpi-delta { display: flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 600; }
.kpi-delta.up { color: var(--color-success); }
.kpi-delta.down { color: var(--color-danger); }
.kpi-delta-note { color: var(--text-tertiary); font-weight: 400; }

/* ---- Badges ---- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-success { background: var(--color-success-soft); color: var(--color-success); }
.badge-warning { background: var(--color-warning-soft); color: var(--color-warning); }
.badge-danger  { background: var(--color-danger-soft); color: var(--color-danger); }
.badge-info    { background: var(--color-info-soft); color: var(--color-info); }
.badge-neutral { background: var(--bg-elevated); color: var(--text-secondary); }
.badge-neutral::before { display:none; }

/* ---- Avatares empilhados ---- */
.avatar-stack { display: flex; }
.avatar-stack .avatar { border: 2px solid var(--bg-surface); margin-left: -8px; }
.avatar-stack .avatar:first-child { margin-left: 0; }

/* ---- Listas de item (agenda / tarefas / atividade) ---- */
.item-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-2);
  border-radius: var(--radius-md);
  transition: background var(--dur-fast) var(--ease-standard);
}
.item-row:hover { background: var(--bg-elevated); }
.item-row + .item-row { border-top: 1px solid var(--border-subtle); }

.item-time {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-tertiary);
  width: 52px;
  flex: none;
}
.item-color-bar { width: 3px; align-self: stretch; border-radius: var(--radius-full); flex: none; }
.item-body { flex: 1; min-width: 0; }
.item-title { font-size: var(--fs-sm); font-weight: 500; color: var(--text-primary); }
.item-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

.item-owner-tag {
  display: flex; align-items: center; gap: 5px; flex: none;
  font-size: 11px; color: var(--text-tertiary);
  padding: 3px 8px 3px 3px; border-radius: var(--radius-full); background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
}
.item-owner-tag .avatar { flex: none; }

.item-externo-icon { vertical-align: -2px; color: var(--accent-primary); margin-right: 2px; }
.item-externo-nome { color: var(--text-tertiary); font-weight: 400; }

.agendamento-publico-info-box {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; margin-bottom: var(--space-4);
  border-radius: var(--radius-md); background: var(--accent-primary-soft, rgba(33,179,181,.1));
  border: 1px solid var(--accent-primary-border, var(--accent-primary));
  font-size: var(--fs-sm); color: var(--text-primary);
}
.agendamento-publico-info-box svg { flex: none; margin-top: 2px; color: var(--accent-primary); }

/* ---- Progress bar ---- */
.progress-track {
  height: 6px;
  border-radius: var(--radius-full);
  background: var(--bg-elevated);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: var(--radius-full);
  background: var(--accent-gradient);
}

/* ---- Empty state ---- */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-10) var(--space-4);
  color: var(--text-tertiary);
  gap: var(--space-2);
}
.empty-state strong { color: var(--text-secondary); font-size: var(--fs-sm); }
.empty-state p { font-size: var(--fs-xs); max-width: 240px; }

/* ---- Inputs ---- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: var(--fs-xs); font-weight: 600; color: var(--text-secondary); }
.field input, .field select, .field textarea {
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease-standard);
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent-primary); }
.field input::placeholder { color: var(--text-tertiary); }

/* ---- Skeleton loading ---- */
@keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
.skeleton { background: var(--bg-elevated); border-radius: var(--radius-sm); animation: pulse 1.4s ease-in-out infinite; }

/* ---- Grids utilitários ---- */
.grid { display: grid; gap: var(--space-5); }
.grid-kpi { grid-template-columns: repeat(4, 1fr); }
.grid-2-1 { grid-template-columns: 2fr 1fr; }
.grid-2col { grid-template-columns: 1fr 1fr; }

@media (max-width: 1200px) {
  .grid-kpi { grid-template-columns: repeat(2, 1fr); }
  .grid-2-1, .grid-2col { grid-template-columns: 1fr; }
}

/* ---- Modal genérico ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-overlay);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  animation: fadeIn var(--dur-base) var(--ease-standard);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 560px;
  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 64px);
  overflow-y: auto;
  animation: modalIn var(--dur-slow) var(--ease-standard);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-5) var(--space-5) var(--space-4);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.modal-header h3 { font-size: var(--fs-md); }
.modal-body { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); }
.modal-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  border-top: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.modal-close-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--text-tertiary);
}
.modal-close-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }

.chip-select { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.chip-option {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-default);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--text-secondary);
  transition: all var(--dur-fast) var(--ease-standard);
}
.chip-option .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip-option.is-selected {
  border-color: var(--chip-color, var(--accent-primary));
  background: color-mix(in srgb, var(--chip-color, var(--accent-primary)) 16%, transparent);
  color: var(--text-primary);
}

.people-select { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.people-option {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px 4px 4px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-default);
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--text-secondary);
}
.people-option.is-selected { border-color: var(--accent-primary-border); background: var(--accent-primary-soft); color: var(--text-primary); }
.people-option .avatar { width: 20px; height: 20px; font-size: 9px; }

/* ---- Ações rápidas em cards (editar/inativar/excluir) ---- */
.cliente-card { position: relative; }
.quick-actions {
  position: absolute;
  top: var(--space-3);
  right: var(--space-3);
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity var(--dur-fast) var(--ease-standard);
}
.cliente-card:hover .quick-actions { opacity: 1; }
.quick-action-btn {
  width: 24px; height: 24px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 14px;
}
.quick-action-btn:hover { background: var(--bg-elevated-hover); color: var(--text-primary); }
.quick-action-btn.is-danger:hover { color: var(--color-danger); border-color: var(--color-danger); }

/* ---- Fade-in de conteúdo ---- */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.view-enter { animation: fadeInUp var(--dur-slow) var(--ease-standard); }

/* ============================ TOAST E CONFIRM DIALOG ============================ */

.toast-container {
  position: fixed; bottom: 24px; right: 24px; z-index: 500;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-elevated); border: 1px solid var(--border-default);
  border-left: 3px solid var(--color-success);
  border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  padding: 12px 16px; font-size: var(--fs-sm); color: var(--text-primary);
  min-width: 220px; max-width: 360px;
  opacity: 0; transform: translateY(8px);
  transition: opacity var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
}
.toast.is-visible { opacity: 1; transform: translateY(0); }
.toast-icon { display: flex; flex: none; color: var(--color-success); }
.toast-error { border-left-color: #ff5c6a; }
.toast-error .toast-icon { color: #ff5c6a; }
.toast-info { border-left-color: var(--accent-primary); }
.toast-info .toast-icon { color: var(--accent-primary); }

.confirm-dialog-overlay { z-index: 400; }
.confirm-dialog-panel { width: 420px; }
.confirm-dialog-body { padding-top: 24px; padding-bottom: 4px; }
.confirm-dialog-message { font-size: var(--fs-sm); color: var(--text-secondary); line-height: 1.55; }

/* ==========================================================================
   FONTYS WORKSPACE — LOGIN
   ========================================================================== */

.agendamento-publico-page {
  min-height: 100vh;
  background: var(--bg-base);
  display: flex;
  justify-content: center;
  padding: var(--space-10) var(--space-4);
}
.agendamento-publico-container { width: 100%; max-width: 900px; }
.agendamento-modo-toggle { display: flex; gap: 6px; margin-bottom: var(--space-4); }
.agendamento-modo-btn {
  padding: 6px 14px; border-radius: var(--radius-full); border: 1px solid var(--border-subtle);
  background: var(--bg-elevated); color: var(--text-secondary); font-size: var(--fs-sm); font-weight: 600; cursor: pointer;
}
.agendamento-modo-btn.is-ativo { background: var(--accent-primary); border-color: var(--accent-primary); color: #fff; }
.agendamento-mes-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }
.agendamento-mes-nav-btn {
  width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);
  background: var(--bg-elevated); color: var(--text-primary); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.agendamento-mes-nav-btn:disabled { opacity: .3; cursor: default; }
.agendamento-mes-nav-btn:not(:disabled):hover { border-color: var(--accent-primary); color: var(--accent-primary); }
.agendamento-mes-titulo { font-size: var(--fs-md); font-weight: 700; text-transform: capitalize; }
.agendamento-mes-grid { width: 100%; border-collapse: collapse; }
.agendamento-mes-cabecalho { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
.agendamento-mes-cabecalho > div { text-align: center; font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; padding-bottom: 6px; }
.agendamento-mes-semana { display: grid; grid-template-columns: repeat(7, 1fr); }
.agendamento-mes-dia {
  min-height: 56px; padding: 6px 4px; border: 1px solid var(--border-subtle);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.agendamento-mes-dia.is-fora-mes { opacity: .28; }
.agendamento-mes-dia-numero { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.agendamento-mes-dia-slots { display: flex; flex-direction: column; gap: 3px; width: 100%; }
.agendamento-slot-quadrado-pequeno {
  width: 100%; height: 32px; padding: 3px 2px; border-radius: 4px; border: 1px solid var(--border-subtle);
  background: var(--bg-elevated); font-size: 11px; font-weight: 600; cursor: pointer; color: var(--text-primary);
}
.agendamento-slot-quadrado-pequeno:hover { border-color: var(--accent-primary); color: var(--accent-primary); }

.login-screen {
  position: relative;
  height: 100vh;
  display: grid;
  grid-template-columns: 1fr 460px;
  background: var(--bg-base);
}

.login-visual {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 20% 20%, rgba(46, 99, 166, 0.22), transparent 45%),
    radial-gradient(circle at 80% 75%, rgba(28, 100, 148, 0.22), transparent 50%),
    var(--bg-surface);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  padding: var(--space-12);
}

.login-visual-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--border-subtle) 1px, transparent 1px),
    linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(circle at 30% 30%, black, transparent 70%);
  opacity: 0.5;
}

.login-brand-row { display: flex; align-items: center; gap: var(--space-3); position: relative; z-index: 1; }
.login-brand-row strong { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 700; }

.login-datetime {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; gap: 2px;
  margin-top: var(--space-4);
}
.login-datetime #login-datetime-dia { font-size: var(--fs-xs); color: var(--text-secondary); }
.login-datetime #login-datetime-hora { font-size: var(--fs-xl); font-weight: 700; font-family: var(--font-body); color: var(--text-primary); }

.login-welcome {
  flex: 1;
  position: relative; z-index: 1;
  display: flex; flex-direction: column; justify-content: center;
  width: 100%;
}
.login-welcome-inner { max-width: 480px; text-align: left; }
.login-welcome h2 { font-size: 27px; line-height: 1.35; font-weight: 700; color: var(--text-primary); }
.login-welcome h2 .accent { color: var(--accent-primary); }
.login-welcome-sub { display: inline-block; margin-top: 4px; font-size: 16px; font-weight: 500; color: var(--text-secondary); }
.login-welcome p { color: var(--text-secondary); font-size: var(--fs-sm); line-height: 1.6; margin-top: var(--space-4); }

.login-quote {
  position: relative; z-index: 1;
  text-align: center;
  max-width: 540px; margin: 0 auto;
}
.login-quote p { font-size: var(--fs-lg); font-style: italic; color: var(--text-tertiary); line-height: 1.6; }

.login-panel {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: var(--space-12);
}

.login-panel-inner { width: 100%; max-width: 320px; margin: 0 auto; }

.login-panel h1 { font-size: var(--fs-xl); margin-bottom: var(--space-2); }
.login-panel .subtitle { color: var(--text-secondary); font-size: var(--fs-sm); margin-bottom: var(--space-8); }

.login-form { display: flex; flex-direction: column; gap: var(--space-4); }

.login-error {
  display: none;
  align-items: center;
  gap: var(--space-2);
  background: var(--color-danger-soft);
  color: var(--color-danger);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  font-size: var(--fs-xs);
  font-weight: 600;
}
.login-error.is-visible { display: flex; }

.login-submit { width: 100%; height: 42px; margin-top: var(--space-2); }

.login-demo {
  margin-top: var(--space-8);
  border-top: 1px solid var(--border-subtle);
  padding-top: var(--space-5);
}
.login-demo p { font-size: var(--fs-xs); color: var(--text-tertiary); margin-bottom: var(--space-3); }
.demo-accounts { display: flex; flex-direction: column; gap: var(--space-2); }
.demo-account-btn {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  text-align: left;
  transition: border-color var(--dur-fast) var(--ease-standard), background var(--dur-fast) var(--ease-standard);
}
.demo-account-btn:hover { background: var(--bg-elevated); border-color: var(--border-default); }
.demo-account-btn .info { display: flex; flex-direction: column; line-height: 1.2; }
.demo-account-btn strong { font-size: var(--fs-xs); font-weight: 600; }
.demo-account-btn span { font-size: 10px; color: var(--text-tertiary); }

@media (max-width: 860px) {
  .login-screen { grid-template-columns: 1fr; }
  .login-visual { display: none; }
}

/* ==========================================================================
   FONTYS WORKSPACE — DASHBOARD
   ========================================================================== */

.dash-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: var(--space-6);
}
.dash-header h1 { font-size: var(--fs-xl); }
.dash-header p { color: var(--text-secondary); font-size: var(--fs-sm); margin-top: 4px; }

.subtle-stat {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-xs);
  color: var(--text-tertiary);
  padding: 5px 10px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
}
.subtle-stat span { font-weight: 600; color: var(--text-secondary); }

.dash-section { margin-top: var(--space-6); }

.pipeline-stage {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  flex: 1;
}
.pipeline-stage-head { display: flex; align-items: center; justify-content: space-between; font-size: var(--fs-xs); }
.pipeline-stage-head strong { color: var(--text-primary); }
.pipeline-stage-head span { color: var(--text-tertiary); font-family: var(--font-mono); }
.pipeline-bar { display: flex; gap: var(--space-5); }

.chart-legend { display: flex; gap: var(--space-4); margin-top: var(--space-3); flex-wrap: wrap; }
.chart-legend-item { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-secondary); }
.chart-legend-dot { width: 8px; height: 8px; border-radius: 50%; }

.activity-icon {
  width: 30px; height: 30px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-elevated);
}

.tab-row {
  display: flex;
  gap: var(--space-1);
  background: var(--bg-elevated);
  padding: 3px;
  border-radius: var(--radius-md);
  width: fit-content;
}
.tab-btn {
  padding: 6px 14px;
  border-radius: 8px;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--text-tertiary);
}
.tab-btn.is-active { background: var(--bg-surface); color: var(--text-primary); box-shadow: var(--shadow-sm); }

/* ==========================================================================
   FONTYS WORKSPACE — AGENDA
   ========================================================================== */

.agenda-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-5);
  flex-wrap: wrap;
  gap: var(--space-3);
}
.agenda-toolbar-left { display: flex; align-items: center; gap: var(--space-3); }
.agenda-nav { display: flex; align-items: center; gap: 2px; }
.agenda-title { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 600; min-width: 220px; text-transform: capitalize; }

.agenda-legend { display: flex; gap: var(--space-4); margin-bottom: var(--space-4); flex-wrap: wrap; }

/* ---------------- Seletor de cor (livre, sem categorias fixas) ---------------- */
.color-swatch-row { display: flex; gap: 10px; }
.color-swatch {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard);
}
.color-swatch:hover { transform: scale(1.08); }
.color-swatch.is-selected { border-color: var(--text-primary); box-shadow: 0 0 0 2px var(--bg-surface), 0 0 0 4px currentColor; }

/* ---------------- Lista de participantes (colaboradores ativos) ---------------- */
.people-list {
  display: flex;
  flex-direction: column;
  max-height: 200px;
  overflow-y: auto;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
}
.people-list-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  cursor: pointer;
  border-bottom: 1px solid var(--border-subtle);
}
.people-list-row:last-child { border-bottom: none; }
.people-list-row:hover { background: var(--bg-elevated-hover); }
.people-list-row input[type="checkbox"] { accent-color: var(--accent-primary); width: 15px; height: 15px; flex: none; }
.people-list-name { font-size: var(--fs-sm); font-weight: 500; }
.people-list-cargo { font-size: 11px; color: var(--text-tertiary); margin-left: auto; }

.people-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.people-chip {
  display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 3px;
  border: 1px solid var(--border-subtle); border-radius: var(--radius-full); background: var(--bg-elevated);
}
.people-chip .avatar { width: 20px; height: 20px; font-size: 9px; }
.people-chip-nome { font-size: var(--fs-xs); font-weight: 500; }
.people-chip-remover { background: none; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; }
.people-chip-remover:hover { color: var(--color-danger); }
.people-chip-add {
  display: flex; align-items: center; gap: 4px; padding: 4px 10px;
  border: 1px dashed var(--border-default); border-radius: var(--radius-full);
  background: none; color: var(--text-secondary); font-size: var(--fs-xs); font-weight: 500; cursor: pointer;
}
.people-chip-add:hover { border-color: var(--accent-primary); color: var(--accent-primary); }

.agenda-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }

/* ---------------- MÊS ---------------- */

.month-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-bottom: 1px solid var(--border-subtle);
}
.month-weekdays span {
  padding: var(--space-3) var(--space-2);
  text-align: center;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: minmax(112px, 1fr);
}

.month-cell {
  border-right: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
  padding: var(--space-2);
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
  min-width: 0;
  transition: background var(--dur-fast) var(--ease-standard);
}
.month-cell:nth-child(7n) { border-right: none; }
.month-cell.is-outside { background: rgba(0,0,0,0.14); }
.month-cell.is-outside .month-cell-num { color: var(--text-tertiary); }
.month-cell.is-drag-over { background: var(--accent-primary-soft); }

.month-cell-head { display: flex; align-items: center; justify-content: space-between; }
.month-cell-num {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--text-secondary);
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  cursor: pointer;
}
.month-cell-num:hover { background: var(--bg-elevated); }
.month-cell.is-today .month-cell-num { background: var(--accent-gradient); color: #fff; }

.month-cell-add {
  width: 18px; height: 18px;
  border-radius: 4px;
  display: none;
  align-items: center; justify-content: center;
  color: var(--text-tertiary);
}
.month-cell:hover .month-cell-add { display: flex; }
.month-cell-add:hover { background: var(--bg-elevated); color: var(--text-primary); }

.month-event-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 2px 6px;
  border-radius: 5px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-primary);
  background: var(--pill-color-soft, rgba(79,99,255,0.16));
  cursor: grab;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.month-event-pill:active { cursor: grabbing; }
.month-event-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pill-color, var(--accent-primary)); flex: none; }
.month-event-pill .time { font-family: var(--font-mono); opacity: 0.7; flex: none; }
.month-cell-more { font-size: 10.5px; color: var(--text-tertiary); padding: 1px 6px; font-weight: 600; }

/* ---------------- SEMANA / DIA ---------------- */

.timegrid-wrap { display: flex; overflow-x: auto; }
.timegrid-gutter { flex: none; width: 56px; }
.timegrid-days { flex: 1; display: grid; }

.timegrid-header {
  display: grid;
  border-bottom: 1px solid var(--border-subtle);
  position: sticky; top: 0; background: var(--bg-surface); z-index: 2;
}
.timegrid-header-cell {
  padding: var(--space-3) var(--space-2);
  text-align: center;
  border-right: 1px solid var(--border-subtle);
}
.timegrid-header-cell .wd { font-size: var(--fs-xs); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }
.timegrid-header-cell .num {
  font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-base);
  width: 28px; height: 28px; line-height: 28px; margin: 2px auto 0; border-radius: 50%;
}
.timegrid-header-cell.is-today .num { background: var(--accent-gradient); color: #fff; }

.timegrid-body { display: flex; max-height: 640px; overflow-y: auto; }
.timegrid-hours { flex: none; width: 56px; }
.timegrid-hour-label {
  height: 56px;
  font-size: 10.5px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  text-align: right;
  padding-right: 8px;
  transform: translateY(-6px);
}
.timegrid-columns { flex: 1; display: grid; position: relative; }
.timegrid-col {
  position: relative;
  border-right: 1px solid var(--border-subtle);
  background-image: repeating-linear-gradient(to bottom, var(--border-subtle) 0, var(--border-subtle) 1px, transparent 1px, transparent 56px);
}
.timegrid-col.is-today { background-color: rgba(79, 99, 255, 0.045); }

.event-block {
  position: absolute;
  left: 3px; right: 3px;
  border-radius: 7px;
  padding: 4px 7px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: var(--block-color, var(--accent-primary));
  overflow: hidden;
  cursor: grab;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(255,255,255,0.12);
}
.event-block:active { cursor: grabbing; }
.event-block .ev-time { font-size: 10px; opacity: 0.85; font-family: var(--font-mono); display: block; }
.event-block .ev-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.allday-row {
  display: grid;
  border-bottom: 1px solid var(--border-subtle);
  padding: 6px 0;
  gap: 4px;
}
.allday-cell { padding: 0 6px; display: flex; flex-direction: column; gap: 3px; }
.allday-chip {
  font-size: 10px; font-weight: 600; color: #fff;
  background: var(--chip-color, var(--accent-primary));
  border-radius: 5px; padding: 2px 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---------------- DIA (lista lateral) ---------------- */

.day-layout { display: grid; grid-template-columns: 1fr 300px; gap: var(--space-5); align-items: flex-start; }
@media (max-width: 1100px) { .day-layout { grid-template-columns: 1fr; } }

/* ==========================================================================
   FONTYS WORKSPACE — TAREFAS
   ========================================================================== */

.tarefas-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-5);
  flex-wrap: wrap;
  gap: var(--space-3);
}
.tarefas-toolbar-left { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }

.tarefas-search {
  display: flex; align-items: center; gap: var(--space-2);
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 7px 10px;
  color: var(--text-tertiary); font-size: var(--fs-sm); width: 220px;
}
.tarefas-search input { background: none; border: none; outline: none; color: var(--text-primary); width: 100%; }

.filter-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 11px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-default);
  background: var(--bg-surface);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--text-secondary);
}
.filter-chip select {
  background: none; border: none; outline: none; color: var(--text-primary);
  font-size: var(--fs-xs); font-weight: 600;
}
.filter-chip select option { background: var(--bg-elevated); color: var(--text-primary); }

/* ---------------- KANBAN ---------------- */

.kanban-board {
  display: grid;
  grid-template-columns: repeat(4, minmax(260px, 1fr));
  gap: var(--space-4);
  align-items: start;
  overflow-x: auto;
}

.kanban-column {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--space-3);
  min-height: 120px;
  transition: background var(--dur-fast) var(--ease-standard);
}
.kanban-column.is-drag-over { background: var(--accent-primary-soft); }

.kanban-column-head {
  display: flex; align-items: center; gap: 8px;
  padding: var(--space-2) var(--space-2) var(--space-3);
}
.kanban-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.kanban-column-head strong { font-size: var(--fs-sm); font-weight: 600; }
.kanban-column-head span { font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); margin-left: auto; }

.kanban-cards { display: flex; flex-direction: column; gap: var(--space-2); min-height: 40px; }

.kanban-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  cursor: grab;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.kanban-card:active { cursor: grabbing; }
.kanban-card:hover { border-color: var(--border-strong); }
.kanban-card-title { font-size: var(--fs-sm); font-weight: 600; line-height: 1.35; }
.kanban-card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kanban-card-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.kanban-tag {
  font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: var(--radius-full);
  background: var(--bg-surface); color: var(--text-secondary); border: 1px solid var(--border-subtle);
}
.kanban-card-footer { display: flex; align-items: center; justify-content: space-between; }
.kanban-card-due { font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); display: flex; align-items: center; gap: 4px; }
.kanban-card-due.is-overdue { color: var(--color-danger); font-weight: 600; }
.kanban-checklist-mini { font-size: 11px; color: var(--text-tertiary); display: flex; align-items: center; gap: 4px; }

/* ---------------- LISTA ---------------- */

.tarefas-list-group { margin-bottom: var(--space-5); }
.tarefas-list-group-head {
  display: flex; align-items: center; gap: 8px;
  padding: var(--space-2) 0; margin-bottom: var(--space-1);
}
.tarefas-list-group-head strong { font-size: var(--fs-sm); }
.tarefas-list-group-head span { font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); }

.tarefa-row {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3);
  border-radius: var(--radius-md);
  cursor: pointer;
}
.tarefa-row:hover { background: var(--bg-elevated); }
.tarefa-row + .tarefa-row { border-top: 1px solid var(--border-subtle); }

.tarefa-check {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border-strong);
  flex: none;
  display: flex; align-items: center; justify-content: center;
  color: transparent;
  transition: all var(--dur-fast) var(--ease-standard);
}
.tarefa-check:hover { border-color: var(--color-success); }
.tarefa-check.is-done { background: var(--color-success); border-color: var(--color-success); color: #fff; }

.tarefa-row-body { flex: 1; min-width: 0; }
.tarefa-row-title { font-size: var(--fs-sm); font-weight: 500; }
.tarefa-row.is-done .tarefa-row-title { text-decoration: line-through; color: var(--text-tertiary); }
.tarefa-row-meta { display: flex; align-items: center; gap: 10px; margin-top: 3px; font-size: 11px; color: var(--text-tertiary); }

.tarefa-row-right { display: flex; align-items: center; gap: 10px; flex: none; }

/* ---------------- CALENDÁRIO (reaproveita grid do mês da Agenda) ---------------- */
.tarefa-cal-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 2px 6px; border-radius: 5px; font-size: 10.5px; font-weight: 600;
  background: var(--pill-color-soft, rgba(33,179,181,0.16));
  color: var(--text-primary);
  cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tarefa-cal-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pill-color, var(--accent-primary)); flex: none; }

/* ---------------- CHECKLIST (no modal de detalhe) ---------------- */
.checklist-item { display: flex; align-items: center; gap: 8px; }
.checklist-item input[type="text"] { flex: 1; background: none; border: none; outline: none; color: var(--text-primary); font-size: var(--fs-sm); }
.checklist-item.is-done input[type="text"] { text-decoration: line-through; color: var(--text-tertiary); }
.checklist-add { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.checklist-add input {
  flex: 1;
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  color: var(--text-primary);
  font-size: var(--fs-sm);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease-standard);
}
.checklist-add input:focus { border-color: var(--accent-primary); }
.checklist-add input::placeholder { color: var(--text-tertiary); }

/* ---------------- COMENTÁRIOS ---------------- */
.comment-item { display: flex; gap: 10px; }
.comment-body { flex: 1; }
.comment-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.comment-head strong { font-size: var(--fs-xs); }
.comment-head span { font-size: 10px; color: var(--text-tertiary); }
.comment-text { font-size: var(--fs-sm); color: var(--text-secondary); line-height: 1.5; }
.comment-add { display: flex; gap: 8px; margin-top: var(--space-2); }
.comment-add textarea {
  flex: 1; min-height: 56px; resize: vertical;
  background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: var(--radius-md);
  padding: 8px 10px; color: var(--text-primary); font-family: inherit; font-size: var(--fs-sm); outline: none;
}
.comment-add textarea:focus { border-color: var(--accent-primary); }

/* ---------------- ANEXOS ---------------- */
.attachment-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: var(--radius-md);
  background: var(--bg-elevated); font-size: var(--fs-xs);
}
.attachment-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------- Detalhe da tarefa (modal maior) ---------------- */
.task-modal-panel { width: 620px; }
.task-modal-section { display: flex; flex-direction: column; gap: 8px; }
.task-modal-section-title { font-size: var(--fs-xs); font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }
.task-modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }

/* ---------------- VISÃO PROJETO ---------------- */

.projeto-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: var(--space-5);
  align-items: start;
}
@media (max-width: 900px) { .projeto-layout { grid-template-columns: 1fr; } }

.projeto-sidebar {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--space-3);
}
.projeto-sidebar-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-2) var(--space-2) var(--space-3);
  font-size: var(--fs-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary);
}
.projeto-sidebar-divider { height: 1px; background: var(--border-subtle); margin: var(--space-3) 0; }

.projeto-item {
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  cursor: pointer;
  margin-bottom: 4px;
}
.projeto-item:hover { background: var(--bg-elevated); }
.projeto-item.is-active { background: var(--accent-primary-soft); }
.projeto-item-head { display: flex; align-items: center; gap: 8px; }
.projeto-item-nome { font-size: var(--fs-sm); font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.projeto-item-meta { font-size: 10.5px; color: var(--text-tertiary); font-family: var(--font-mono); margin-top: 4px; display: block; }
.projeto-item-del {
  flex: none; width: 18px; height: 18px; border-radius: 4px;
  color: var(--text-tertiary); display: none; align-items: center; justify-content: center; font-size: 13px;
}
.projeto-item:hover .projeto-item-del { display: flex; }
.projeto-item-del:hover { background: var(--bg-elevated-hover); color: var(--color-danger); }

.projeto-main-title { font-family: var(--font-display); font-size: var(--fs-md); font-weight: 600; margin-bottom: var(--space-4); }

/* ==========================================================================
   FONTYS WORKSPACE — CLIENTES
   ========================================================================== */

.clientes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--space-4);
}

.cliente-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  transition: border-color var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
}
.cliente-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }

.cliente-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.cliente-logo {
  width: 44px; height: 44px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 16px; color: #fff;
  flex: none;
}
.cliente-card-name { font-size: var(--fs-base); font-weight: 600; line-height: 1.3; }
.cliente-card-segmento { font-size: var(--fs-xs); color: var(--text-tertiary); margin-top: 2px; }

.cliente-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: var(--space-2); border-top: 1px solid var(--border-subtle); }
.cliente-card-resp { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-tertiary); }

/* ---------------- LISTA (tabela) ---------------- */
.clientes-table { width: 100%; border-collapse: collapse; }
.clientes-table th {
  text-align: left; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-tertiary); font-weight: 600; padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
}
.clientes-table td { padding: var(--space-3); border-bottom: 1px solid var(--border-subtle); font-size: var(--fs-sm); }
.clientes-table tr:last-child td { border-bottom: none; }
.clientes-table tbody tr { cursor: pointer; transition: background var(--dur-fast) var(--ease-standard); }
.clientes-table tbody tr:hover { background: var(--bg-elevated); }
.cliente-row-name { display: flex; align-items: center; gap: 10px; font-weight: 600; }

/* ---------------- WORKSPACE DO CLIENTE (modal grande com abas) ---------------- */
.cliente-modal-panel { width: 720px; height: 82vh; max-height: 82vh; display: flex; flex-direction: column; overflow: hidden; }

.cliente-modal-head {
  display: flex; align-items: center; gap: 14px;
  padding: var(--space-5); border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.cliente-modal-head .cliente-logo { width: 52px; height: 52px; font-size: 19px; }
.cliente-modal-head-info { flex: 1; min-width: 0; }
.cliente-modal-head-info h3 { font-size: var(--fs-md); }
.cliente-modal-head-info span { font-size: var(--fs-xs); color: var(--text-tertiary); }

.cliente-tabs {
  display: flex; gap: 2px; padding: 0 var(--space-5);
  border-bottom: 1px solid var(--border-subtle);
  overflow-x: auto; flex-shrink: 0;
}
.cliente-tab-btn {
  padding: var(--space-3) var(--space-3);
  font-size: var(--fs-sm); font-weight: 600; color: var(--text-tertiary);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.cliente-tab-btn.is-active { color: var(--text-primary); border-bottom-color: var(--accent-primary); }

.cliente-tab-body { padding: var(--space-5); overflow-y: auto; flex: 1; min-height: 0; }

.cliente-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4) var(--space-5); }
.cliente-info-item { display: flex; flex-direction: column; gap: 3px; }
.cliente-info-item label { font-size: var(--fs-xs); color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.cliente-info-item span, .cliente-info-item div { font-size: var(--fs-sm); color: var(--text-primary); }

/* ---- Upload de logo (cabeçalho do modal) ---- */
.cliente-logo-upload { position: relative; cursor: default; }
.cliente-logo-upload.is-editable { cursor: pointer; }
.cliente-logo-upload-overlay {
  position: absolute; inset: 0;
  border-radius: var(--radius-md);
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  opacity: 0;
  transition: opacity var(--dur-fast) var(--ease-standard);
}
.cliente-logo-upload.is-editable:hover .cliente-logo-upload-overlay { opacity: 1; }

/* ---- Modal de corte de imagem (crop) ---- */
.crop-viewport {
  position: relative;
  overflow: hidden;
  border-radius: 50%;
  border: 2px solid var(--border-strong);
  background: var(--bg-elevated);
  touch-action: none;
  cursor: grab;
}
.crop-viewport:active { cursor: grabbing; }
.crop-viewport img {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  user-select: none;
  pointer-events: none;
  max-width: none;
}

/* ---- Slider (input range) com o visual da plataforma ---- */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: var(--radius-full);
  background: var(--bg-elevated);
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--accent-gradient);
  cursor: pointer;
  border: 2px solid var(--bg-surface);
  box-shadow: var(--shadow-sm);
}
input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--accent-primary);
  cursor: pointer;
  border: 2px solid var(--bg-surface);
}
input[type="range"]::-moz-range-track {
  height: 4px;
  border-radius: var(--radius-full);
  background: var(--bg-elevated);
}

.timeline-item { display: flex; gap: var(--space-3); padding-bottom: var(--space-4); position: relative; }
.timeline-item::before {
  content: ""; position: absolute; left: 5px; top: 20px; bottom: 0; width: 1px; background: var(--border-subtle);
}
.timeline-item:last-child::before { display: none; }
.timeline-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--accent-primary); flex: none; margin-top: 3px; }
.timeline-body { flex: 1; }
.timeline-text { font-size: var(--fs-sm); }
.timeline-date { font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); margin-top: 2px; }

.contrato-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--bg-elevated); margin-bottom: 8px;
}
.contrato-item-info { display: flex; flex-direction: column; gap: 2px; }
.contrato-item-info strong { font-size: var(--fs-sm); }
.contrato-item-info span { font-size: 11px; color: var(--text-tertiary); }
.contrato-valor { font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-sm); }

/* ==========================================================================
   FONTYS WORKSPACE — PIPELINE COMERCIAL
   ========================================================================== */

.funil-summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-4);
  margin-bottom: var(--space-5);
}

.funil-board {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  overflow-x: auto;
  padding-bottom: 4px;
}
.funil-column { flex: none; width: 220px; }

.funil-column {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-top: 3px solid var(--col-color, var(--accent-primary));
  border-radius: var(--radius-lg);
  padding: var(--space-3);
  min-height: 120px;
  transition: background var(--dur-fast) var(--ease-standard);
}
.funil-column.is-drag-over { background: var(--accent-primary-soft); }

.funil-column-head { padding: var(--space-2) var(--space-2) var(--space-3); position: relative; }
.funil-column-head strong { font-size: var(--fs-sm); font-weight: 600; display: block; padding-right: 50px; }
.funil-column-head .count { font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); }
.funil-column-head .total { font-size: var(--fs-xs); color: var(--text-secondary); font-family: var(--font-mono); font-weight: 600; margin-top: 2px; display: block; }
.funil-column-actions { position: absolute; top: var(--space-2); right: var(--space-2); display: flex; gap: 4px; opacity: 0; transition: opacity var(--dur-fast) var(--ease-standard); }
.funil-column:hover .funil-column-actions { opacity: 1; }
.funil-add-column {
  flex: none; width: 220px; height: 48px; align-self: flex-start;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  border: 1.5px dashed var(--border-strong); border-radius: var(--radius-md);
  background: transparent; color: var(--text-tertiary); font-size: var(--fs-sm); font-weight: 600;
  cursor: pointer; transition: all var(--dur-fast) var(--ease-standard);
}
.funil-add-column:hover { border-color: var(--accent-primary); color: var(--accent-primary); }

.oport-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  cursor: grab;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: var(--space-2);
}
.oport-card:active { cursor: grabbing; }
.oport-card:hover { border-color: var(--border-strong); }
.oport-card-title { font-size: var(--fs-sm); font-weight: 600; line-height: 1.35; }
.oport-card-cliente { font-size: 11px; color: var(--text-tertiary); }
.oport-card-valor { font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-base); color: var(--text-primary); }
.oport-card-footer { display: flex; align-items: center; justify-content: space-between; }
.oport-card-prob {
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: var(--radius-full);
  background: var(--accent-primary-soft); color: var(--accent-primary);
}
.oport-card-date { font-size: 10.5px; color: var(--text-tertiary); font-family: var(--font-mono); }

/* ==========================================================================
   FONTYS WORKSPACE — BRIEFING DO CLIENTE
   ========================================================================== */

.briefing-progress { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.briefing-progress .progress-track { flex: 1; }
.briefing-progress span { font-size: 10.5px; font-family: var(--font-mono); color: var(--text-tertiary); flex: none; }

.briefing-modal-panel { width: 820px; height: 85vh; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
.briefing-modal-panel .modal-body { flex: 1; min-height: 0; overflow-y: auto; }
.briefing-form-section { display: flex; flex-direction: column; gap: 14px; }
.briefing-form-section.is-hidden { display: none; }

/* ---------------- ONBOARDING WIZARD ---------------- */

.wizard-modal-panel { width: 680px; max-height: calc(100vh - 48px); }

.wizard-header { padding: var(--space-5) var(--space-5) var(--space-4); border-bottom: 1px solid var(--border-subtle); }
.wizard-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }
.wizard-header-top h3 { font-size: var(--fs-md); }
.wizard-progress-track { height: 4px; border-radius: var(--radius-full); background: var(--bg-elevated); overflow: hidden; }
.wizard-progress-fill { height: 100%; background: var(--accent-gradient); border-radius: var(--radius-full); transition: width var(--dur-slow) var(--ease-standard); }
.wizard-progress-meta { display: flex; justify-content: space-between; margin-top: 8px; }
.wizard-progress-meta span { font-size: 11px; color: var(--text-tertiary); }

.wizard-dots { display: flex; gap: 5px; align-items: center; }
.wizard-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); transition: all var(--dur-fast) var(--ease-standard); }
.wizard-dot.is-active { background: var(--accent-primary); width: 20px; border-radius: 4px; }
.wizard-dot.is-done { background: var(--accent-primary); opacity: 0.45; }

.wizard-body { padding: var(--space-5); overflow-y: auto; max-height: 480px; }
.wizard-step { display: none; flex-direction: column; gap: 16px; }
.wizard-step.is-active { display: flex; }
.wizard-step-title { font-family: var(--font-display); font-size: var(--fs-base); font-weight: 600; margin-bottom: 2px; }
.wizard-step-sub { font-size: var(--fs-xs); color: var(--text-tertiary); margin-top: -12px; margin-bottom: 4px; }

.wizard-footer { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-5); border-top: 1px solid var(--border-subtle); }

/* revisão / resumo final */
.wizard-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.wizard-summary-card { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-4); grid-column: span 2; }
.wizard-summary-card-title {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--accent-primary); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border-subtle);
}
.wizard-summary-row { display: flex; gap: 10px; margin-bottom: 7px; font-size: var(--fs-xs); }
.wizard-summary-row:last-child { margin-bottom: 0; }
.wizard-summary-key { color: var(--text-tertiary); flex: none; width: 150px; }
.wizard-summary-val { color: var(--text-primary); font-weight: 500; }
.wizard-summary-val.is-muted { color: var(--text-tertiary); font-style: italic; font-weight: 400; }

/* badge "onboarding completo" no card */
.onboarding-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 700; color: var(--color-success);
  background: var(--color-success-soft); padding: 2px 8px; border-radius: var(--radius-full);
  margin-top: 6px;
}

/* ============================ DIAGNÓSTICO ============================ */

.diag-progress-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }

.diag-area-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: var(--space-5); }
.diag-area-tab {
  padding: 7px 13px; border-radius: var(--radius-md); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.03em; border: 1.5px solid var(--border-default);
  background: transparent; color: var(--text-secondary); cursor: pointer; transition: all var(--dur-fast) var(--ease-standard);
}
.diag-area-tab:hover { border-color: var(--accent-primary); color: var(--text-primary); }
.diag-area-tab.is-active { background: var(--accent-primary); border-color: var(--accent-primary); color: #06111d; }
.diag-area-tab.is-done:not(.is-active) { border-color: var(--color-success); color: var(--color-success); }

.diag-question { margin-bottom: var(--space-5); padding-bottom: var(--space-5); border-bottom: 1px solid var(--border-subtle); }
.diag-question:last-child { border-bottom: none; }
.diag-question-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-primary); font-weight: 700; margin-bottom: 6px; }
.diag-question-text { font-size: var(--fs-sm); font-weight: 600; color: var(--text-primary); margin-bottom: 10px; line-height: 1.5; }
.diag-options { display: flex; flex-direction: column; gap: 6px; }
.diag-option {
  display: flex; align-items: flex-start; gap: 10px; padding: 9px 13px;
  border: 1.5px solid var(--border-default); border-radius: var(--radius-md);
  background: var(--bg-elevated); cursor: pointer; font-size: var(--fs-xs); color: var(--text-secondary);
  text-align: left; transition: all var(--dur-fast) var(--ease-standard); line-height: 1.45;
}
.diag-option:hover { border-color: var(--accent-primary-border); color: var(--text-primary); }
.diag-option.is-selected { border-color: var(--accent-primary); background: var(--accent-primary-soft); color: var(--text-primary); }
.diag-option-dot { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--border-strong); flex: none; margin-top: 1px; position: relative; }
.diag-option.is-selected .diag-option-dot { border-color: var(--accent-primary); background: var(--accent-primary); }
.diag-option.is-selected .diag-option-dot::after { content: ""; position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; border-radius: 50%; background: #06111d; transform: translate(-50%, -50%); }

.diag-nav { display: flex; align-items: center; justify-content: space-between; padding-top: var(--space-4); border-top: 1px solid var(--border-subtle); }

/* ---- Resultado ---- */
.diag-result-banner {
  background: var(--bg-elevated); border-radius: var(--radius-lg); padding: var(--space-5);
  display: flex; align-items: center; gap: var(--space-5); border-left: 4px solid var(--accent-primary); margin-bottom: var(--space-4);
}
.diag-result-score { font-family: var(--font-display); font-size: 48px; font-weight: 800; color: var(--text-primary); line-height: 1; }
.diag-result-score span { font-size: 18px; color: var(--accent-primary); }
.diag-result-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); font-weight: 700; margin-bottom: 6px; }

.diag-areas-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-3); margin-bottom: var(--space-4); }
.diag-area-card { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-3); text-align: center; }
.diag-area-card-name { font-size: 10.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.diag-area-card-score { font-family: var(--font-display); font-size: 22px; font-weight: 800; margin-bottom: 6px; }
.diag-area-card-status { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 6px; }

.diag-detail-card { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-3); }
.diag-detail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.diag-detail-name { font-size: var(--fs-sm); font-weight: 700; }
.diag-detail-text { font-size: var(--fs-xs); color: var(--text-secondary); line-height: 1.5; margin-bottom: 10px; }
.diag-detail-actions-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); margin-bottom: 6px; }
.diag-action-item { display: flex; align-items: flex-start; gap: 8px; font-size: var(--fs-xs); color: var(--text-secondary); margin-bottom: 5px; line-height: 1.4; }
.diag-action-bullet { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-primary); flex: none; margin-top: 6px; }
.diag-product-box { background: var(--accent-primary-soft); border: 1px solid var(--accent-primary-border); border-radius: var(--radius-md); padding: var(--space-3); margin-top: 10px; }
.diag-product-label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-primary); margin-bottom: 4px; }
.diag-product-name { font-size: var(--fs-sm); font-weight: 700; color: var(--text-primary); margin-bottom: 3px; }
.diag-product-desc { font-size: var(--fs-xs); color: var(--text-secondary); line-height: 1.4; }

.diag-result-actions { display: flex; gap: 10px; margin-top: var(--space-4); }

/* ---- Impressão do diagnóstico ---- */
.print-diag-areas-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 8px; }
.print-diag-area-card { border: 1px solid #e0e3e8; border-radius: 6px; padding: 10px; text-align: center; }
.print-diag-area-name { font-size: 9.5px; font-weight: 700; color: #444; margin-bottom: 4px; }
.print-diag-area-score { font-size: 18px; font-weight: 800; color: #101828; margin-bottom: 4px; }

/* ==========================================================================
   FONTYS WORKSPACE — ASSESSORIA
   ========================================================================== */

.assessoria-modal-panel { width: 1120px; max-width: calc(100vw - 32px); height: 88vh; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }

.objetivo-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  margin-bottom: var(--space-3);
}
.objetivo-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.objetivo-num {
  width: 26px; height: 26px; border-radius: 50%; background: var(--accent-gradient); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none;
}
.objetivo-card-head strong { font-size: var(--fs-sm); font-weight: 600; }
.objetivo-card-head p { font-size: var(--fs-xs); color: var(--text-tertiary); margin-top: 3px; }
.objetivo-card-actions { display: flex; gap: 4px; flex: none; }
.objetivo-progress { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.objetivo-progress .progress-track { flex: 1; height: 8px; }
.objetivo-progress span { font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-xs); flex: none; }

.area-card {
  position: relative;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-left: 3px solid var(--accent-primary);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  margin-bottom: var(--space-3);
}
.area-card.is-concluida { border-left-color: var(--color-success); }

.tatico-grupo { margin-bottom: var(--space-5); }
.tatico-grupo-head {
  display: flex; align-items: center; gap: 10px;
  padding: var(--space-3) var(--space-4);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-3);
}
.tatico-grupo-head-neutro { background: transparent; border-style: dashed; }
.tatico-grupo-titulo { display: block; font-size: var(--fs-md); }
.tatico-grupo-progress { width: 140px; flex: none; }
.tatico-grupo-areas { display: flex; flex-direction: column; gap: var(--space-3); padding-left: var(--space-5); border-left: 2px solid var(--border-subtle); margin-left: 13px; }

.area-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.area-card-head strong { font-size: var(--fs-sm); font-weight: 600; }
.area-card-head .tag-link { font-size: 10.5px; color: var(--accent-primary); font-weight: 600; }
.area-card-objetivo { font-size: var(--fs-xs); color: var(--text-secondary); margin: 4px 0 10px; }

.kr-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border-subtle); }
.kr-row:first-of-type { border-top: none; }
.kr-checkbox {
  flex: none; width: 18px; height: 18px; cursor: pointer; margin: 0;
  -webkit-appearance: none; appearance: none;
  border: 1.5px solid var(--border-default); border-radius: 5px;
  background: var(--bg-elevated);
  position: relative;
  transition: background .12s, border-color .12s;
}
.kr-checkbox:hover { border-color: var(--accent-primary); }
