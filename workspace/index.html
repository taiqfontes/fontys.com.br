/* ===== js/modules/pipeline.js (escopo isolado) ===== */
const { renderPipeline } = (function () {

/* ===== js/modules/pipeline.js ===== */




const CORES_ETAPA = ["#4fb3ff", "#2e63a6", "#14253b", "#f6a831", "#2fd07a", "#ff5c6a"];

const state = {
  view: "kanban",
  oportunidades: [],
  etapas: [],
  colaboradores: [],
  filters: { responsavel: "all", origem: "all", busca: "", periodo: "todos" },
  container: null,
};

function personById(id) {
  return state.colaboradores.find((p) => p.id === id) || null;
}

function etapaByChave(chave) {
  return state.etapas.find((e) => e.chave === chave) || { nome: chave, cor: "#8996a8" };
}

function currency(v) {
  return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
}

function formatDatePt(iso) {
  if (!iso) return "—";
  return parseIso(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}

function slugify(texto) {
  return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || `etapa-${Date.now()}`;
}

function dentroDoPeriodo(dataStr, periodo) {
  if (periodo === "todos" || !dataStr) return true;
  const d = parseIso(dataStr);
  const hoje = new Date();
  if (periodo === "mes") return d.getFullYear() === hoje.getFullYear() && d.getMonth() === hoje.getMonth();
  if (periodo === "trimestre") return d.getFullYear() === hoje.getFullYear() && Math.floor(d.getMonth() / 3) === Math.floor(hoje.getMonth() / 3);
  if (periodo === "ano") return d.getFullYear() === hoje.getFullYear();
  return true;
}

function getFiltered() {
  const { responsavel, origem, busca } = state.filters;
  return state.oportunidades.filter((o) => {
    if (responsavel !== "all" && o.responsavelId !== responsavel) return false;
    if (origem !== "all" && o.origem !== origem) return false;
    if (busca && !`${o.titulo} ${o.clienteNome}`.toLowerCase().includes(busca.toLowerCase())) return false;
    return true;
  });
}

async function renderPipeline(container) {
  state.container = container;
  state.oportunidades = await MockAPI.getOportunidades();
  state.etapas = (await MockAPI.getPipelineEtapas()).sort((a, b) => a.ordem - b.ordem);
  state.colaboradores = (await MockAPI.getColaboradores()).filter((c) => c.status === "ativo");
  if (!container.isConnected) return;
  paint();
}

function summaryHtml(list) {
  const noPeriodo = list.filter((o) => dentroDoPeriodo(o.dataPrevisao, state.filters.periodo));
  const abertas = noPeriodo.filter((o) => o.etapa !== "fechado" && o.etapa !== "perdido");
  const fechadas = noPeriodo.filter((o) => o.etapa === "fechado");
  const perdidas = noPeriodo.filter((o) => o.etapa === "perdido");
  const pipelineAberto = abertas.reduce((s, o) => s + o.valor, 0);
  const totalFechado = fechadas.reduce((s, o) => s + o.valor, 0);
  const totalDecididas = fechadas.length + perdidas.length;
  const taxaConversao = totalDecididas ? Math.round((fechadas.length / totalDecididas) * 100) : 0;

  const card = (label, value, iconName, accent) => `
    <div class="kpi-card" style="--kpi-accent:${accent}">
      <div class="kpi-top">
        <span class="kpi-label">${label}</span>
        <span class="kpi-icon">${icon(iconName, { size: 16 })}</span>
      </div>
      <div class="kpi-value" style="font-size:22px">${value}</div>
    </div>`;

  return `
    <div class="funil-summary">
      ${card("Pipeline aberto", currency(pipelineAberto), "pipeline", "#4fb3ff")}
      ${card("Fechado no período", currency(totalFechado), "financeiro", "#2fd07a")}
      ${card("Taxa de conversão", `${taxaConversao}%`, "diagnostico", "#f6a831")}
    </div>`;
}

function paint() {
  const container = state.container;
  container.innerHTML = `
    <div class="view-enter">
      <div class="tarefas-toolbar">
        <div class="tarefas-toolbar-left">
          <div class="tab-row" id="view-tabs">
            <button class="tab-btn ${state.view === "kanban" ? "is-active" : ""}" data-view="kanban">Funil</button>
            <button class="tab-btn ${state.view === "list" ? "is-active" : ""}" data-view="list">Lista</button>
          </div>
          <label class="tarefas-search">
            ${icon("search", { size: 14 })}
            <input type="text" id="f-busca" placeholder="Buscar oportunidades..." value="${state.filters.busca}" />
          </label>
          <span class="filter-chip">
            ${icon("users", { size: 13 })}
            <select id="f-responsavel">
              <option value="all">Responsável</option>
              ${state.colaboradores.map((p) => `<option value="${p.id}" ${state.filters.responsavel === p.id ? "selected" : ""}>${p.nome}</option>`).join("")}
            </select>
          </span>
          <span class="filter-chip">
            <select id="f-origem">
              <option value="all">Origem</option>
              ${ORIGENS_DISPONIVEIS.map((o) => `<option value="${o}" ${state.filters.origem === o ? "selected" : ""}>${o}</option>`).join("")}
            </select>
          </span>
          <span class="filter-chip">
            ${icon("agenda", { size: 13 })}
            <select id="f-periodo">
              <option value="todos" ${state.filters.periodo === "todos" ? "selected" : ""}>Todo o período</option>
              <option value="mes" ${state.filters.periodo === "mes" ? "selected" : ""}>Este mês</option>
              <option value="trimestre" ${state.filters.periodo === "trimestre" ? "selected" : ""}>Este trimestre</option>
              <option value="ano" ${state.filters.periodo === "ano" ? "selected" : ""}>Este ano</option>
            </select>
          </span>
        </div>
        <button class="btn btn-primary btn-sm" id="btn-new-oport">${icon("plus", { size: 15 })} Nova oportunidade</button>
      </div>
      <div id="pipeline-summary"></div>
      <div id="pipeline-body"></div>
    </div>`;

  bindToolbar();
  renderBody();
}

function bindToolbar() {
  document.querySelectorAll("#view-tabs .tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => { state.view = btn.dataset.view; paint(); });
  });
  document.getElementById("btn-new-oport").addEventListener("click", () => openOportModal({ mode: "create" }));
  document.getElementById("f-busca").addEventListener("input", (e) => { state.filters.busca = e.target.value; renderBody(); });
  document.getElementById("f-responsavel").addEventListener("change", (e) => { state.filters.responsavel = e.target.value; renderBody(); });
  document.getElementById("f-origem").addEventListener("change", (e) => { state.filters.origem = e.target.value; renderBody(); });
  document.getElementById("f-periodo").addEventListener("change", (e) => { state.filters.periodo = e.target.value; renderBody(); });
}

function renderBody() {
  const filtered = getFiltered();
  document.getElementById("pipeline-summary").innerHTML = summaryHtml(filtered);
  const body = document.getElementById("pipeline-body");
  body.innerHTML = state.view === "kanban" ? kanbanHtml(filtered) : listHtml(filtered);
  if (state.view === "kanban") bindKanbanEvents();
  else bindListEvents();
}

/* ================================= FUNIL ================================= */

function oportCardHtml(o) {
  const resp = personById(o.responsavelId);
  return `
    <div class="oport-card" draggable="true" data-oport-id="${o.id}">
      <div class="oport-card-cliente" style="font-weight:700;font-size:var(--fs-sm)">${o.clienteNome || "—"}</div>
      <div class="oport-card-title" style="color:var(--text-tertiary);font-size:11px">${o.titulo}</div>
      <div class="oport-card-valor">${currency(o.valor)}</div>
      <div class="oport-card-footer">
        <span class="oport-card-prob">${o.probabilidade}%</span>
        <span class="oport-card-date">${icon("clock", { size: 10 })} ${formatDatePt(o.dataPrevisao)}</span>
        ${resp ? avatarHtml(resp, { sizePx: 20, fontSizePx: 9, title: resp.nome }) : ""}
      </div>
    </div>`;
}

function kanbanHtml(list) {
  const columns = state.etapas.map((etapa) => {
    const items = list.filter((o) => o.etapa === etapa.chave);
    const total = items.reduce((s, o) => s + o.valor, 0);
    return `
      <div class="funil-column" data-etapa="${etapa.chave}" style="--col-color:${etapa.cor}">
        <div class="funil-column-head">
          <strong>${etapa.nome}</strong>
          <div class="funil-column-actions">
            <button class="quick-action-btn" data-edit-etapa="${etapa.id}" title="Editar etapa">${icon("briefing", { size: 12 })}</button>
            ${!etapa.fixa ? `<button class="quick-action-btn is-danger" data-del-etapa="${etapa.id}" data-chave-etapa="${etapa.chave}" title="Excluir etapa">×</button>` : ""}
          </div>
          <span class="count">${items.length} oportunidade(s)</span>
          <span class="total">${currency(total)}</span>
        </div>
        <div class="funil-cards">${items.map(oportCardHtml).join("")}</div>
      </div>`;
  }).join("");
  return `<div class="funil-board">${columns}<button class="funil-add-column" id="btn-add-etapa">${icon("plus", { size: 15 })} Nova etapa</button></div>`;
}

function bindKanbanEvents() {
  document.querySelectorAll(".oport-card").forEach((card) => {
    card.addEventListener("click", () => {
      const o = state.oportunidades.find((x) => x.id === card.dataset.oportId);
      if (o) openOportModal({ mode: "edit", oport: o });
    });
    card.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", card.dataset.oportId));
  });
  document.querySelectorAll(".funil-column").forEach((col) => {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("is-drag-over"); });
    col.addEventListener("dragleave", () => col.classList.remove("is-drag-over"));
    col.addEventListener("drop", async (e) => {
      e.preventDefault();
      col.classList.remove("is-drag-over");
      const id = e.dataTransfer.getData("text/plain");
      if (!id) return;
      const novaEtapa = col.dataset.etapa;
      const patch = { etapa: novaEtapa };
      if (novaEtapa === "fechado") patch.probabilidade = 100;
      if (novaEtapa === "perdido") patch.probabilidade = 0;
      await MockAPI.updateOportunidade(id, patch);
      state.oportunidades = await MockAPI.getOportunidades();

      if (novaEtapa === "fechado") {
        await criarBriefingAutomatico(id);
      }
      renderBody();
    });
  });
  document.querySelectorAll("[data-edit-etapa]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      openEtapaModal({ etapa: state.etapas.find((x) => x.id === btn.dataset.editEtapa) });
    });
  });
  document.querySelectorAll("[data-del-etapa]").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const chave = btn.dataset.chaveEtapa;
      if (!(await confirmDialog("Excluir esta etapa? As oportunidades nela vão para a primeira etapa da lista."))) return;
      const primeira = state.etapas.find((x) => x.chave !== chave);
      const afetadas = state.oportunidades.filter((o) => o.etapa === chave);
      for (const o of afetadas) {
        await MockAPI.updateOportunidade(o.id, { etapa: primeira?.chave ?? "prospeccao" });
      }
      await MockAPI.deletePipelineEtapa(btn.dataset.delEtapa);
      state.etapas = (await MockAPI.getPipelineEtapas()).sort((a, b) => a.ordem - b.ordem);
      state.oportunidades = await MockAPI.getOportunidades();
      renderBody();
      showToast("Etapa excluída.");
    });
  });
  document.getElementById("btn-add-etapa").addEventListener("click", () => openEtapaModal({}));
}

async function criarBriefingAutomatico(oportId) {
  const o = state.oportunidades.find((x) => x.id === oportId);
  if (!o || !o.clienteNome) return;
  const briefingsAtuais = await MockAPI.getBriefings();
  const jaExiste = briefingsAtuais.some((b) => b.clienteNome.trim().toLowerCase() === o.clienteNome.trim().toLowerCase());
  if (jaExiste) return;
  await MockAPI.createBriefing({ clienteNome: o.clienteNome, responsavelId: o.responsavelId });
  showToast(`Oportunidade fechada! Já criei automaticamente um briefing para "${o.clienteNome}".`, "info");
}

/* ---------------- MODAL DE ETAPA (criar/editar coluna) ---------------- */

function openEtapaModal({ etapa }) {
  const isEdit = !!etapa;
  let corSelecionada = etapa?.cor || CORES_ETAPA[state.etapas.length % CORES_ETAPA.length];
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "etapa-modal-overlay";
  overlay.innerHTML = `
    <div class="modal-panel">
      <div class="modal-header"><h3>${isEdit ? "Editar etapa" : "Nova etapa"}</h3><button class="modal-close-btn" id="et-close">${icon("chevronDown", { size: 16 })}</button></div>
      <div class="modal-body">
        <div class="field"><label>Nome da etapa</label><input type="text" id="et-nome" placeholder="Ex: Follow-up" value="${etapa?.nome || ""}" /></div>
        <div class="field">
          <label>Cor</label>
          <div class="color-swatch-row" id="et-cor">
            ${CORES_ETAPA.map((c) => `<button type="button" class="color-swatch ${c === corSelecionada ? "is-selected" : ""}" data-cor="${c}" style="background:${c}"></button>`).join("")}
          </div>
        </div>
        ${isEdit && etapa.fixa ? `<p class="text-tertiary" style="font-size:11px">Esta é a etapa fixa de fechamento — não pode ser excluída.</p>` : ""}
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="et-cancel">Cancelar</button>
        <button class="btn btn-primary" id="et-save">Salvar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  document.getElementById("et-close").addEventListener("click", close);
  document.getElementById("et-cancel").addEventListener("click", close);
  overlay.querySelectorAll("#et-cor .color-swatch").forEach((btn) => {
    btn.addEventListener("click", () => {
      corSelecionada = btn.dataset.cor;
      overlay.querySelectorAll("#et-cor .color-swatch").forEach((b) => b.classList.toggle("is-selected", b === btn));
    });
  });
  document.getElementById("et-save").addEventListener("click", async () => {
    const nome = document.getElementById("et-nome").value.trim();
    if (!nome) return;
    if (isEdit) {
      await MockAPI.updatePipelineEtapa(etapa.id, { nome, cor: corSelecionada });
    } else {
      const ordem = Math.max(0, ...state.etapas.map((e) => e.ordem)) + 1;
      await MockAPI.createPipelineEtapa({ chave: slugify(nome), nome, cor: corSelecionada, ordem });
    }
    state.etapas = (await MockAPI.getPipelineEtapas()).sort((a, b) => a.ordem - b.ordem);
    close();
    renderBody();
    showToast(isEdit ? "Etapa atualizada." : "Etapa criada.");
  });
}

/* ================================= LISTA ================================= */

function listHtml(list) {
  if (!list.length) return `<div class="empty-state"><strong>Nenhuma oportunidade encontrada</strong><p>Ajuste os filtros ou crie uma nova oportunidade.</p></div>`;
  return `
    <div class="agenda-card" style="overflow-x:auto">
      <table class="clientes-table">
        <thead><tr><th>Cliente</th><th>Oportunidade</th><th>Etapa</th><th>Valor</th><th>Prob.</th><th>Previsão</th><th>Responsável</th></tr></thead>
        <tbody>
          ${list.map((o) => {
            const cfg = etapaByChave(o.etapa);
            const resp = personById(o.responsavelId);
            return `
            <tr data-oport-id="${o.id}">
              <td><strong>${o.clienteNome || "—"}</strong></td>
              <td>${o.titulo}</td>
              <td><span class="badge" style="background:${cfg.cor}22;color:${cfg.cor}">${cfg.nome}</span></td>
              <td class="text-mono">${currency(o.valor)}</td>
              <td>${o.probabilidade}%</td>
              <td>${formatDatePt(o.dataPrevisao)}</td>
              <td>${resp ? resp.nome : "—"}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>`;
}

function bindListEvents() {
  document.querySelectorAll("[data-oport-id]").forEach((row) => {
    row.addEventListener("click", () => {
      const o = state.oportunidades.find((x) => x.id === row.dataset.oportId);
      if (o) openOportModal({ mode: "edit", oport: o });
    });
  });
}

/* ================================ MODAL DE OPORTUNIDADE =================================== */

function closeModal() {
  document.getElementById("oport-modal-overlay")?.remove();
}

function openOportModal({ mode, oport }) {
  closeModal();
  const isEdit = mode === "edit";
  const o = oport ?? {
    id: null, titulo: "", clienteNome: "", valor: 0, etapa: state.etapas[0]?.chave ?? "prospeccao",
    responsavelId: state.colaboradores[0]?.id ?? null, probabilidade: 20,
    dataPrevisao: new Date().toISOString().slice(0, 10), origem: ORIGENS_DISPONIVEIS[0], observacoes: "",
  };

  let selectedEtapa = o.etapa;
  let selectedResponsavel = o.responsavelId;

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "oport-modal-overlay";
  overlay.innerHTML = `
    <div class="modal-panel">
      <div class="modal-header">
        <h3>${isEdit ? "Editar oportunidade" : "Nova oportunidade"}</h3>
        <button class="modal-close-btn" id="modal-close">${icon("chevronDown", { size: 16 })}</button>
      </div>
      <div class="modal-body">
        <div class="field"><label>Cliente</label><input type="text" id="f-cliente" placeholder="Nome do cliente/prospect" value="${o.clienteNome}" /></div>
        <div class="field"><label>Título da oportunidade</label><input type="text" id="f-titulo" placeholder="Ex: Assessoria completa — Cliente X" value="${o.titulo}" /></div>

        <div class="field-row">
          <div class="field"><label>Valor (R$)</label><input type="number" id="f-valor" placeholder="0" value="${o.valor}" /></div>
          <div class="field"><label>Probabilidade (%)</label><input type="number" id="f-probabilidade" min="0" max="100" value="${o.probabilidade}" /></div>
        </div>

        <div class="field">
          <label>Etapa</label>
          <div class="chip-select" id="f-etapa">
            ${state.etapas.map((et) => `
              <button type="button" class="chip-option ${et.chave === selectedEtapa ? "is-selected" : ""}" data-etapa="${et.chave}" style="--chip-color:${et.cor}">
                <span class="dot" style="background:${et.cor}"></span>${et.nome}
              </button>`).join("")}
          </div>
        </div>

        <div class="field">
          <label>Responsável</label>
          <div class="people-select" id="f-responsavel">
            ${state.colaboradores.map((p) => `<button type="button" class="people-option ${p.id === selectedResponsavel ? "is-selected" : ""}" data-person="${p.id}">${avatarHtml(p)}${p.nome.split(" ")[0]}</button>`).join("")}
          </div>
        </div>

        <div class="field-row">
          <div class="field"><label>Previsão de fechamento</label><input type="date" id="f-previsao" value="${o.dataPrevisao}" /></div>
          <div class="field">
            <label>Origem</label>
            <select id="f-oport-origem">
              ${ORIGENS_DISPONIVEIS.map((org) => `<option value="${org}" ${org === o.origem ? "selected" : ""}>${org}</option>`).join("")}
            </select>
          </div>
        </div>

        <div class="field"><label>Observações</label><textarea id="f-observacoes" rows="3" placeholder="Notas sobre a negociação...">${o.observacoes || ""}</textarea></div>
      </div>
      <div class="modal-footer">
        ${isEdit ? `<button class="btn btn-danger" id="f-delete" style="margin-right:auto">Excluir</button>` : ""}
        <button class="btn btn-secondary" id="f-cancel">Cancelar</button>
        <button class="btn btn-primary" id="f-save">Salvar</button>
      </div>
    </div>`;

  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("f-cancel").addEventListener("click", closeModal);

  overlay.querySelectorAll("#f-etapa .chip-option").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedEtapa = btn.dataset.etapa;
      overlay.querySelectorAll("#f-etapa .chip-option").forEach((b) => b.classList.toggle("is-selected", b === btn));
    });
  });
  overlay.querySelectorAll("#f-responsavel .people-option").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedResponsavel = btn.dataset.person;
      overlay.querySelectorAll("#f-responsavel .people-option").forEach((b) => b.classList.toggle("is-selected", b === btn));
    });
  });

  if (isEdit) {
    document.getElementById("f-delete").addEventListener("click", async () => {
      if (!(await confirmDialog(`Excluir a oportunidade "${o.titulo}"?`))) return;
      await MockAPI.deleteOportunidade(o.id);
      state.oportunidades = await MockAPI.getOportunidades();
      closeModal();
      renderBody();
      showToast("Oportunidade excluída.");
    });
  }

  document.getElementById("f-save").addEventListener("click", async () => {
    const clienteNome = document.getElementById("f-cliente").value.trim();
    if (!clienteNome) { document.getElementById("f-cliente").focus(); return; }
    const etapaEraFechado = isEdit && o.etapa === "fechado";
    const payload = {
      titulo: document.getElementById("f-titulo").value.trim() || clienteNome,
      clienteNome,
      valor: Number(document.getElementById("f-valor").value) || 0,
      probabilidade: Math.min(100, Math.max(0, Number(document.getElementById("f-probabilidade").value) || 0)),
      etapa: selectedEtapa,
      responsavelId: selectedResponsavel,
      dataPrevisao: document.getElementById("f-previsao").value,
      origem: document.getElementById("f-oport-origem").value,
      observacoes: document.getElementById("f-observacoes").value.trim(),
    };
    let idParaBriefing = o.id;
    if (isEdit) {
      await MockAPI.updateOportunidade(o.id, payload);
    } else {
      const nova = await MockAPI.createOportunidade(payload);
      idParaBriefing = nova.id;
    }
    state.oportunidades = await MockAPI.getOportunidades();
    closeModal();
    renderBody();
    showToast(isEdit ? "Oportunidade atualizada." : "Oportunidade criada.");
    if (selectedEtapa === "fechado" && !etapaEraFechado) {
      await criarBriefingAutomatico(idParaBriefing);
    }
  });
}

  return { renderPipeline };
})();

/* ===== js/modules/briefing.js (escopo isolado) ===== */
const { renderBriefing } = (function () {

/* ===== js/modules/briefing.js ===== */




const state = {
  view: "grid",
  briefings: [],
  colaboradores: [],
  filters: { status: "all", responsavel: "all", busca: "" },
  container: null,
};

function personById(id) {
  return state.colaboradores.find((p) => p.id === id) || null;
}

function formatDatePt(iso) {
  if (!iso) return "—";
  return parseIso(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
}

function getFiltered() {
  const { status, responsavel, busca } = state.filters;
  return state.briefings.filter((b) => {
    if (status !== "all" && b.status !== status) return false;
    if (responsavel !== "all" && b.responsavelId !== responsavel) return false;
    if (busca && !b.clienteNome.toLowerCase().includes(busca.toLowerCase())) return false;
    return true;
  });
}

async function renderBriefing(container) {
  state.container = container;
  state.briefings = await MockAPI.getBriefings();
  state.colaboradores = (await MockAPI.getColaboradores()).filter((c) => c.status === "ativo");
  if (!container.isConnected) return;
  paint();
}

function paint() {
  const container = state.container;
  container.innerHTML = `
    <div class="view-enter">
      <div class="tarefas-toolbar">
        <div class="tarefas-toolbar-left">
          <div class="tab-row" id="view-tabs">
            <button class="tab-btn ${state.view === "grid" ? "is-active" : ""}" data-view="grid">Grade</button>
            <button class="tab-btn ${state.view === "list" ? "is-active" : ""}" data-view="list">Lista</button>
          </div>
          <label class="tarefas-search">
            ${icon("search", { size: 14 })}
            <input type="text" id="f-busca" placeholder="Buscar por cliente..." value="${state.filters.busca}" />
          </label>
          <span class="filter-chip">
            <select id="f-status">
              <option value="all">Status</option>
              ${Object.entries(STATUS_BRIEFING).map(([k, v]) => `<option value="${k}" ${state.filters.status === k ? "selected" : ""}>${v.label}</option>`).join("")}
            </select>
          </span>
          <span class="filter-chip">
            ${icon("users", { size: 13 })}
            <select id="f-responsavel">
              <option value="all">Responsável</option>
              ${state.colaboradores.map((p) => `<option value="${p.id}" ${state.filters.responsavel === p.id ? "selected" : ""}>${p.nome}</option>`).join("")}
            </select>
          </span>
        </div>
        <button class="btn btn-primary btn-sm" id="btn-new-briefing">${icon("plus", { size: 15 })} Novo briefing</button>
      </div>
      <div id="briefing-body"></div>
    </div>`;

  bindToolbar();
  renderBody();
}

function bindToolbar() {
  document.querySelectorAll("#view-tabs .tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => { state.view = btn.dataset.view; paint(); });
  });
  document.getElementById("btn-new-briefing").addEventListener("click", () => openBriefingModal({ mode: "create" }));
  document.getElementById("f-busca").addEventListener("input", (e) => { state.filters.busca = e.target.value; renderBody(); });
  document.getElementById("f-status").addEventListener("change", (e) => { state.filters.status = e.target.value; renderBody(); });
  document.getElementById("f-responsavel").addEventListener("change", (e) => { state.filters.responsavel = e.target.value; renderBody(); });
}

function renderBody() {
  const body = document.getElementById("briefing-body");
  const filtered = getFiltered();
  body.innerHTML = filtered.length
    ? (state.view === "grid" ? gridHtml(filtered) : listHtml(filtered))
    : `<div class="empty-state"><strong>Nenhum briefing encontrado</strong><p>Ajuste os filtros ou crie um novo briefing.</p></div>`;
  bindRowEvents();
}

function cardHtml(b) {
  const st = STATUS_BRIEFING[b.status];
  const urg = NIVEL_URGENCIA[b.urgencia];
  const resp = personById(b.responsavelId);
  const completude = calcularCompletudeBriefing(b.respostas);
  return `
    <div class="cliente-card" data-briefing-id="${b.id}">
      <div class="cliente-card-head">
        <span class="cliente-logo" style="background:${urg.cor}">${icon("briefing", { size: 20 })}</span>
        <span class="badge" style="background:${st.cor}22;color:${st.cor}">${st.label}</span>
      </div>
      <div>
        <div class="cliente-card-name">${b.clienteNome}</div>
        <div class="cliente-card-segmento">${b.respostas.segmento || "Segmento não informado"}</div>
        <div class="briefing-progress">
          <div class="progress-track"><div class="progress-fill" style="width:${completude}%"></div></div>
          <span>${completude}%</span>
        </div>
        ${b.onboarding ? `<span class="onboarding-badge">${icon("chevronDown", { size: 10 })} Onboarding completo</span>` : ""}
      </div>
      <div class="cliente-card-footer">
        <div class="cliente-card-resp">${resp ? avatarHtml(resp, { sizePx: 20, fontSizePx: 9 }) + " " + resp.nome : "—"}</div>
        <span class="text-tertiary" style="font-size:11px">${formatDatePt(b.atualizadoEm)}</span>
      </div>
    </div>`;
}

function gridHtml(list) {
  return `<div class="clientes-grid">${list.map(cardHtml).join("")}</div>`;
}

function listHtml(list) {
  return `
    <div class="agenda-card" style="overflow-x:auto">
      <table class="clientes-table">
        <thead><tr><th>Cliente</th><th>Status</th><th>Urgência</th><th>Responsável</th><th>Completude</th><th>Atualizado</th></tr></thead>
        <tbody>
          ${list.map((b) => {
            const st = STATUS_BRIEFING[b.status];
            const urg = NIVEL_URGENCIA[b.urgencia];
            const resp = personById(b.responsavelId);
            const completude = calcularCompletudeBriefing(b.respostas);
            return `
            <tr data-briefing-id="${b.id}">
              <td><strong>${b.clienteNome}</strong></td>
              <td><span class="badge" style="background:${st.cor}22;color:${st.cor}">${st.label}</span></td>
              <td><span class="badge" style="background:${urg.cor}22;color:${urg.cor}">${urg.label}</span></td>
              <td>${resp ? resp.nome : "—"}</td>
              <td style="min-width:120px">
                <div class="briefing-progress"><div class="progress-track"><div class="progress-fill" style="width:${completude}%"></div></div><span>${completude}%</span></div>
              </td>
              <td class="text-tertiary">${formatDatePt(b.atualizadoEm)}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>`;
}

function bindRowEvents() {
  document.querySelectorAll("[data-briefing-id]").forEach((el) => {
    el.addEventListener("click", () => {
      const b = state.briefings.find((x) => x.id === el.dataset.briefingId);
      if (b) openBriefingModal({ mode: "edit", briefing: b });
    });
  });
}

function closeModal() {
  document.getElementById("briefing-modal-overlay")?.remove();
}

const TABS = [
  { key: "onboarding", label: "Onboarding" },
  { key: "manual", label: "Manual da Marca" },
  { key: "diagnostico", label: "Diagnóstico" },
];

function openBriefingModal({ mode, briefing }) {
  closeModal();
  const isEdit = mode === "edit";
  const b = briefing ?? {
    id: null, clienteNome: "", responsavelId: state.colaboradores[0]?.id ?? null,
    status: "rascunho", urgencia: "media", respostas: {},
  };
  const r = b.respostas || {};

  let selectedStatus = b.status;
  let selectedUrgencia = b.urgencia;
  let selectedResponsavel = b.responsavelId;
  let activeTab = "onboarding";
  let diagAreaIndex = 0;

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "briefing-modal-overlay";
  overlay.innerHTML = `
    <div class="modal-panel briefing-modal-panel">
      <div class="modal-header">
        <h3>${isEdit ? `Briefing — ${b.clienteNome}` : "Novo briefing"}</h3>
        <button class="modal-close-btn" id="modal-close">${icon("chevronDown", { size: 16 })}</button>
      </div>
      <div class="modal-body">
        <div class="field-row">
          <div class="field"><label>Cliente</label><input type="text" id="f-cliente" placeholder="Nome do cliente" value="${b.clienteNome}" /></div>
          <div class="field">
            <label>Status</label>
            <select id="f-briefing-status">
              ${Object.entries(STATUS_BRIEFING).map(([k, v]) => `<option value="${k}" ${k === selectedStatus ? "selected" : ""}>${v.label}</option>`).join("")}
            </select>
          </div>
        </div>

        <div class="field">
          <label>Responsável</label>
          <div class="people-select" id="f-responsavel">
            ${state.colaboradores.map((p) => `<button type="button" class="people-option ${p.id === selectedResponsavel ? "is-selected" : ""}" data-person="${p.id}">${avatarHtml(p)}${p.nome.split(" ")[0]}</button>`).join("")}
          </div>
        </div>

        <div class="field">
          <label>Urgência</label>
          <div class="chip-select" id="f-urgencia">
            ${Object.entries(NIVEL_URGENCIA).map(([k, v]) => `<button type="button" class="chip-option ${k === selectedUrgencia ? "is-selected" : ""}" data-urg="${k}" style="--chip-color:${v.cor}"><span class="dot" style="background:${v.cor}"></span>${v.label}</button>`).join("")}
          </div>
        </div>

        <div class="cliente-tabs" id="briefing-tabs" style="margin-top:16px">
          ${TABS.map((t, i) => `<button class="cliente-tab-btn ${i === 0 ? "is-active" : ""}" data-tab="${t.key}">${t.label}</button>`).join("")}
        </div>

        <div style="padding-top:16px">
          <div class="briefing-form-section" data-section="onboarding" id="onboarding-tab-content"></div>
          <div class="briefing-form-section is-hidden" data-section="manual" id="manual-tab-content"></div>
          <div class="briefing-form-section is-hidden" data-section="diagnostico" id="diagnostico-tab-content"></div>
        </div>
      </div>
      <div class="modal-footer">
        ${isEdit ? `<button class="btn btn-danger" id="f-delete" style="margin-right:auto">Excluir</button>` : ""}
        <button class="btn btn-secondary" id="f-cancel">Cancelar</button>
        <button class="btn btn-primary" id="f-save">Salvar</button>
      </div>
    </div>`;

  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("f-cancel").addEventListener("click", closeModal);

  document.getElementById("briefing-tabs").addEventListener("click", (e) => {
    const btn = e.target.closest(".cliente-tab-btn");
    if (!btn) return;
    activeTab = btn.dataset.tab;
    overlay.querySelectorAll(".cliente-tab-btn").forEach((b2) => b2.classList.toggle("is-active", b2 === btn));
    overlay.querySelectorAll(".briefing-form-section").forEach((sec) => sec.classList.toggle("is-hidden", sec.dataset.section !== activeTab));
    if (activeTab === "onboarding") renderOnboardingTab();
    else if (activeTab === "manual") renderManualMarcaTab();
    else if (activeTab === "diagnostico") renderDiagnosticoTab();
  });

  function renderOnboardingTab() {
    const target = document.getElementById("onboarding-tab-content");
    if (!target) return;
    if (b.onboarding) {
      target.innerHTML = `
        <div class="wizard-summary-grid">${buildOnboardingSummaryHtml(b.onboarding)}</div>
        <button class="btn btn-secondary btn-sm" id="btn-redo-onboarding" style="margin-top:14px">${icon("briefing", { size: 13 })} Editar onboarding guiado</button>`;
    } else {
      target.innerHTML = `
        <div class="empty-state">
          <strong>Onboarding ainda não preenchido</strong>
          <p>Use o formulário guiado para coletar identificação, marca, momento atual, visão de futuro e expectativas do cliente.</p>
        </div>
        <button class="btn btn-primary btn-sm" id="btn-redo-onboarding" style="margin-top:10px">${icon("plus", { size: 13 })} Preencher onboarding guiado</button>`;
    }
    document.getElementById("btn-redo-onboarding").addEventListener("click", () => {
      openOnboardingWizard(b, async () => {
        state.briefings = await MockAPI.getBriefings();
        Object.assign(b, state.briefings.find((x) => x.id === b.id));
        const statusSelect = document.getElementById("f-briefing-status");
        if (statusSelect) statusSelect.value = b.status;
        renderOnboardingTab();
      });
    });
  }

  /* ---------------- MANUAL DA MARCA ---------------- */

  function renderManualMarcaTab() {
    const target = document.getElementById("manual-tab-content");
    if (!target) return;
    if (!isEdit) {
      target.innerHTML = `<div class="empty-state"><strong>Salve o briefing primeiro</strong><p>Depois de criado, você pode anexar o manual da marca aqui.</p></div>`;
      return;
    }
    const arquivos = b.manualMarca || [];
    target.innerHTML = `
      <div id="manual-marca-list">
        ${arquivos.length ? arquivos.map((a) => `
          <div class="attachment-item" data-arq-id="${a.id}">
            ${icon("briefing", { size: 13 })}<span>${a.nome}</span>
            <button class="modal-close-btn" data-del-manual="${a.id}" style="width:20px;height:20px">×</button>
          </div>`).join("") : `<span class="text-tertiary" style="font-size:13px">Nenhum arquivo do manual da marca ainda.</span>`}
      </div>
      <div class="checklist-add" style="margin-top:12px">
        <input type="text" id="f-new-manual" placeholder="Nome do arquivo (ex: manual-marca-2026.pdf)" />
        <button class="btn btn-secondary btn-sm" id="btn-add-manual">${icon("plus", { size: 13 })}</button>
      </div>
      <p class="text-tertiary" style="font-size:11px;margin-top:8px">Registre aqui o nome do arquivo do manual da marca (o arquivo em si fica salvo no seu Drive/armazenamento — aqui é só o controle de referência).</p>
    `;
    document.getElementById("btn-add-manual").addEventListener("click", async () => {
      const input = document.getElementById("f-new-manual");
      const nome = input.value.trim();
      if (!nome) { input.focus(); return; }
      await MockAPI.addManualMarcaArquivo(b.id, { id: `mm${Date.now()}`, nome });
      state.briefings = await MockAPI.getBriefings();
      Object.assign(b, state.briefings.find((x) => x.id === b.id));
      renderManualMarcaTab();
      showToast("Arquivo adicionado.");
    });
    target.querySelectorAll("[data-del-manual]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        await MockAPI.removeManualMarcaArquivo(b.id, btn.dataset.delManual);
        state.briefings = await MockAPI.getBriefings();
        Object.assign(b, state.briefings.find((x) => x.id === b.id));
        renderManualMarcaTab();
      });
    });
  }

  /* ---------------- DIAGNÓSTICO ---------------- */

  async function salvarRespostasDiagnostico(respostas) {
    await MockAPI.saveDiagnosticoRespostas(b.id, respostas, {});
    state.briefings = await MockAPI.getBriefings();
    Object.assign(b, state.briefings.find((x) => x.id === b.id));
  }

  function renderDiagnosticoTab() {
    const target = document.getElementById("diagnostico-tab-content");
    if (!target) return;
    if (!isEdit) {
      target.innerHTML = `<div class="empty-state"><strong>Salve o briefing primeiro</strong><p>Depois de criado, você pode aplicar o diagnóstico aqui.</p></div>`;
      return;
    }
    const respostas = b.diagnostico?.respostas || {};
    const respondidas = diagnosticoRespondidas(respostas);

    if (!respondidas) {
      target.innerHTML = `
        <div class="empty-state">
          <strong>Diagnóstico ainda não iniciado</strong>
          <p>${DIAGNOSTICO_TOTAL_PERGUNTAS} perguntas em 5 áreas (Comercial, Marketing, Processos, Pessoas, Finanças) — leva cerca de 10 minutos.</p>
        </div>
        <button class="btn btn-primary btn-sm" id="btn-iniciar-diagnostico" style="margin-top:10px">${icon("plus", { size: 13 })} Iniciar diagnóstico</button>
      `;
      document.getElementById("btn-iniciar-diagnostico").addEventListener("click", () => {
        diagAreaIndex = 0;
        renderDiagnosticoQuiz({});
      });
      return;
    }

    if (diagnosticoCompleto(respostas)) renderDiagnosticoResultado(respostas);
    else renderDiagnosticoQuiz(respostas);
  }

  function renderDiagnosticoQuiz(respostasAtuais) {
    const target = document.getElementById("diagnostico-tab-content");
    const area = DIAGNOSTICO_AREAS[diagAreaIndex];
    const respArea = respostasAtuais[area.id] || [];

    const areaTabsHtml = DIAGNOSTICO_AREAS.map((a, i) => {
      const completa = diagnosticoAreaCompleta(respostasAtuais, a.id);
      return `<button type="button" class="diag-area-tab ${i === diagAreaIndex ? "is-active" : ""} ${completa ? "is-done" : ""}" data-area-idx="${i}">${a.label}</button>`;
    }).join("");

    const perguntasHtml = area.questions.map((q, qi) => `
      <div class="diag-question">
        <div class="diag-question-label">Pergunta ${qi + 1} de ${area.questions.length}</div>
        <div class="diag-question-text">${q.q}</div>
        <div class="diag-options" data-q-idx="${qi}">
          ${q.opts.map((opt, oi) => `
            <button type="button" class="diag-option ${respArea[qi] === oi ? "is-selected" : ""}" data-opt-idx="${oi}">
              <span class="diag-option-dot"></span><span>${opt}</span>
            </button>`).join("")}
        </div>
      </div>`).join("");

    const totalRespondidas = diagnosticoRespondidas(respostasAtuais);
    const progressoGeral = Math.round((totalRespondidas / DIAGNOSTICO_TOTAL_PERGUNTAS) * 100);
    const areaCompleta = diagnosticoAreaCompleta(respostasAtuais, area.id);

    target.innerHTML = `
      <div class="diag-progress-row">
        <span class="text-tertiary" style="font-size:11px">${totalRespondidas}/${DIAGNOSTICO_TOTAL_PERGUNTAS} respondidas</span>
        <div class="progress-track" style="width:160px"><div class="progress-fill" style="width:${progressoGeral}%"></div></div>
      </div>
      <div class="diag-area-tabs">${areaTabsHtml}</div>
      <div class="diag-questions">${perguntasHtml}</div>
      <div class="diag-nav">
        <button class="btn btn-secondary btn-sm" id="diag-prev" ${diagAreaIndex === 0 ? "disabled" : ""}>← Área anterior</button>
        ${diagAreaIndex < DIAGNOSTICO_AREAS.length - 1
          ? `<button class="btn btn-primary btn-sm" id="diag-next">Próxima área →</button>`
          : `<button class="btn btn-primary btn-sm" id="diag-finalizar" ${diagnosticoCompleto(respostasAtuais) ? "" : "disabled"}>Ver resultado</button>`}
      </div>
      ${!areaCompleta ? `<p class="text-tertiary" style="font-size:11px;margin-top:8px">Responda todas as perguntas desta área pra avançar.</p>` : ""}
    `;

    target.querySelectorAll(".diag-area-tab").forEach((btn) => {
      btn.addEventListener("click", async () => {
        await salvarRespostasDiagnostico(respostasAtuais);
        diagAreaIndex = Number(btn.dataset.areaIdx);
        renderDiagnosticoQuiz(respostasAtuais);
      });
    });
    target.querySelectorAll(".diag-options").forEach((group) => {
      const qi = Number(group.dataset.qIdx);
      group.querySelectorAll(".diag-option").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const oi = Number(btn.dataset.optIdx);
          respostasAtuais[area.id] = respostasAtuais[area.id] || [];
          respostasAtuais[area.id][qi] = oi;
          await salvarRespostasDiagnostico(respostasAtuais);
          renderDiagnosticoQuiz(respostasAtuais);
        });
      });
    });
    document.getElementById("diag-prev")?.addEventListener("click", async () => {
      await salvarRespostasDiagnostico(respostasAtuais);
      diagAreaIndex = Math.max(0, diagAreaIndex - 1);
      renderDiagnosticoQuiz(respostasAtuais);
    });
    document.getElementById("diag-next")?.addEventListener("click", async () => {
      await salvarRespostasDiagnostico(respostasAtuais);
      diagAreaIndex = Math.min(DIAGNOSTICO_AREAS.length - 1, diagAreaIndex + 1);
      renderDiagnosticoQuiz(respostasAtuais);
    });
    document.getElementById("diag-finalizar")?.addEventListener("click", async () => {
      await salvarRespostasDiagnostico(respostasAtuais);
      renderDiagnosticoResultado(respostasAtuais);
    });
  }

  function renderDiagnosticoResultado(respostas) {
    const target = document.getElementById("diagnostico-tab-content");
    const overall = diagnosticoOverallScore(respostas);
    const ovStatus = diagnosticoStatusFor(overall);
    const scores = DIAGNOSTICO_AREAS.map((a) => ({ ...a, score: diagnosticoAreaScore(respostas, a.id) }));

    const areasGridHtml = scores.map((a) => {
      const st = diagnosticoStatusFor(a.score);
      return `
        <div class="diag-area-card">
          <div class="diag-area-card-name">${a.label}</div>
          <div class="diag-area-card-score" style="color:${st.cor}">${a.score}%</div>
          <div class="progress-track"><div class="progress-fill" style="width:${a.score}%;background:${st.cor}"></div></div>
          <div class="diag-area-card-status" style="color:${st.cor}">${st.label}</div>
        </div>`;
    }).join("");

    const detalhesHtml = scores.map((a) => {
      const st = diagnosticoStatusFor(a.score);
      const lv = diagnosticoAreaLevel(a.score);
      const texto = DIAGNOSTICO_TEXTOS[a.id][lv];
      const acoes = DIAGNOSTICO_ACOES[a.id][lv];
      const prod = DIAGNOSTICO_PRODUTOS[a.id];
      return `
        <div class="diag-detail-card">
          <div class="diag-detail-head">
            <span class="diag-detail-name">${a.label}</span>
            <span class="badge" style="background:${st.cor}22;color:${st.cor}">${st.label} · ${a.score}%</span>
          </div>
          <p class="diag-detail-text">${texto}</p>
          <div class="diag-detail-actions-title">Ações prioritárias</div>
          ${acoes.map((ac) => `<div class="diag-action-item"><span class="diag-action-bullet"></span>${ac}</div>`).join("")}
          ${a.score < 65 ? `
            <div class="diag-product-box">
              <div class="diag-product-label">Solução Fontys indicada</div>
              <div class="diag-product-name">${prod.name}</div>
              <div class="diag-product-desc">${prod.desc}</div>
            </div>` : ""}
        </div>`;
    }).join("");

    target.innerHTML = `
      <div class="diag-result-banner">
        <div class="diag-result-score">${overall}<span>%</span></div>
        <div>
          <div class="diag-result-label">Maturidade geral do negócio</div>
          <span class="badge" style="background:${ovStatus.cor}22;color:${ovStatus.cor}">${ovStatus.label}</span>
        </div>
      </div>
      <div class="diag-areas-grid">${areasGridHtml}</div>
      <div class="section-title" style="margin:20px 0 10px">Diagnóstico por área</div>
      ${detalhesHtml}
      <div class="diag-result-actions">
        <button class="btn btn-secondary btn-sm" id="btn-refazer-diagnostico">Refazer diagnóstico</button>
        <button class="btn btn-primary btn-sm" id="btn-imprimir-diagnostico">${icon("briefing", { size: 13 })} Imprimir / Exportar</button>
      </div>
    `;

    document.getElementById("btn-refazer-diagnostico").addEventListener("click", async () => {
      if (!(await confirmDialog("Refazer o diagnóstico do zero? As respostas atuais serão substituídas."))) return;
      diagAreaIndex = 0;
      renderDiagnosticoQuiz({});
    });
    document.getElementById("btn-imprimir-diagnostico").addEventListener("click", () => imprimirDiagnostico(b, respostas));
  }

  overlay.querySelectorAll("#f-urgencia .chip-option").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedUrgencia = btn.dataset.urg;
      overlay.querySelectorAll("#f-urgencia .chip-option").forEach((b2) => b2.classList.toggle("is-selected", b2 === btn));
    });
  });
  overlay.querySelectorAll("#f-responsavel .people-option").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedResponsavel = btn.dataset.person;
      overlay.querySelectorAll("#f-responsavel .people-option").forEach((b2) => b2.classList.toggle("is-selected", b2 === btn));
    });
  });

  if (isEdit) {
    document.getElementById("f-delete").addEventListener("click", async () => {
      if (!(await confirmDialog(`Excluir o briefing de "${b.clienteNome}"?`))) return;
      await MockAPI.deleteBriefing(b.id);
      state.briefings = await MockAPI.getBriefings();
      closeModal();
      renderBody();
      showToast("Briefing excluído.");
    });
  }

  document.getElementById("f-save").addEventListener("click", async () => {
    const clienteNome = document.getElementById("f-cliente").value.trim();
    if (!clienteNome) { document.getElementById("f-cliente").focus(); return; }

    const payload = {
      clienteNome,
      responsavelId: selectedResponsavel,
      status: document.getElementById("f-briefing-status").value,
      urgencia: selectedUrgencia,
      respostas: b.respostas || {},
    };

    if (isEdit) await MockAPI.updateBriefing(b.id, payload);
    else await MockAPI.createBriefing(payload);
    state.briefings = await MockAPI.getBriefings();
    closeModal();
    renderBody();
    showToast(isEdit ? "Briefing atualizado." : "Briefing criado.");
  });

  renderOnboardingTab();
}

const WIZARD_STEP_LABELS = ["Identificação", "Marca", "Momento e objetivos", "Visão de futuro", "Parceria", "Histórico", "Revisão"];

function wizardFieldHtml(field, current) {
  const fid = `w-${field.id}`;
  if (field.type === "textarea") {
    return `<div class="field"><label>${field.label}</label><textarea id="${fid}" rows="2">${current || ""}</textarea></div>`;
  }
  if (field.type === "select") {
    return `<div class="field"><label>${field.label}</label><select id="${fid}"><option value="">Selecione</option>${field.opcoes.map((o) => `<option value="${o}" ${current === o ? "selected" : ""}>${o}</option>`).join("")}</select></div>`;
  }
  if (field.type === "chip-multi" || field.type === "chip-single") {
    const cfg = ONBOARDING_OPCOES[field.opcoesKey];
    const selectedSet = new Set(field.type === "chip-multi" ? (current || []) : (current ? [current] : []));
    return `
      <div class="field">
        <label>${field.label}</label>
        <div class="chip-select" id="${fid}" data-multi="${field.type === "chip-multi"}">
          ${cfg.opcoes.map((o) => `<button type="button" class="chip-option ${selectedSet.has(o) ? "is-selected" : ""}" data-val="${o}" style="--chip-color:#2e63a6">${o}</button>`).join("")}
        </div>
      </div>`;
  }
  return `<div class="field"><label>${field.label}</label><input type="${field.type}" id="${fid}" placeholder="${field.placeholder || ""}" value="${current || ""}" /></div>`;
}

function wizardSummaryRow(label, value) {
  const isEmpty = !value || (Array.isArray(value) && value.length === 0);
  const display = Array.isArray(value) ? value.join(", ") : value;
  return `<div class="wizard-summary-row"><span class="wizard-summary-key">${label}</span><span class="wizard-summary-val ${isEmpty ? "is-muted" : ""}">${isEmpty ? "Não informado" : display}</span></div>`;
}

function buildOnboardingSummaryHtml(o) {
  const cards = WIZARD_STEPS.filter((s) => s.fields).map((step) => {
    const rows = step.fields.map((f) => wizardSummaryRow(f.label, o[f.id])).join("");
    return `<div class="wizard-summary-card"><div class="wizard-summary-card-title">${step.title}</div>${rows}</div>`;
  }).join("");
  return cards;
}

function closeWizard() {
  document.getElementById("onboarding-wizard-overlay")?.remove();
}

function openOnboardingWizard(briefing, onComplete) {
  closeWizard();
  const existing = briefing.onboarding || {};
  let stepIndex = 0;
  const totalSteps = WIZARD_STEPS.length;

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "onboarding-wizard-overlay";
  overlay.style.zIndex = "300";
  overlay.innerHTML = `
    <div class="modal-panel wizard-modal-panel">
      <div class="wizard-header">
        <div class="wizard-header-top">
          <h3>Onboarding guiado — ${briefing.clienteNome}</h3>
          <button class="modal-close-btn" id="wizard-close">${icon("chevronDown", { size: 16 })}</button>
        </div>
        <div class="wizard-progress-track"><div class="wizard-progress-fill" id="wizard-progress-fill" style="width:0%"></div></div>
        <div class="wizard-progress-meta">
          <span id="wizard-step-label">${WIZARD_STEP_LABELS[0]}</span>
          <div class="wizard-dots" id="wizard-dots"></div>
        </div>
      </div>
      <div class="wizard-body" id="wizard-body">
        ${WIZARD_STEPS.map((step, i) => `
          <div class="wizard-step ${i === 0 ? "is-active" : ""}" data-step="${step.key}">
            <div>
              <div class="wizard-step-title">${step.title}</div>
              <div class="wizard-step-sub">${step.sub}</div>
            </div>
            ${step.fields ? step.fields.map((f) => wizardFieldHtml(f, existing[f.id])).join("") : `<div class="wizard-summary-grid" id="wizard-summary-target"></div>`}
          </div>`).join("")}
      </div>
      <div class="wizard-footer">
        <button class="btn btn-secondary" id="wizard-back">← Voltar</button>
        <button class="btn btn-primary" id="wizard-next">Próximo →</button>
      </div>
    </div>`;

  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeWizard(); });
  document.getElementById("wizard-close").addEventListener("click", closeWizard);

  // chip toggle (multi ou single, comportando-se como radio quando single)
  overlay.querySelectorAll(".chip-select[data-multi]").forEach((group) => {
    const isMulti = group.dataset.multi === "true";
    group.querySelectorAll(".chip-option").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (isMulti) {
          btn.classList.toggle("is-selected");
        } else {
          group.querySelectorAll(".chip-option").forEach((b) => b.classList.toggle("is-selected", b === btn));
        }
      });
    });
  });

  function updateProgress() {
    const pct = Math.round((stepIndex / (totalSteps - 1)) * 100);
    document.getElementById("wizard-progress-fill").style.width = `${pct}%`;
    document.getElementById("wizard-step-label").textContent = WIZARD_STEP_LABELS[stepIndex];
    document.getElementById("wizard-dots").innerHTML = WIZARD_STEP_LABELS
      .map((_, i) => `<span class="wizard-dot ${i === stepIndex ? "is-active" : i < stepIndex ? "is-done" : ""}"></span>`)
      .join("");
  }

  function collectFromDom() {
    const data = {};
    WIZARD_STEPS.forEach((step) => {
      if (!step.fields) return;
      step.fields.forEach((f) => {
        if (f.type === "chip-multi") {
          data[f.id] = Array.from(overlay.querySelectorAll(`#w-${f.id} .chip-option.is-selected`)).map((b) => b.dataset.val);
        } else if (f.type === "chip-single") {
          const sel = overlay.querySelector(`#w-${f.id} .chip-option.is-selected`);
          data[f.id] = sel ? sel.dataset.val : "";
        } else {
          data[f.id] = document.getElementById(`w-${f.id}`)?.value.trim() || "";
        }
      });
    });
    return data;
  }

  function goToStep(n) {
    stepIndex = Math.max(0, Math.min(totalSteps - 1, n));
    overlay.querySelectorAll(".wizard-step").forEach((el, i) => el.classList.toggle("is-active", i === stepIndex));
    const backBtn = document.getElementById("wizard-back");
    const nextBtn = document.getElementById("wizard-next");
    backBtn.style.visibility = stepIndex === 0 ? "hidden" : "visible";

    if (WIZARD_STEPS[stepIndex].key === "revisao") {
      document.getElementById("wizard-summary-target").innerHTML = buildOnboardingSummaryHtml(collectFromDom());
      nextBtn.textContent = "Concluir onboarding";
    } else {
      nextBtn.textContent = "Próximo →";
    }
    updateProgress();
  }

  document.getElementById("wizard-back").addEventListener("click", () => goToStep(stepIndex - 1));
  document.getElementById("wizard-next").addEventListener("click", async () => {
    if (WIZARD_STEPS[stepIndex].key === "revisao") {
      const payload = collectFromDom();
      await MockAPI.saveOnboarding(briefing.id, payload);
      closeWizard();
      showToast("Onboarding salvo.");
      if (onComplete) onComplete();
      return;
    }
    goToStep(stepIndex + 1);
  });

  goToStep(0);
}

/* ===== js/modules/assessoria.js (escopo isolado) ===== */
const { renderAssessoria } = (function () {

/* ===== js/modules/assessoria.js ===== */





const state = {
  planos: [],
  clientesElegiveis: [],
  colaboradores: [],
  filters: { busca: "" },
  container: null,
};

function personById(id) {
  return state.colaboradores.find((p) => p.id === id) || null;
}

function formatDatePt(iso) {
  return parseIso(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
}

function overallProgress(plano) {
  const objetivos = plano.estrategico.objetivos;
  if (!objetivos.length) return 0;
  const soma = objetivos.reduce((s, o) => s + progressoObjetivoEstrategico(plano, o.id), 0);
  return Math.round(soma / objetivos.length);
}

function getFiltered() {
  const { busca } = state.filters;
  const nomesElegiveis = new Set(state.clientesElegiveis.map((c) => c.nome));
  return state.planos.filter((p) => nomesElegiveis.has(p.clienteNome) && (!busca || p.clienteNome.toLowerCase().includes(busca.toLowerCase())));
}

async function renderAssessoria(container) {
  state.container = container;
  state.planos = await MockAPI.getAssessoriaPlanos();
  const [clientes, produtos, colaboradores] = await Promise.all([MockAPI.getClientes(), MockAPI.getProdutos(), MockAPI.getColaboradores()]);
  const idsAssessoria = new Set(produtos.filter((p) => p.categoria === "Assessoria").map((p) => p.id));
  state.clientesElegiveis = clientes.filter((c) => (c.produtosContratados || []).some((pid) => idsAssessoria.has(pid)));
  state.colaboradores = colaboradores.filter((c) => c.status === "ativo");
  if (!container.isConnected) return;
  paint();
}

function paint() {
  const container = state.container;
  container.innerHTML = `
    <div class="view-enter">
      <div class="tarefas-toolbar">
        <div class="tarefas-toolbar-left">
          <label class="tarefas-search">

      </div>
      <div id="assessoria-body"></div>

  document.getElementById("f-busca").addEventListener("input", (e) => { state.filters.busca = e.target.value; renderBody(); });
  document.getElementById("btn-new-plano").addEventListener("click", openNovoPlanoModal);

function renderBody() {
  const body = document.getElementById("assessoria-body");

  return `

  function areaCardHtml(a) {

  function renderTaticoTab() {
    const target = document.getElementById("plano-tab-body");
    const areas = plano.tatico.areas;
    const objetivos = plano.estrategico.objetivos;

    const gruposHtml = objetivos.map((o, i) => {
      const areasDoObjetivo = areas.filter((a) => a.objetivoEstrategicoId === o.id);
      if (!areasDoObjetivo.length) return "";
      const areaCfg = AREAS_OBJETIVO[o.area];

      return `
        <div class="tatico-grupo">

            <span class="objetivo-num">${i + 1}</span>

              <strong class="tatico-grupo-titulo">${o.titulo}</strong>

    const areasSemObjetivo = areas.filter((a) => !objetivos.find((o) => o.id === a.objetivoEstrategicoId));

      <div class="tatico-grupo">
        <div class="tatico-grupo-head tatico-grupo-head-neutro"><strong class="tatico-grupo-titulo">Sem objetivo estratégico vinculado</strong></div>
        <div class="tatico-grupo-areas">${areasSemObjetivo.map(areaCardHtml).join("")}</div>
      </div>` : "";

    target.innerHTML = `
      ${areas.length ? gruposHtml + semObjetivoHtml : `<div class="empty-state"><strong>Nenhuma área tática ainda</strong><p>Desdobre os objetivos estratégicos em áreas de trabalho concretas.</p></div>`}

    target.querySelectorAll("[data-edit-area]").forEach((btn) => {
      btn.addEventListener("click", () => openAreaModal({ area: areas.find((a) => a.id === btn.dataset.editArea) }));
    });
    target.querySelectorAll("[data-del-area]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!(await confirmDialog("Excluir esta área tática e seus resultados-chave?"))) return;
        try {
          await MockAPI.deleteAreaTatica(plano.id, btn.dataset.delArea);
          await refreshPlanoLocal();
          renderTaticoTab();
          showToast("Área tática excluída.");
        } catch (err) {
          showToast(err.message || "Não foi possível excluir a área tática.", "erro");
        }
      });
    });
    target.querySelectorAll("[data-add-kr]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const areaId = btn.dataset.addKr;
        const input = document.getElementById(`kr-titulo-${areaId}`);
        const titulo = input.value.trim();
        if (!titulo) { input.focus(); return; }
        try {
          await MockAPI.addResultadoChave(plano.id, areaId, { titulo, progresso: 0 });
          await refreshPlanoLocal();
          renderTaticoTab();
        } catch (err) {
          showToast(err.message || "Não foi possível criar a sub-tarefa.", "erro");
        }
      });
    });
    target.querySelectorAll("[data-del-kr]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        try {
          await MockAPI.deleteResultadoChave(plano.id, btn.dataset.areaId, btn.dataset.delKr);
          await refreshPlanoLocal();
          renderTaticoTab();
        } catch (err) {
          showToast(err.message || "Não foi possível excluir a sub-tarefa.", "erro");
        }
      });
    });
    target.querySelectorAll("[data-toggle-kr]").forEach((cb) => {
      cb.addEventListener("change", async () => {
        const novoProgresso = cb.checked ? 100 : 0;
        try {
          await MockAPI.updateResultadoChave(plano.id, cb.dataset.areaId, cb.dataset.toggleKr, { progresso: novoProgresso });
          await refreshPlanoLocal();
          renderTaticoTab();
        } catch (err) {
          cb.checked = !cb.checked; // desfaz visualmente já que não salvou
          showToast(err.message || "Não foi possível atualizar o progresso.", "erro");
        }
      });
    });
    target.querySelectorAll("[data-drag-kr]").forEach((track) => {
      const krId = track.dataset.dragKr;
      const areaId = track.dataset.areaId;
      let dragging = false;

      function setFromEvent(e) {
        const rect = track.getBoundingClientRect();
        const pct = Math.round(Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)) * 100);
        track.querySelector(".kr-progress-fill").style.width = `${pct}%`;
        const handle = track.querySelector(".kr-progress-handle");
        if (handle) handle.style.left = `${pct}%`;
        const pctLabel = track.closest(".kr-row").querySelector(".kr-progress-pct");
        if (pctLabel) pctLabel.textContent = `${pct}%`;
        return pct;
      }

      track.addEventListener("pointerdown", (e) => {
        dragging = true;
        track.setPointerCapture(e.pointerId);
        setFromEvent(e);
      });
      track.addEventListener("pointermove", (e) => { if (dragging) setFromEvent(e); });
      track.addEventListener("pointerup", async (e) => {
        if (!dragging) return;
        dragging = false;
        const pct = setFromEvent(e);
        try {
          await MockAPI.updateResultadoChave(plano.id, areaId, krId, { progresso: pct });
          await refreshPlanoLocal();
          renderTaticoTab();
        } catch (err) {
          showToast(err.message || "Não foi possível atualizar o progresso.", "erro");
          renderTaticoTab(); // volta o slider pro valor real salvo
        }
      });
    });
    document.getElementById("btn-add-area").addEventListener("click", () => openAreaModal({}));
  }

            </select>

    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.addEventListener("click", (e) => { if (e.target === ov) close(); });
    document.getElementById("as-area-close").addEventListener("click", close);

      };

  function assessoresVinculados() {
    const cliente = state.clientesElegiveis.find((c) => c.nome === plano.clienteNome);
    const vinculadosIds = cliente?.colaboradoresVinculados || [];
    const lista = state.colaboradores.filter((p) => vinculadosIds.includes(p.id));
    return lista.length ? lista : state.colaboradores; // sem vinculados cadastrados: não trava a tela, mostra todos
  }

  function renderOperacionalTab() {
    const target = document.getElementById("plano-tab-body");
    const opcoes = assessoresVinculados();
    if (!opcoes.some((p) => p.id === assessorSelecionado)) assessorSelecionado = opcoes[0]?.id ?? null;
    target.innerHTML = `
      <div class="advisor-tabs" id="advisor-tabs">

          <button type="button" class="people-option ${p.id === assessorSelecionado ? "is-selected" : ""}" data-assessor="${p.id}">

    `;

        relatorioRascunho = null;
        target.querySelectorAll("[data-assessor]").forEach((b) => b.classList.toggle("is-selected", b === btn));
        renderOperacionalConteudo();
      });
    });
    renderOperacionalConteudo();

  let relatorioRascunho = null; // null = nao esta criando; objeto = formulario de novo relatorio aberto

  function novoRelatorioVazio(anterior) {
    return {
      data: isoDate(new Date()), interlocutor: anterior?.interlocutor || "",
      assuntos: [""], observacoes: "",
      cronogramaMes: anterior?.cronogramaMes?.length
        ? anterior.cronogramaMes.map((c) => ({ ...c, feito: false }))
        : [{ data: "", horario: "", feito: false }],
      tarefasOperacionais: anterior?.tarefasOperacionais?.length
        ? anterior.tarefasOperacionais.map((t) => ({ ...t }))
        : [{ descricao: "", tipo: "assessor", dataEntrega: "" }],
    };
  }

  async function renderOperacionalConteudo() {
    const op = await MockAPI.getOrCreateOperacional(plano.id, assessorSelecionado);
    const isSelf = Auth.getCurrentUser()?.id === assessorSelecionado;

    const target = document.getElementById("operacional-content");
    if (!target) return;
    target.innerHTML = `
      <div class="card-header" style="padding:0 0 12px">
        <div class="card-title">Relatórios de acompanhamento</div>
        ${isSelf && !relatorioRascunho ? `<button class="btn btn-primary btn-sm" id="btn-novo-relatorio">${icon("plus", { size: 13 })} Novo relatório</button>` : ""}
      </div>

      <div id="relatorio-form-area"></div>

      ${op.encontros.length ? op.encontros.map((en) => relatorioCardHtml(en, isSelf, personById(assessorSelecionado)?.nome)).join("") : (!relatorioRascunho ? `<div class="empty-state"><strong>Nenhum relatório ainda</strong><p>Clique em "Novo relatório" pra registrar o primeiro encontro.</p></div>` : "")}
    `;

    if (relatorioRascunho) renderRelatorioForm();

    if (isSelf) {
      document.getElementById("btn-novo-relatorio")?.addEventListener("click", () => {
        const maisRecente = op.encontros.reduce((max, e) => (!max || e.numero > max.numero ? e : max), null);
        relatorioRascunho = novoRelatorioVazio(maisRecente);
        renderOperacionalConteudo();
      });
      target.querySelectorAll("[data-editar-relatorio]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const en = op.encontros.find((x) => x.id === btn.dataset.editarRelatorio);
          if (!en) return;
          relatorioRascunho = {
            id: en.id, numero: en.numero,
            data: en.data, interlocutor: en.interlocutor || "",
            assuntos: en.assuntos?.length ? [...en.assuntos] : [""],
            observacoes: en.observacoes || "",
            cronogramaMes: en.cronogramaMes?.length ? en.cronogramaMes.map((c) => ({ ...c })) : [{ data: "", horario: "" }],
            tarefasOperacionais: en.tarefasOperacionais?.length ? en.tarefasOperacionais.map((t) => ({ ...t })) : [{ descricao: "", tipo: "assessor", dataEntrega: "" }],
          };
          renderOperacionalConteudo();
        });
      });
      target.querySelectorAll("[data-excluir-relatorio]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const en = op.encontros.find((x) => x.id === btn.dataset.excluirRelatorio);
          if (!en) return;
          if (!(await confirmDialog(`Excluir o Relatório ${en.numero}? Essa ação não pode ser desfeita.`))) return;
          await MockAPI.deleteEncontro(en.id);
          if (relatorioRascunho?.id === en.id) relatorioRascunho = null;
          await renderOperacionalConteudo();
          showToast("Relatório excluído.");
        });
      });
    }
    target.querySelectorAll("[data-imprimir-relatorio]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const en = op.encontros.find((x) => x.id === btn.dataset.imprimirRelatorio);
        if (en) imprimirRelatorioIndividual(plano, en, personById(assessorSelecionado));
      });
    });
  }
