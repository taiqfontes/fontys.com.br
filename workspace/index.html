          <button class="btn btn-primary btn-sm" id="btn-new-event">${icon("plus", { size: 15 })} Novo evento</button>
          <button class="btn btn-secondary btn-sm" id="btn-meus-horarios" title="Configurar link de agendamento">${icon("clock", { size: 14 })} Meus horários</button>
          ${Auth.getCurrentUser()?.role !== "colaborador" ? `<button class="btn btn-secondary btn-sm" id="btn-filtrar-equipe" title="Ocultar pessoas da sua visualização">${icon("users", { size: 14 })} Equipe</button>` : ""}
        </div>
      </div>

      <div id="agenda-body"></div>
    </div>`;

  bindToolbar();
  renderBody();
}

function bindToolbar() {
  document.getElementById("nav-prev").addEventListener("click", () => { navigate(-1); });
  document.getElementById("nav-next").addEventListener("click", () => { navigate(1); });
  document.getElementById("nav-today").addEventListener("click", () => { state.refDate = new Date(); paint(); });
  document.getElementById("btn-meus-horarios").addEventListener("click", () => { openMeusHorariosModal(); });
  document.getElementById("btn-new-event").addEventListener("click", () => openEventModal({ mode: "create", defaultDate: state.refDate }));
  document.getElementById("btn-filtrar-equipe")?.addEventListener("click", () => openFiltroEquipeModal());
  document.querySelectorAll("#view-tabs .tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => { state.view = btn.dataset.view; paint(); });
  });
}

function navigate(dir) {
  if (state.view === "month") state.refDate = addMonths(state.refDate, dir);
  else if (state.view === "week") state.refDate = addDays(state.refDate, dir * 7);
  else state.refDate = addDays(state.refDate, dir);
  paint();
}

function renderBody() {
  const body = document.getElementById("agenda-body");
  if (state.view === "month") body.innerHTML = monthHtml();
  else if (state.view === "week") body.innerHTML = timegridHtml(7);
  else body.innerHTML = dayHtml();

  if (state.view === "month") bindMonthEvents();
  else bindTimegridEvents(state.view === "week" ? 7 : 1);
}

/* ================================ MÊS ==================================== */

function monthHtml() {
  const rangeStart = startOfWeek(startOfMonth(state.refDate));
  const rangeEnd = addDays(rangeStart, 41);
  const occ = expandOccurrences(state.events, rangeStart, rangeEnd);

  const byDate = new Map();
  occ.forEach((e) => {
    const arr = byDate.get(e.data) || [];
    arr.push(e);
    byDate.set(e.data, arr);
  });
  byDate.forEach((arr) => arr.sort((a, b) => (a.diaInteiro ? -1 : 1) - (b.diaInteiro ? -1 : 1) || (a.horaInicio || "").localeCompare(b.horaInicio || "")));

  const today = new Date();
  const weekdaysHtml = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"].map((w) => `<span>${w}</span>`).join("");

  let cellsHtml = "";
  for (let i = 0; i < 42; i++) {
    const date = addDays(rangeStart, i);
    const key = isoDate(date);
    const dayEvents = byDate.get(key) || [];
    const outside = !isSameMonth(date, state.refDate);
    const isToday = isSameDay(date, today);
    const visible = dayEvents.slice(0, 3);
    const extra = dayEvents.length - visible.length;

    const pillsHtml = visible
      .map((ev) => {
        const cor = ev.cor || CORES_AGENDA[0];
        const draggable = ev.recorrencia === "none";
        const ehExterno = state.nomeClientePorEvento?.has(ev.id);
        return `
        <div class="month-event-pill" style="--pill-color:${cor};--pill-color-soft:${hex2rgba(cor, 0.16)}"
             data-event-id="${ev.id}" data-occ-date="${ev.data}" ${draggable ? 'draggable="true"' : ""} ${ehExterno ? `title="Agendado por ${state.nomeClientePorEvento.get(ev.id)} pelo link público"` : ""}>
          <span class="dot"></span>
          ${!ev.diaInteiro ? `<span class="time">${ev.horaInicio}</span>` : ""}
          ${ehExterno ? icon("colaboradores", { size: 10, className: "item-externo-icon" }) : ""}
          <span>${ev.titulo}</span>
        </div>`;
      })
      .join("");

    cellsHtml += `
      <div class="month-cell ${outside ? "is-outside" : ""} ${isToday ? "is-today" : ""}" data-date="${key}">
        <div class="month-cell-head">
          <span class="month-cell-num" data-goto-day="${key}">${date.getDate()}</span>
          <button class="month-cell-add" data-add-date="${key}" title="Novo evento">${icon("plus", { size: 12 })}</button>
        </div>
        ${pillsHtml}
        ${extra > 0 ? `<span class="month-cell-more">+${extra} mais</span>` : ""}
      </div>`;
  }

  return `
    <div class="agenda-card">
      <div class="month-weekdays">${weekdaysHtml}</div>
      <div class="month-grid">${cellsHtml}</div>
    </div>`;
}

function bindMonthEvents() {
  const grid = document.querySelector(".month-grid");
  if (!grid) return;

  grid.querySelectorAll("[data-goto-day]").forEach((el) => {
    el.addEventListener("click", () => { state.refDate = parseIso(el.dataset.gotoDay); state.view = "day"; paint(); });
  });
  grid.querySelectorAll("[data-add-date]").forEach((el) => {
    el.addEventListener("click", (e) => { e.stopPropagation(); openEventModal({ mode: "create", defaultDate: parseIso(el.dataset.addDate) }); });
  });
  grid.querySelectorAll(".month-event-pill").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const ev = state.events.find((x) => x.id === el.dataset.eventId);
      if (ev) openEventModal({ mode: "edit", event: ev, occDate: el.dataset.occDate });
    });
    el.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", el.dataset.eventId); });
  });
  grid.querySelectorAll(".month-cell").forEach((cell) => {
    cell.addEventListener("dragover", (e) => { e.preventDefault(); cell.classList.add("is-drag-over"); });
    cell.addEventListener("dragleave", () => cell.classList.remove("is-drag-over"));
    cell.addEventListener("drop", async (e) => {
      e.preventDefault();
      cell.classList.remove("is-drag-over");
      const id = e.dataTransfer.getData("text/plain");
      if (!id) return;
      await MockAPI.updateEvento(id, { data: cell.dataset.date });
      state.events = aplicarVisibilidade(await MockAPI.getEventos());
      renderBody();
    });
  });
}

/* ============================ SEMANA / DIA =============================== */

function timegridHtml(numDays) {
  const start = numDays === 7 ? startOfWeek(state.refDate) : state.refDate;
  const days = Array.from({ length: numDays }, (_, i) => addDays(start, i));
  const rangeStart = new Date(start); rangeStart.setHours(0, 0, 0, 0);
  const rangeEnd = addDays(rangeStart, numDays - 1);
  const occ = expandOccurrences(state.events, rangeStart, rangeEnd);

  const today = new Date();
  const allDayEvents = occ.filter((e) => e.diaInteiro);
  const timedEvents = occ.filter((e) => !e.diaInteiro);

  const headerCells = days
    .map((d) => `
      <div class="timegrid-header-cell ${isSameDay(d, today) ? "is-today" : ""}">
        <div class="wd">${formatWeekdayShort(d)}</div>
        <div class="num">${d.getDate()}</div>
      </div>`)
    .join("");

  const alldayCells = days
    .map((d) => {
      const key = isoDate(d);
      const items = allDayEvents.filter((e) => e.data === key);
      return `<div class="allday-cell">${items
        .map((e) => `<span class="allday-chip" style="--chip-color:${e.cor || CORES_AGENDA[0]}">${e.titulo}</span>`)
        .join("")}</div>`;
    })
    .join("");

  const hourLabels = Array.from({ length: HOUR_END - HOUR_START }, (_, i) => {
    const h = HOUR_START + i;
    return `<div class="timegrid-hour-label">${pad(h)}:00</div>`;
  }).join("");

  const gridHeight = (HOUR_END - HOUR_START) * HOUR_PX;

  const columns = days
    .map((d) => {
      const key = isoDate(d);
      const items = timedEvents.filter((e) => e.data === key);
      const blocks = items
        .map((e) => {
          const cor = e.cor || CORES_AGENDA[0];
          const startMin = Math.max(timeToMinutes(e.horaInicio), HOUR_START * 60);
          const endMin = Math.min(timeToMinutes(e.horaFim || e.horaInicio), HOUR_END * 60);
          const top = ((startMin - HOUR_START * 60) / 60) * HOUR_PX;
          const height = Math.max(((endMin - startMin) / 60) * HOUR_PX, 20);
          const draggable = e.recorrencia === "none";
          return `
          <div class="event-block" style="top:${top}px;height:${height}px;--block-color:${cor}"
               data-event-id="${e.id}" data-occ-date="${e.data}" ${draggable ? 'draggable="true"' : ""} title="${e.titulo}">
            <span class="ev-time">${e.horaInicio}–${e.horaFim}</span>
            <span class="ev-title">${e.titulo}</span>
          </div>`;
        })
        .join("");
      return `<div class="timegrid-col ${isSameDay(d, today) ? "is-today" : ""}" data-date="${key}" style="height:${gridHeight}px">${blocks}</div>`;
    })
    .join("");

  return `
    <div class="agenda-card">
      <div class="timegrid-wrap">
        <div class="timegrid-gutter"></div>
        <div class="timegrid-days" style="grid-template-columns:1fr">
          <div class="timegrid-header" style="grid-template-columns:repeat(${numDays},1fr)">${headerCells}</div>
          <div class="allday-row" style="grid-template-columns:repeat(${numDays},1fr)">${alldayCells}</div>
        </div>
      </div>
      <div class="timegrid-body">
        <div class="timegrid-hours">${hourLabels}</div>
        <div class="timegrid-columns" style="grid-template-columns:repeat(${numDays},1fr)">${columns}</div>
      </div>
    </div>`;
}

function ownerTagHtmlAgenda(e) {
  const user = Auth.getCurrentUser();
  if (user?.role !== "gestor") return "";
  const donoId = e.criadoPor;
  if (!donoId || donoId === user.id) return "";
  const dono = state.colaboradores.find((c) => c.id === donoId);
  if (!dono) return "";
  return `<span class="item-owner-tag" title="Criado por ${dono.nome}">${avatarHtml(dono, { sizePx: 15, fontSizePx: 8 })}${dono.nome.split(" ")[0]}</span>`;
}

function tituloComExternoAgenda(e) {
  const nomeCliente = state.nomeClientePorEvento?.get(e.id);
  if (!nomeCliente) return e.titulo;
  return `${icon("colaboradores", { size: 12, className: "item-externo-icon" })} ${e.titulo} <span class="item-externo-nome">— ${nomeCliente}</span>`;
}

function dayHtml() {
  const key = isoDate(state.refDate);
  const rangeStart = new Date(state.refDate); rangeStart.setHours(0, 0, 0, 0);
  const occ = expandOccurrences(state.events, rangeStart, rangeStart).filter((e) => e.data === key);
  const sorted = [...occ].sort((a, b) => (a.diaInteiro ? -1 : 1) - (b.diaInteiro ? -1 : 1) || (a.horaInicio || "").localeCompare(b.horaInicio || ""));

  const listHtml = sorted.length
    ? sorted
        .map((e) => `
          <div class="item-row" data-event-id="${e.id}" data-occ-date="${e.data}" style="cursor:pointer">
            <span class="item-time">${e.diaInteiro ? "Dia todo" : e.horaInicio}</span>
            <span class="item-color-bar" style="background:${e.cor || CORES_AGENDA[0]}"></span>
            <div class="item-body">
              <div class="item-title">${tituloComExternoAgenda(e)}</div>
              <div class="item-meta">${e.local || "—"}${e.participantes?.length ? ` · ${e.participantes.length} participante(s)` : ""}</div>
            </div>
            ${ownerTagHtmlAgenda(e)}
          </div>`)
        .join("")
    : `<div class="empty-state"><strong>Nenhum evento neste dia</strong><p>Use "Novo evento" para adicionar um compromisso.</p></div>`;

  return `
    <div class="day-layout">
      ${timegridHtml(1)}
      <div class="card">
        <div class="card-header"><div class="card-title">Compromissos do dia</div></div>
        <div id="day-list">${listHtml}</div>
      </div>
    </div>`;
}

function bindTimegridEvents(numDays) {
  document.querySelectorAll(".event-block").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const ev = state.events.find((x) => x.id === el.dataset.eventId);
      if (ev) openEventModal({ mode: "edit", event: ev, occDate: el.dataset.occDate });
    });
    el.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", el.dataset.eventId); });
  });

  document.querySelectorAll("#day-list [data-event-id]").forEach((el) => {
    el.addEventListener("click", () => {
      const ev = state.events.find((x) => x.id === el.dataset.eventId);
      if (ev) openEventModal({ mode: "edit", event: ev, occDate: el.dataset.occDate });
    });
  });

  document.querySelectorAll(".timegrid-col").forEach((col) => {
    col.addEventListener("dragover", (e) => e.preventDefault());
    col.addEventListener("drop", async (e) => {
      e.preventDefault();
      const id = e.dataTransfer.getData("text/plain");
      if (!id) return;
      const rect = col.getBoundingClientRect();
      const offsetY = Math.max(0, e.clientY - rect.top);
      const rawMinutes = HOUR_START * 60 + (offsetY / HOUR_PX) * 60;
      const snapped = Math.round(rawMinutes / 15) * 15;
      const ev = state.events.find((x) => x.id === id);
      if (!ev) return;
      const duration = timeToMinutes(ev.horaFim || ev.horaInicio) - timeToMinutes(ev.horaInicio);
      const newStart = Math.min(Math.max(snapped, HOUR_START * 60), HOUR_END * 60 - duration);
      await MockAPI.updateEvento(id, {
        data: col.dataset.date,
        horaInicio: minutesToTime(newStart),
        horaFim: minutesToTime(newStart + duration),
      });
      state.events = aplicarVisibilidade(await MockAPI.getEventos());
      renderBody();
    });
    col.addEventListener("click", (e) => {
      if (e.target !== col) return;
      const rect = col.getBoundingClientRect();
      const rawMinutes = HOUR_START * 60 + ((e.clientY - rect.top) / HOUR_PX) * 60;
      const snapped = Math.round(rawMinutes / 15) * 15;
      openEventModal({ mode: "create", defaultDate: parseIso(col.dataset.date), defaultTime: minutesToTime(snapped) });
    });
  });

  // Ao abrir semana/dia, a grade vai de 04:00 à 00:00, mas começamos a visão
  // já rolada pra mostrar a faixa comercial (07h em diante) sem esconder o resto.
  const body = document.querySelector(".timegrid-body");
  if (body) {
    body.scrollTop = Math.max(0, (HORA_VISIVEL_PADRAO - HOUR_START) * HOUR_PX - 16);
  }
}

const DIAS_SEMANA_CURTOS = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

function limparParaSlug(texto) {
  return (texto || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, "");
}

/**
 * Endereço do link de agendamento — sempre "nome.sobrenome", travado (não
 * editável), pra ninguém ficar trocando o link depois de já ter compartilhado.
 * Só primeiro e último nome contam; nomes do meio ficam de fora.
 */
function slugPadrao(nomeCompleto) {
  const partes = (nomeCompleto || "").trim().split(/\s+/).filter(Boolean).map(limparParaSlug).filter(Boolean);
  if (partes.length === 0) return "";
  if (partes.length === 1) return partes[0];
  return `${partes[0]}.${partes[partes.length - 1]}`;
}

async function openMeusHorariosModal() {
  document.querySelector(".modal-overlay")?.remove();
  const user = Auth.getCurrentUser();
  if (!user) return;

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "meus-horarios-overlay";
  overlay.innerHTML = `
    <div class="modal-panel" style="width:540px">
      <div class="modal-header">
        <h3>Meus horários disponíveis</h3>
        <button class="modal-close-btn" id="mh-close">${icon("chevronDown", { size: 16 })}</button>
      </div>
      <div class="modal-body" id="mh-body">
        <p class="text-tertiary" style="font-size:12px">Carregando...</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="mh-fechar">Fechar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const closeThis = () => overlay.remove();
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeThis(); });
  document.getElementById("mh-close").addEventListener("click", closeThis);
  document.getElementById("mh-fechar").addEventListener("click", closeThis);

  const [cfgExistente, regras, excecoes] = await Promise.all([
    MockAPI.getAgendaPublicaConfig(user.id),
    MockAPI.getDisponibilidadeRegras(user.id),
    MockAPI.getDisponibilidadeExcecoes(user.id),
  ]);
  let cfg = cfgExistente
    ? { ...cfgExistente, slug: slugPadrao(user.name) }
    : { colaboradorId: user.id, ativo: false, slug: slugPadrao(user.name), duracaoSlotMin: 60, antecedenciaMinimaHoras: 2, diasFuturos: 30, intervaloMin: 0 };
  let regrasAtuais = regras;
  let excecoesAtuais = excecoes;

  const body = document.getElementById("mh-body");
  if (!body) return; // modal já foi fechado enquanto carregava

  function linkCompleto() {
    return `${window.location.origin}${window.location.pathname}#/agendar/${cfg.slug || ""}`;
  }

  function renderCorpo() {
    // Lista unificada: cada horário recorrente (regra) e cada data específica
    // (exceção "disponível") aparecem juntos, ordenados, cada um com sua tag.
    const itensRecorrentes = regrasAtuais.map((r) => ({ tipo: "regra", id: r.id, ordem: r.diaSemana, label: `${DIAS_SEMANA_CURTOS[r.diaSemana]}, ${r.horaInicio} – ${r.horaFim}` }));
    const itensUnicos = excecoesAtuais.filter((e) => e.tipo === "disponivel").map((e) => ({ tipo: "excecao", id: e.id, ordem: e.data, label: `${new Date(`${e.data}T00:00:00`).toLocaleDateString("pt-BR")}, ${e.horaInicio} – ${e.horaFim}` }));
    const todosItens = [...itensRecorrentes, ...itensUnicos].sort((a, b) => (a.tipo === b.tipo ? (a.ordem > b.ordem ? 1 : -1) : (a.tipo === "regra" ? -1 : 1)));

    body.innerHTML = `
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:var(--space-3)">
        <input type="checkbox" id="mh-ativo" ${cfg.ativo ? "checked" : ""} />
        <span>Ativar link de agendamento público</span>
      </label>

      <div id="mh-link-wrap" class="${cfg.ativo ? "" : "hidden"}">
        <div class="field">
          <label>Link pra compartilhar</label>
          <div style="display:flex;gap:8px">
            <input type="text" id="mh-link-preview" readonly value="${linkCompleto()}" style="flex:1;font-size:12px" />
            <button type="button" class="btn btn-secondary btn-sm" id="mh-copiar">Copiar</button>
          </div>
          <p class="text-tertiary" style="font-size:11px;margin-top:4px">Fixo no formato nome.sobrenome — não muda depois de criado.</p>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Duração de cada horário</label>
          <select id="mh-duracao">
            ${[15, 30, 45, 60, 90, 120].map((m) => `<option value="${m}" ${cfg.duracaoSlotMin === m ? "selected" : ""}>${m} min</option>`).join("")}
          </select>
        </div>
        <div class="field">

        const dataOcorrencia = occDate || ev.data;
        if (escopo === "este") {
          const novasExcecoes = [...(ev.excecoes || []), dataOcorrencia];

    const participantes = Array.from(overlay.querySelectorAll("#f-participantes input:checked")).map((el) => el.value);
    const usuarioAtual = Auth.getCurrentUser()?.id;
    if (usuarioAtual && !participantes.includes(usuarioAtual)) participantes.push(usuarioAtual);
    const payload = {
      titulo,
      data: document.getElementById("f-data").value,
      horaInicio: document.getElementById("f-inicio").value,
      horaFim: document.getElementById("f-fim").value,

      diaInteiro: false,

    const participantesAntes = isEdit ? (ev.participantes || []) : [];
    const novosConvidados = participantes.filter((id) => id !== usuarioAtual && !participantesAntes.includes(id));
    const removidos = participantesAntes.filter((id) => id !== usuarioAtual && !participantes.includes(id));

    let eventoSalvo;

      const remetente = state.colaboradores.find((c) => c.id === usuarioAtual);
      const dataFmt = new Date(`${payload.data}T00:00:00`).toLocaleDateString("pt-BR");
      const corpo = `${remetente?.nome || "Alguém"} te convidou para "${titulo}" em ${dataFmt}${payload.horaInicio ? ` às ${payload.horaInicio}` : ""}.`;
      await Promise.all(novosConvidados.map((colaboradorId) =>
        MockAPI.convidarParaEvento({
          eventoId: eventoSalvo.id, colaboradorId, remetenteId: usuarioAtual,
          titulo: "Convite para compromisso", corpo,
        })
      ));
    }
    if (removidos.length) {
      await Promise.all(removidos.map((colaboradorId) => MockAPI.removerConviteEvento(eventoSalvo.id, colaboradorId)));
    }

    state.events = aplicarVisibilidade(await MockAPI.getEventos());
    closeModal();
    renderBody();
    showToast(isEdit ? "Evento atualizado." : "Evento criado.");
  });
}

  return { renderAgenda };

/* ============================ FILTRO DE EQUIPE (visual, pessoal) ============================ */
// Espelha o mesmo padrão da Agenda: cada pessoa (admin/gestor) pode esconder
// colegas da própria visualização de tarefas. É só uma preferência local —
// não muda o acesso real de ninguém, e o Dashboard lê essa mesma chave pra
// manter a "Tarefas pendentes" consistente com o que a pessoa escolheu ver aqui.
function ocultosStorageKey() {
  return `d2n_tarefas_ocultos_${Auth.getCurrentUser()?.id || "anon"}`;
}
function getOcultos() {
  try { return JSON.parse(localStorage.getItem(ocultosStorageKey()) || "[]"); } catch { return []; }
}
function setOcultos(ids) {
  try { localStorage.setItem(ocultosStorageKey(), JSON.stringify(ids)); } catch { /* ignora se localStorage indisponível */ }
}

const hex2rgba = (hex, alpha) => {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${alpha})`;
};

function personById(id) {
  return state.colaboradores.find((p) => p.id === id) || null;
}

function formatDatePt(iso) {
  if (!iso) return "—";
  const d = parseIso(iso);
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}

function isOverdue(t) {
  if (t.status === "done") return false;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return parseIso(t.prazo) < today;
}

/* ============================== FILTROS ============================== */

function getFiltered() {
  const { responsavel, prioridade, etiqueta, busca, origem } = state.filters;
  const user = Auth.getCurrentUser();
  const escopo = Auth.permissionFor("tarefas");
  return state.tarefas.filter((t) => {
    // Quem tem escopo "own" nunca enxerga tarefa de outra pessoa, nem na
    // aba "Todas" — mesmo que seja do mesmo cliente. As abas Minhas/
    // Recebidas continuam funcionando como sub-filtro dentro disso.
    if (escopo === "own" && t.responsavelId !== user?.id && t.criadoPor !== user?.id) return false;
    if (state.ocultos.length && t.responsavelId !== user?.id && state.ocultos.includes(t.responsavelId)) return false;
    if (responsavel !== "all" && t.responsavelId !== responsavel) return false;
    if (prioridade !== "all" && t.prioridade !== prioridade) return false;
    if (etiqueta !== "all" && !t.etiquetas.includes(etiqueta)) return false;
    if (busca && !`${t.titulo} ${t.descricao || ""}`.toLowerCase().includes(busca.toLowerCase())) return false;
    if (origem === "minhas" && !(t.responsavelId === user?.id && t.criadoPor === user?.id)) return false;
    if (origem === "recebidas" && !(t.responsavelId === user?.id && t.criadoPor && t.criadoPor !== user?.id)) return false;
    return true;
  });
}

}

  state.container = container;
  state.tarefas = await MockAPI.getTarefas();
  state.projetos = await carregarProjetos();
  state.colaboradores = (await MockAPI.getColaboradores()).filter((c) => c.status === "ativo");
  state.ocultos = getOcultos();
  if (!container.isConnected) return;
  paint();
}

function paint() {
  const container = state.container;
  container.innerHTML = `
    <div class="view-enter">
      <div class="tarefas-toolbar">
        <div class="tarefas-toolbar-left">
          <div class="tab-row" id="view-tabs">
            <button class="tab-btn ${state.view === "projeto" ? "is-active" : ""}" data-view="projeto">Projeto</button>
            <button class="tab-btn ${state.view === "kanban" ? "is-active" : ""}" data-view="kanban">Kanban</button>
            <button class="tab-btn ${state.view === "calendar" ? "is-active" : ""}" data-view="calendar">Calendário</button>
          </div>

          <div class="tab-row" id="origem-tabs">
            <button class="tab-btn ${state.filters.origem === "todas" ? "is-active" : ""}" data-origem="todas">Todas</button>
            <button class="tab-btn ${state.filters.origem === "minhas" ? "is-active" : ""}" data-origem="minhas">Minhas</button>
            <button class="tab-btn ${state.filters.origem === "recebidas" ? "is-active" : ""}" data-origem="recebidas">Recebidas</button>
          </div>

          <label class="tarefas-search">
            ${icon("search", { size: 14 })}
            <input type="text" id="f-busca" placeholder="Buscar tarefas..." value="${state.filters.busca}" />
          </label>

          <span class="filter-chip">
            ${icon("users", { size: 13 })}
            <select id="f-responsavel">
              <option value="all">Responsável</option>
              ${state.colaboradores.map((p) => `<option value="${p.id}" ${state.filters.responsavel === p.id ? "selected" : ""}>${p.nome}</option>`).join("")}
            </select>
          </span>

          <span class="filter-chip">
            <select id="f-prioridade">
              <option value="all">Prioridade</option>
              ${Object.entries(PRIORIDADE_TAREFA).map(([k, v]) => `<option value="${k}" ${state.filters.prioridade === k ? "selected" : ""}>${v.label}</option>`).join("")}
            </select>
          </span>

          <span class="filter-chip">
            <select id="f-etiqueta">
              <option value="all">Etiqueta</option>
              ${ETIQUETAS_DISPONIVEIS.map((e) => `<option value="${e}" ${state.filters.etiqueta === e ? "selected" : ""}>${e}</option>`).join("")}
            </select>
          </span>
        </div>

        <div style="display:flex;align-items:center;gap:8px">
          ${Auth.getCurrentUser()?.role !== "colaborador" ? `<button class="btn btn-secondary btn-sm" id="btn-filtrar-equipe" title="Ocultar pessoas da sua visualização">${icon("users", { size: 14 })} Equipe</button>` : ""}
          <button class="btn btn-primary btn-sm" id="btn-new-tarefa">${icon("plus", { size: 15 })} Nova tarefa</button>
        </div>
      </div>

      <div id="tarefas-body"></div>
    </div>`;

  bindToolbar();
  renderBody();
}

function bindToolbar() {
  document.querySelectorAll("#view-tabs .tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => { state.view = btn.dataset.view; paint(); });
  });
  document.querySelectorAll("#origem-tabs .tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => { state.filters.origem = btn.dataset.origem; paint(); });
  });
  document.getElementById("btn-filtrar-equipe")?.addEventListener("click", () => openFiltroEquipeModal());
  document.getElementById("btn-new-tarefa").addEventListener("click", () => openTaskModal({
    mode: "create",
    task: state.view === "projeto" && state.projetoSelecionadoId ? { projetoId: state.projetoSelecionadoId } : {},
  }));

  document.getElementById("f-busca").addEventListener("input", (e) => {
    state.filters.busca = e.target.value;
    renderBody();
  });
  document.getElementById("f-responsavel").addEventListener("change", (e) => { state.filters.responsavel = e.target.value; renderBody(); });
  document.getElementById("f-prioridade").addEventListener("change", (e) => { state.filters.prioridade = e.target.value; renderBody(); });
  document.getElementById("f-etiqueta").addEventListener("change", (e) => { state.filters.etiqueta = e.target.value; renderBody(); });
}

function renderBody() {
  const body = document.getElementById("tarefas-body");
  const filtered = getFiltered();
  if (state.view === "kanban") body.innerHTML = kanbanHtml(filtered);
  else if (state.view === "projeto") body.innerHTML = projetoHtml(filtered);
  else body.innerHTML = calendarHtml(filtered);

  if (state.view === "kanban") bindKanbanEvents();
  else if (state.view === "projeto") bindProjetoEvents();
  else bindCalendarEvents();
}

/* ================================ KANBAN ================================= */

function taskCardHtml(t) {
  const prio = PRIORIDADE_TAREFA[t.prioridade];
  const checklistDone = t.checklist.filter((c) => c.feito).length;
  const overdue = isOverdue(t);
  const resp = personById(t.responsavelId);
  return `
    <div class="kanban-card" draggable="true" data-task-id="${t.id}" style="border-left:3px solid ${prio.cor}">
      <div class="kanban-card-title">${t.titulo}</div>
      ${t.etiquetas.length ? `<div class="kanban-card-tags">${t.etiquetas.map((e) => `<span class="kanban-tag">${e}</span>`).join("")}</div>` : ""}
      <div class="kanban-card-footer">
        <span class="kanban-card-due ${overdue ? "is-overdue" : ""}">${icon("clock", { size: 11 })} ${formatDatePt(t.prazo)}</span>
        ${t.checklist.length ? `<span class="kanban-checklist-mini">${icon("tarefas", { size: 11 })} ${checklistDone}/${t.checklist.length}</span>` : ""}
        ${resp ? avatarHtml(resp, { sizePx: 22, fontSizePx: 9, title: resp.nome }) : ""}
      </div>
    </div>`;
}

function kanbanHtml(list) {
  const columns = STATUS_ORDER.map((key) => {
    const cfg = STATUS_TAREFA[key];
    const items = list.filter((t) => t.status === key);
    return `
      <div class="kanban-column" data-status="${key}">
        <div class="kanban-column-head">
          <span class="kanban-dot" style="background:${cfg.cor}"></span>
          <strong>${cfg.label}</strong>
          <span>${items.length}</span>
        </div>
        <div class="kanban-cards">
          ${items.map(taskCardHtml).join("") || ""}
        </div>
      </div>`;
  }).join("");

  return `<div class="kanban-board">${columns}</div>`;
}

function bindKanbanEvents() {
  document.querySelectorAll(".kanban-card").forEach((card) => {
    card.addEventListener("click", () => {
      const t = state.tarefas.find((x) => x.id === card.dataset.taskId);
      if (t) openTaskModal({ mode: "edit", task: t });
    });
    card.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", card.dataset.taskId));
  });

  document.querySelectorAll(".kanban-column").forEach((col) => {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("is-drag-over"); });
    col.addEventListener("dragleave", () => col.classList.remove("is-drag-over"));
    col.addEventListener("drop", async (e) => {
      e.preventDefault();
      col.classList.remove("is-drag-over");
      const id = e.dataTransfer.getData("text/plain");
      if (!id) return;
      await MockAPI.updateTarefa(id, { status: col.dataset.status });
      state.tarefas = await MockAPI.getTarefas();
      renderBody();
    });
  });
}

/* ================================ PROJETO ================================= */

function taskRowHtml(t) {

  const resp = personById(t.responsavelId);
  const overdue = isOverdue(t);
  const isDone = t.status === "done";
  const projeto = t.projetoId ? state.projetos.find((p) => p.id === t.projetoId) : null;
  return `
    <div class="tarefa-row ${isDone ? "is-done" : ""}" data-task-id="${t.id}">
      <button class="tarefa-check ${isDone ? "is-done" : ""}" data-toggle-id="${t.id}" title="Concluir">${isDone ? icon("chevronDown", { size: 12 }) : ""}</button>
      <div class="tarefa-row-body">
        <div class="tarefa-row-title">${t.titulo}</div>
        <div class="tarefa-row-meta">
          ${projeto ? `<span style="color:${projeto.cor}">${projeto.nome}</span>` : ""}
          ${t.clienteNome ? `<span>${t.clienteNome}</span>` : ""}
          <span class="${overdue ? "text-mono" : ""}" style="${overdue ? "color:var(--color-danger);font-weight:600" : ""}">${formatDatePt(t.prazo)}</span>
          ${t.checklist.length ? `<span>${t.checklist.filter((c) => c.feito).length}/${t.checklist.length} checklist</span>` : ""}

        <span class="badge" style="background:${hex2rgba(prio.cor, 0.14)};color:${prio.cor}">${prio.label}</span>
        ${resp ? avatarHtml(resp, { sizePx: 24, fontSizePx: 10, title: resp.nome }) : ""}
      </div>
    </div>`;
}

function statusGroupsHtml(list) {
  const groups = STATUS_ORDER.map((key) => {
    const cfg = STATUS_TAREFA[key];
    const items = list.filter((t) => t.status === key);
    if (!items.length) return "";
    return `
      <div class="tarefas-list-group">
        <div class="tarefas-list-group-head">
          <span class="kanban-dot" style="background:${cfg.cor}"></span>
          <strong>${cfg.label}</strong>
          <span>${items.length}</span>
        </div>
        <div class="agenda-card">${items.map(taskRowHtml).join("")}</div>
      </div>`;
  }).join("");
  return groups || `<div class="empty-state"><strong>Nenhuma tarefa aqui</strong><p>Ajuste os filtros ou crie uma nova tarefa.</p></div>`;
}

function projetoHtml(list) {
  const semProjetoCount = list.filter((t) => !t.projetoId).length;
  const isTodasActive = !state.projetoSelecionadoId;
  const isSemProjetoActive = state.projetoSelecionadoId === "sem-projeto";

  const sidebarItems = state.projetos.map((p) => {
    const doProjeto = list.filter((t) => t.projetoId === p.id);
    const done = doProjeto.filter((t) => t.status === "done").length;
    const pct = doProjeto.length ? Math.round((done / doProjeto.length) * 100) : 0;
    const isActive = state.projetoSelecionadoId === p.id;
    return `
      <div class="projeto-item ${isActive ? "is-active" : ""}" data-projeto-id="${p.id}">
        <div class="projeto-item-head">

        </div>
        <div class="progress-track" style="height:5px;margin-top:6px"><div class="progress-fill" style="width:${pct}%;background:${p.cor}"></div></div>
        <span class="projeto-item-meta">${pct}% · ${done}/${doProjeto.length}</span>

  const activeList = isSemProjetoActive
    ? list.filter((t) => !t.projetoId)
    : state.projetoSelecionadoId
      ? list.filter((t) => t.projetoId === state.projetoSelecionadoId)
      : list;

  const activeLabel = isSemProjetoActive
    ? "Sem projeto"
    : state.projetoSelecionadoId
      ? (state.projetos.find((p) => p.id === state.projetoSelecionadoId)?.nome ?? "Projeto")
      : "Todas as tarefas";

  return `
    <div class="projeto-layout">
      <div class="projeto-sidebar">
        <div class="projeto-sidebar-head">
          <span>Projetos</span>
          <button class="icon-btn" id="btn-add-projeto" title="Novo projeto">${icon("plus", { size: 14 })}</button>
        </div>
        <div class="projeto-item ${isTodasActive ? "is-active" : ""}" data-projeto-id="">
          <div class="projeto-item-head"><span class="projeto-item-nome">Todas as tarefas</span></div>
        </div>
        <div class="projeto-item ${isSemProjetoActive ? "is-active" : ""}" data-projeto-id="sem-projeto">
          <div class="projeto-item-head"><span class="projeto-item-nome">Sem projeto</span><span class="projeto-item-meta" style="margin-left:auto">${semProjetoCount}</span></div>
        </div>
        <div class="projeto-sidebar-divider"></div>
        ${sidebarItems || `<span class="text-tertiary" style="font-size:12px;padding:8px;display:block">Nenhum projeto criado ainda.</span>`}
      </div>
      <div class="projeto-main">
        <div class="projeto-main-title">${activeLabel}</div>
        ${statusGroupsHtml(activeList)}
      </div>
    </div>`;
}

function openProjetoModal() {
  const CORES = ["#2e63a6", "#14253b", "#f6a831", "#2fd07a", "#ff5c6a"];
  let corSelecionada = CORES[state.projetos.length % CORES.length];
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "projeto-modal-overlay";
  overlay.innerHTML = `
    <div class="modal-panel">
      <div class="modal-header"><h3>Novo projeto</h3><button class="modal-close-btn" id="pj-close">${icon("chevronDown", { size: 16 })}</button></div>
      <div class="modal-body">
        <div class="field"><label>Nome do projeto</label><input type="text" id="pj-nome" placeholder="Ex: Reestruturação Financeira — Cliente X" /></div>
        <div class="field">
          <label>Cor</label>
          <div class="color-swatch-row" id="pj-cor">
            ${CORES.map((c) => `<button type="button" class="color-swatch ${c === corSelecionada ? "is-selected" : ""}" data-cor="${c}" style="background:${c}"></button>`).join("")}
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="pj-cancel">Cancelar</button>
        <button class="btn btn-primary" id="pj-save">Criar projeto</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  document.getElementById("pj-close").addEventListener("click", close);
  document.getElementById("pj-cancel").addEventListener("click", close);
  overlay.querySelectorAll("#pj-cor .color-swatch").forEach((btn) => {
    btn.addEventListener("click", () => {
      corSelecionada = btn.dataset.cor;
      overlay.querySelectorAll("#pj-cor .color-swatch").forEach((b) => b.classList.toggle("is-selected", b === btn));
    });
  });
  document.getElementById("pj-save").addEventListener("click", async () => {
    const nome = document.getElementById("pj-nome").value.trim();

    const novo = await MockAPI.createProjetoTarefa({ nome, cor: corSelecionada, criadoPor: Auth.getCurrentUser()?.id });
    state.projetos = await carregarProjetos();
    state.projetoSelecionadoId = novo.id;
    close();

  });
}

function bindProjetoEvents() {
  document.querySelectorAll(".projeto-item[data-projeto-id]").forEach((el) => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-del-projeto]")) return;
      state.projetoSelecionadoId = el.dataset.projetoId || null;
      renderBody();
    });
  });
  document.querySelectorAll("[data-del-projeto]").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!(await confirmDialog("Excluir este projeto? As tarefas ficam sem projeto, não são apagadas."))) return;
      await MockAPI.deleteProjetoTarefa(btn.dataset.delProjeto);
      state.projetos = await carregarProjetos();
      state.tarefas = await MockAPI.getTarefas();
      if (state.projetoSelecionadoId === btn.dataset.delProjeto) state.projetoSelecionadoId = null;
      renderBody();
    });
  });
  document.getElementById("btn-add-projeto").addEventListener("click", openProjetoModal);

  document.querySelectorAll(".tarefa-row").forEach((row) => {
    row.addEventListener("click", (e) => {
      if (e.target.closest(".tarefa-check")) return;
      const t = state.tarefas.find((x) => x.id === row.dataset.taskId);
      if (t) openTaskModal({ mode: "edit", task: t });
    });
  });
  document.querySelectorAll("[data-toggle-id]").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const t = state.tarefas.find((x) => x.id === btn.dataset.toggleId);
      if (!t) return;
      await MockAPI.updateTarefa(t.id, { status: t.status === "done" ? "todo" : "done" });
      state.tarefas = await MockAPI.getTarefas();
      renderBody();
    });
  });
}

/* =============================== CALENDÁRIO =============================== */

function calendarHtml(list) {
  const rangeStart = startOfWeek(startOfMonth(state.calRefDate));
  const byDate = new Map();
  list.forEach((t) => {
    const arr = byDate.get(t.prazo) || [];
    arr.push(t);
    byDate.set(t.prazo, arr);
  });

  const today = new Date();
  const weekdaysHtml = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"].map((w) => `<span>${w}</span>`).join("");

  let cellsHtml = "";
  for (let i = 0; i < 42; i++) {
    const date = addDays(rangeStart, i);
    const key = isoDate(date);
    const dayTasks = byDate.get(key) || [];
    const outside = !isSameMonth(date, state.calRefDate);
    const isToday = isSameDay(date, today);
    const visible = dayTasks.slice(0, 3);
    const extra = dayTasks.length - visible.length;

    const pillsHtml = visible
      .map((t) => {
        const prio = PRIORIDADE_TAREFA[t.prioridade];
        return `
        <div class="tarefa-cal-pill" style="--pill-color:${prio.cor};--pill-color-soft:${hex2rgba(prio.cor, 0.16)}" data-task-id="${t.id}">
          <span class="dot"></span><span>${t.titulo}</span>
        </div>`;
      })
      .join("");

    cellsHtml += `
      <div class="month-cell ${outside ? "is-outside" : ""} ${isToday ? "is-today" : ""}">
        <div class="month-cell-head"><span class="month-cell-num">${date.getDate()}</span></div>
        ${pillsHtml}
        ${extra > 0 ? `<span class="month-cell-more">+${extra} mais</span>` : ""}
      </div>`;
  }

  return `
    <div class="agenda-toolbar" style="margin-bottom:16px">
      <div class="agenda-nav">
        <button class="icon-btn" id="cal-prev">${icon("chevronLeft", { size: 18 })}</button>
        <button class="btn btn-secondary btn-sm" id="cal-today">Hoje</button>
        <button class="icon-btn" id="cal-next" style="transform:scaleX(-1)">${icon("chevronLeft", { size: 18 })}</button>
      </div>
      <span class="agenda-title">${formatMonthYear(state.calRefDate)}</span>
    </div>
    <div class="agenda-card">
      <div class="month-weekdays">${weekdaysHtml}</div>
      <div class="month-grid">${cellsHtml}</div>
    </div>`;
}

function bindCalendarEvents() {
  document.getElementById("cal-prev").addEventListener("click", () => { state.calRefDate = addMonths(state.calRefDate, -1); renderBody(); });
  document.getElementById("cal-next").addEventListener("click", () => { state.calRefDate = addMonths(state.calRefDate, 1); renderBody(); });
  document.getElementById("cal-today").addEventListener("click", () => { state.calRefDate = new Date(); renderBody(); });
  document.querySelectorAll(".tarefa-cal-pill").forEach((el) => {
    el.addEventListener("click", () => {
      const t = state.tarefas.find((x) => x.id === el.dataset.taskId);
      if (t) openTaskModal({ mode: "edit", task: t });
    });
  });
}

function openTaskModal({ mode, task, onSaved }) {
  closeModal();
  const isEdit = mode === "edit";
  const defaults = {
    id: null, titulo: "", descricao: "", status: "todo", prioridade: "media",
    responsavelId: Auth.getCurrentUser()?.id ?? state.colaboradores[0]?.id ?? null,
    clienteNome: "", projetoId: null, etiquetas: [], prazo: isoDate(new Date()),
    checklist: [], comentarios: [], anexos: [],
  };
  // Em modo criação, mescla com defaults (permite pré-preencher só alguns campos,
  // ex: clienteNome/responsavelId vindos do módulo Assessoria). Em edição, usa a tarefa como está.
  const t = isEdit ? task : { ...defaults, ...(task || {}) };

  let selectedPrioridade = t.prioridade;
  let selectedResponsavel = t.responsavelId;

  const usuarioAtual = Auth.getCurrentUser();
  const permissaoTarefas = Auth.permissionFor("tarefas"); // "full" | "team" | "own"
  const podeAtribuirOutros = permissaoTarefas !== "own"; // admin/gestor podem atribuir a alguém além de si mesmo
  const listaResponsaveisPermitidos =
    permissaoTarefas === "full" ? state.colaboradores
    : permissaoTarefas === "team" ? state.colaboradores.filter((p) =>
        p.id === usuarioAtual?.id || (usuarioAtual?.team || []).some((eq) => (p.equipe || []).includes(eq)))
    : state.colaboradores.filter((p) => p.id === usuarioAtual?.id);
  if (!podeAtribuirOutros) selectedResponsavel = usuarioAtual?.id ?? selectedResponsavel;
  let selectedEtiquetas = new Set(t.etiquetas);
  let checklist = [...t.checklist];
  let anexos = [...t.anexos];

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "task-modal-overlay";
  overlay.innerHTML = `
    <div class="modal-panel task-modal-panel">
      <div class="modal-header">
        <h3>${isEdit ? "Editar tarefa" : "Nova tarefa"}</h3>
        <button class="modal-close-btn" id="modal-close">${icon("chevronDown", { size: 16 })}</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>Título</label>
          <input type="text" id="f-titulo" placeholder="Ex: Enviar diagnóstico financeiro" value="${t.titulo}" />
        </div>

        <div class="field">
          <label>Checklist</label>
          <div id="checklist-items">${checklist.map(checklistItemHtml).join("")}</div>
          <div class="checklist-add">
            <input type="text" id="f-new-check" placeholder="Adicionar item..." />
            <button class="btn btn-secondary btn-sm" id="btn-add-check">${icon("plus", { size: 13 })}</button>
          </div>
        </div>

        <div class="task-modal-grid">
          <div class="field"><label>Cliente</label><input type="text" id="f-cliente" placeholder="Opcional" value="${t.clienteNome || ""}" /></div>
          <div class="field"><label>Prazo</label><input type="date" id="f-prazo" value="${t.prazo}" /></div>
        </div>

        <div class="field">
          <label>Descrição</label>
          <textarea id="f-descricao" rows="2" placeholder="Detalhes da tarefa (opcional)">${t.descricao || ""}</textarea>
        </div>

        <div class="field">
          <label>Projeto</label>
          <select id="f-projeto">
            <option value="">Sem projeto</option>
            ${state.projetos.map((p) => `<option value="${p.id}" ${t.projetoId === p.id ? "selected" : ""}>${p.nome}</option>`).join("")}
          </select>
        </div>

        <div class="field">
          <label>Status</label>
          <div class="chip-select" id="f-status">
            ${STATUS_ORDER.map((k) => `
              <button type="button" class="chip-option ${k === t.status ? "is-selected" : ""}" data-status="${k}" style="--chip-color:${STATUS_TAREFA[k].cor}">
                <span class="dot" style="background:${STATUS_TAREFA[k].cor}"></span>${STATUS_TAREFA[k].label}
              </button>`).join("")}
          </div>
        </div>

        <div class="field">
          <label>Prioridade</label>
          <div class="chip-select" id="f-prioridade">
            ${Object.entries(PRIORIDADE_TAREFA).map(([k, v]) => `
              <button type="button" class="chip-option ${k === selectedPrioridade ? "is-selected" : ""}" data-prio="${k}" style="--chip-color:${v.cor}">
                <span class="dot" style="background:${v.cor}"></span>${v.label}
              </button>`).join("")}
          </div>
        </div>

        <div class="field">
          <label>Responsável</label>
          <div class="people-select" id="f-responsavel">
            ${listaResponsaveisPermitidos.map((p) => `
              <button type="button" class="people-option ${p.id === selectedResponsavel ? "is-selected" : ""}" data-person="${p.id}">
                ${avatarHtml(p)}${p.nome.split(" ")[0]}
              </button>`).join("")}
          </div>
          ${!podeAtribuirOutros ? `<p class="text-tertiary" style="font-size:11px;margin-top:6px">Como colaborador, você só pode criar tarefas para si mesmo.</p>` : ""}
          ${permissaoTarefas === "team" ? `<p class="text-tertiary" style="font-size:11px;margin-top:6px">Como gestor, você só pode atribuir tarefas pra quem está na sua equipe.</p>` : ""}
        </div>

        <div class="field">
          <label>Etiquetas</label>
          <div class="chip-select" id="f-etiquetas">
            ${ETIQUETAS_DISPONIVEIS.map((e) => `
              <button type="button" class="chip-option ${selectedEtiquetas.has(e) ? "is-selected" : ""}" data-tag="${e}" style="--chip-color:#8996a8">${e}</button>`).join("")}
          </div>
        </div>

        <div class="field">
          <label>Anexos</label>
          <div id="attachment-items">${anexos.map((a) => `<div class="attachment-item" data-att-id="${a.id}">${icon("briefing", { size: 13 })}<span>${a.nome}</span><button class="modal-close-btn" data-att-remove="${a.id}" style="width:20px;height:20px">×</button></div>`).join("")}</div>
          <div class="checklist-add">
            <input type="text" id="f-new-att" placeholder="Nome do arquivo (ex: contrato.pdf)" />
            <button class="btn btn-secondary btn-sm" id="btn-add-att">${icon("plus", { size: 13 })}</button>
          </div>
        </div>

        ${isEdit ? `
        <div class="field">
          <label>Comentários</label>
          <div id="comment-items" style="display:flex;flex-direction:column;gap:12px">${t.comentarios.map(commentItemHtml).join("") || `<span class="text-tertiary" style="font-size:13px">Nenhum comentário ainda.</span>`}</div>
          <div class="comment-add">
            <textarea id="f-new-comment" placeholder="Escreva um comentário..."></textarea>
            <button class="btn btn-secondary btn-sm" id="btn-add-comment">Enviar</button>
          </div>
        </div>` : ""}
      </div>
      <div class="modal-footer">
        ${isEdit ? `<button class="btn btn-danger" id="f-delete" style="margin-right:auto">Excluir</button>` : ""}

        <button class="btn btn-primary" id="f-save">Salvar</button>
      </div>
    </div>`;

  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("f-cancel").addEventListener("click", closeModal);

  let selectedStatus = t.status;
  overlay.querySelectorAll("#f-status .chip-option").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedStatus = btn.dataset.status;
      overlay.querySelectorAll("#f-status .chip-option").forEach((b) => b.classList.toggle("is-selected", b === btn));
    });
  });
  overlay.querySelectorAll("#f-prioridade .chip-option").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedPrioridade = btn.dataset.prio;
      overlay.querySelectorAll("#f-prioridade .chip-option").forEach((b) => b.classList.toggle("is-selected", b === btn));
    });
  });
  overlay.querySelectorAll("#f-responsavel .people-option").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedResponsavel = btn.dataset.person;
      overlay.querySelectorAll("#f-responsavel .people-option").forEach((b) => b.classList.toggle("is-selected", b === btn));
    });
  });
  overlay.querySelectorAll("#f-etiquetas .chip-option").forEach((btn) => {
    btn.addEventListener("click", () => {
      const tag = btn.dataset.tag;
      if (selectedEtiquetas.has(tag)) selectedEtiquetas.delete(tag);
      else selectedEtiquetas.add(tag);
      btn.classList.toggle("is-selected");
    });
  });

  function bindChecklistRemovers() {
    overlay.querySelectorAll("[data-check-toggle]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.checkToggle;
        checklist = checklist.map((c) => (c.id === id ? { ...c, feito: !c.feito } : c));
        document.getElementById("checklist-items").innerHTML = checklist.map(checklistItemHtml).join("");
        bindChecklistRemovers();
      });
    });
    overlay.querySelectorAll("[data-check-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        checklist = checklist.filter((c) => c.id !== btn.dataset.checkRemove);
        document.getElementById("checklist-items").innerHTML = checklist.map(checklistItemHtml).join("");
        bindChecklistRemovers();
      });
    });
    overlay.querySelectorAll("[data-check-text]").forEach((input) => {
      input.addEventListener("input", () => {
        const id = input.dataset.checkText;
        checklist = checklist.map((c) => (c.id === id ? { ...c, texto: input.value } : c));
      });
    });
  }
  bindChecklistRemovers();

  document.getElementById("btn-add-check").addEventListener("click", () => {
    const input = document.getElementById("f-new-check");
    if (!input.value.trim()) return;
    checklist.push({ id: `c${Date.now()}`, texto: input.value.trim(), feito: false });
    document.getElementById("checklist-items").innerHTML = checklist.map(checklistItemHtml).join("");
    bindChecklistRemovers();
    input.value = "";
  });

  function bindAttachmentRemovers() {
    overlay.querySelectorAll("[data-att-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        anexos = anexos.filter((a) => a.id !== btn.dataset.attRemove);
        document.getElementById("attachment-items").innerHTML = anexos.map((a) => `<div class="attachment-item" data-att-id="${a.id}">${icon("briefing", { size: 13 })}<span>${a.nome}</span><button class="modal-close-btn" data-att-remove="${a.id}" style="width:20px;height:20px">×</button></div>`).join("");
        bindAttachmentRemovers();
      });
    });
  }
  bindAttachmentRemovers();

  document.getElementById("btn-add-att").addEventListener("click", () => {
    const input = document.getElementById("f-new-att");
    if (!input.value.trim()) return;
    anexos.push({ id: `a${Date.now()}`, nome: input.value.trim() });
    document.getElementById("attachment-items").innerHTML = anexos.map((a) => `<div class="attachment-item" data-att-id="${a.id}">${icon("briefing", { size: 13 })}<span>${a.nome}</span><button class="modal-close-btn" data-att-remove="${a.id}" style="width:20px;height:20px">×</button></div>`).join("");
    bindAttachmentRemovers();
    input.value = "";
  });

  if (isEdit) {
    document.getElementById("btn-add-comment").addEventListener("click", async () => {
      const input = document.getElementById("f-new-comment");
      if (!input.value.trim()) return;
      const comentario = { id: `cm${Date.now()}`, autorId: Auth.getCurrentUser()?.id, texto: input.value.trim(), data: isoDate(new Date()) };
      await MockAPI.addComentario(t.id, comentario);
      state.tarefas = await MockAPI.getTarefas();
      const updated = state.tarefas.find((x) => x.id === t.id);
      document.getElementById("comment-items").innerHTML = updated.comentarios.map(commentItemHtml).join("");
      input.value = "";
    });

    document.getElementById("f-delete").addEventListener("click", async () => {
      if (!(await confirmDialog("Excluir esta tarefa?"))) return;
      await MockAPI.deleteTarefa(t.id);
      state.tarefas = await MockAPI.getTarefas();
      closeModal();
      if (typeof onSaved === "function") onSaved();
      else if (document.getElementById("tarefas-body")) renderBody();
      showToast("Tarefa excluída.");
    });
  }

  document.getElementById("f-save").addEventListener("click", async () => {
    const titulo = document.getElementById("f-titulo").value.trim();
    if (!titulo) { document.getElementById("f-titulo").focus(); return; }
    const payload = {
      titulo,
      descricao: document.getElementById("f-descricao").value.trim(),
      clienteNome: document.getElementById("f-cliente").value.trim() || null,
      projetoId: document.getElementById("f-projeto").value || null,
      prazo: document.getElementById("f-prazo").value,
      status: selectedStatus,
      prioridade: selectedPrioridade,
      responsavelId: selectedResponsavel,
      etiquetas: Array.from(selectedEtiquetas),
      checklist,
      anexos,
    };
    if (isEdit) {
      await MockAPI.updateTarefa(t.id, payload);
    } else {
      payload.criadoPor = Auth.getCurrentUser()?.id ?? selectedResponsavel;
      await MockAPI.createTarefa(payload);
    }
    state.tarefas = await MockAPI.getTarefas();
    closeModal();
    if (typeof onSaved === "function") onSaved();
    else if (document.getElementById("tarefas-body")) renderBody();
    showToast(isEdit ? "Tarefa atualizada." : "Tarefa criada.");
  });
}

  return { renderTarefas, openTaskModal };
})();

/* ===== js/modules/clientes.js (escopo isolado) ===== */
const { renderClientes } = (function () {

/* ===== js/modules/clientes.js ===== */




const state = {
  view: "grid",
  clientes: [],
  produtosDisponiveis: [],
  colaboradores: [],
  filters: { status: "all", segmento: "all", busca: "" },
  container: null,
};

const LOGO_PALETTE = ["#2e63a6", "#14253b", "#f6a831", "#2fd07a", "#4fb3ff", "#ff5c6a"];

function logoColorFor(nome) {
  let hash = 0;
  for (let i = 0; i < nome.length; i++) hash = nome.charCodeAt(i) + ((hash << 5) - hash);
  return LOGO_PALETTE[Math.abs(hash) % LOGO_PALETTE.length];
}

function initials(nome) {
  return nome.split(" ").filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
}

function logoHtml(c, size) {
  if (c.logoUrl) {
    return `<span class="cliente-logo" style="width:${size}px;height:${size}px;padding:0;overflow:hidden"><img src="${c.logoUrl}" style="width:100%;height:100%;object-fit:cover" /></span>`;
  }
  return `<span class="cliente-logo" style="width:${size}px;height:${size}px;${size < 40 ? "font-size:12px" : ""}background:${logoColorFor(c.nome || "?")}">${c.nome ? initials(c.nome) : icon("clientes", { size: Math.round(size * 0.45) })}</span>`;
}

function personById(id) {
  return state.colaboradores.find((p) => p.id === id) || null;
}

function currency(v) {
  return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
}

function formatDatePt(iso) {
  return parseIso(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
}

/* ============================== FILTROS ============================== */

function getFiltered() {
  const { status, segmento, busca } = state.filters;
  return state.clientes.filter((c) => {
    if (status !== "all" && c.status !== status) return false;
    if (segmento !== "all" && c.segmento !== segmento) return false;
    if (busca && !c.nome.toLowerCase().includes(busca.toLowerCase())) return false;
    return true;
  });
}

/* ================================ SHELL ================================= */

async function renderClientes(container) {
  state.container = container;
  state.clientes = await MockAPI.getClientes();
  state.produtosDisponiveis = await MockAPI.getProdutos();
  state.colaboradores = (await MockAPI.getColaboradores()).filter((c) => c.status === "ativo");
  if (!container.isConnected) return;
  paint();
}

function paint() {
  const container = state.container;
  container.innerHTML = `
    <div class="view-enter">
      <div class="tarefas-toolbar">
        <div class="tarefas-toolbar-left">
          <div class="tab-row" id="view-tabs">
            <button class="tab-btn ${state.view === "grid" ? "is-active" : ""}" data-view="grid">Grade</button>
            <button class="tab-btn ${state.view === "list" ? "is-active" : ""}" data-view="list">Lista</button>
          </div>

          <label class="tarefas-search">
            ${icon("search", { size: 14 })}
            <input type="text" id="f-busca" placeholder="Buscar clientes..." value="${state.filters.busca}" />
          </label>

          <span class="filter-chip">
            <select id="f-status">
              <option value="all">Status</option>
              ${Object.entries(STATUS_CLIENTE).map(([k, v]) => `<option value="${k}" ${state.filters.status === k ? "selected" : ""}>${v.label}</option>`).join("")}
            </select>
          </span>

          <span class="filter-chip">
            <select id="f-segmento">
              <option value="all">Segmento</option>
              ${SEGMENTOS_DISPONIVEIS.map((s) => `<option value="${s}" ${state.filters.segmento === s ? "selected" : ""}>${s}</option>`).join("")}
            </select>
          </span>
        </div>

        <button class="btn btn-primary btn-sm" id="btn-new-cliente">${icon("plus", { size: 15 })} Novo cliente</button>
      </div>

      <div id="clientes-body"></div>
    </div>`;

  bindToolbar();
  renderBody();
}

function bindToolbar() {
  document.querySelectorAll("#view-tabs .tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => { state.view = btn.dataset.view; paint(); });
  });
  document.getElementById("btn-new-cliente").addEventListener("click", () => openClienteModal({ mode: "create" }));
  document.getElementById("f-busca").addEventListener("input", (e) => { state.filters.busca = e.target.value; renderBody(); });
  document.getElementById("f-status").addEventListener("change", (e) => { state.filters.status = e.target.value; renderBody(); });
  document.getElementById("f-segmento").addEventListener("change", (e) => { state.filters.segmento = e.target.value; renderBody(); });
}

function renderBody() {
  const body = document.getElementById("clientes-body");
  const filtered = getFiltered();
  body.innerHTML = filtered.length
    ? (state.view === "grid" ? gridHtml(filtered) : listHtml(filtered))
    : `<div class="empty-state"><strong>Nenhum cliente encontrado</strong><p>Ajuste os filtros ou cadastre um novo cliente.</p></div>`;
  bindCardEvents();
}

/* ================================= GRADE ================================= */

function gridHtml(list) {
  return `<div class="clientes-grid">${list.map(cardHtml).join("")}</div>`;
}

function cardHtml(c) {
  const st = STATUS_CLIENTE[c.status];
  const vinculados = (c.colaboradoresVinculados || []).map(personById).filter(Boolean);
  return `
    <div class="cliente-card" data-cliente-id="${c.id}">
      <div class="cliente-card-head">
        ${logoHtml(c, 44)}
        <span class="badge" style="background:${st.cor}22;color:${st.cor}">${st.label}</span>
      </div>
      <div>
        <div class="cliente-card-name">${c.nome}</div>
        <div class="cliente-card-segmento">${c.segmento}</div>
      </div>
      <div class="cliente-card-footer">
        <div class="cliente-card-resp avatar-stack">
          ${vinculados.length ? vinculados.slice(0, 3).map((p) => avatarHtml(p, { sizePx: 20, fontSizePx: 9, title: p.nome })).join("") : "—"}
          ${vinculados.length > 3 ? `<span class="avatar" style="width:20px;height:20px;font-size:8px;background:var(--bg-elevated);color:var(--text-tertiary)">+${vinculados.length - 3}</span>` : ""}
        </div>
        <span class="text-tertiary" style="font-size:11px">${c.contratos.length} contrato(s)</span>
      </div>
    </div>`;
}

/* ================================= LISTA ================================= */

function listHtml(list) {
  return `
    <div class="agenda-card" style="overflow-x:auto">
      <table class="clientes-table">
        <thead>
          <tr><th>Cliente</th><th>Segmento</th><th>Status</th><th>Vinculados</th><th>Contratos</th></tr>
        </thead>
        <tbody>
          ${list.map((c) => {
            const st = STATUS_CLIENTE[c.status];
            const vinculados = (c.colaboradoresVinculados || []).map(personById).filter(Boolean);
            return `
            <tr data-cliente-id="${c.id}">
              <td><div class="cliente-row-name">${logoHtml(c, 32)}${c.nome}</div></td>
              <td>${c.segmento}</td>
              <td><span class="badge" style="background:${st.cor}22;color:${st.cor}">${st.label}</span></td>
              <td>${vinculados.length ? vinculados.map((p) => p.nome.split(" ")[0]).join(", ") : "—"}</td>
              <td>${c.contratos.length}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>`;
}

function bindCardEvents() {
  document.querySelectorAll("[data-cliente-id]").forEach((el) => {
    el.addEventListener("click", () => {
      const c = state.clientes.find((x) => x.id === el.dataset.clienteId);
      if (c) openClienteModal({ mode: "edit", cliente: c });
    });
  });
}

/* ================================ MODAL =================================== */

function closeModal() {
  document.getElementById("cliente-modal-overlay")?.remove();
}

function timelineListHtml(cliente) {
  if (!cliente.timeline.length) return `<span class="text-tertiary" style="font-size:13px">Nenhum evento registrado ainda.</span>`;
  return cliente.timeline
    .map((ev) => `
      <div class="timeline-item">
        <span class="timeline-dot"></span>
        <div class="timeline-body">
          <div class="timeline-text">${ev.texto}</div>
          <div class="timeline-date">${formatDatePt(ev.data)}</div>
        </div>
      </div>`)
    .join("");
}

function arquivosListHtml(cliente) {
  if (!cliente.arquivos.length) return `<span class="text-tertiary" style="font-size:13px">Nenhum arquivo anexado ainda.</span>`;
  return cliente.arquivos.map((a) => `<div class="attachment-item"><span>${icon("briefing", { size: 13 })}</span><span>${a.nome}</span></div>`).join("");
}

function contratosListHtml(cliente) {
  if (!cliente.contratos.length) return `<span class="text-tertiary" style="font-size:13px">Nenhum contrato cadastrado ainda.</span>`;
  return cliente.contratos
    .map((ct) => `
      <div class="contrato-item">
        <div class="contrato-item-info">
          <strong>${ct.nome}</strong>
          <span>Início em ${formatDatePt(ct.inicio)} · ${STATUS_CLIENTE[ct.status]?.label ?? ct.status}</span>
        </div>
        <span class="contrato-valor">${currency(ct.valor)}/mês</span>
      </div>`)
    .join("");
}

function openClienteModal({ mode, cliente }) {
  closeModal();
  const isEdit = mode === "edit";
  const c = cliente ?? {
    id: null, nome: "", segmento: SEGMENTOS_DISPONIVEIS[0], status: "onboarding",

    telefone: "", email: "", site: "", observacoes: "",

  };

  let selectedSegmento = c.segmento;
  let selectedStatus = c.status;
  let selectedVinculados = new Set(c.colaboradoresVinculados || []);
  let selectedProdutos = new Set(c.produtosContratados || []);
  let activeTab = "geral";
  const tabs = isEdit ? ["geral", "timeline", "arquivos", "contratos", "observacoes"] : ["geral"];

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "cliente-modal-overlay";
  overlay.innerHTML = `
    <div class="modal-panel cliente-modal-panel">
      <div class="cliente-modal-head">
        <div class="cliente-logo-upload ${isEdit ? "is-editable" : ""}" id="logo-upload-trigger" title="${isEdit ? "Alterar logo" : ""}">
          ${logoHtml(c, 52)}
          ${isEdit ? `<span class="cliente-logo-upload-overlay">${icon("briefing", { size: 14 })}</span>` : ""}
        </div>
        <input type="file" id="logo-file-input" accept="image/*" style="display:none" />
        <div class="cliente-modal-head-info">
          <h3>${isEdit ? c.nome : "Novo cliente"}</h3>
          <span>${isEdit ? c.segmento : "Cadastrar novo cliente"}</span>
        </div>
        <button class="modal-close-btn" id="modal-close">${icon("chevronDown", { size: 16 })}</button>
      </div>

      ${tabs.length > 1 ? `
      <div class="cliente-tabs" id="cliente-tabs">
        ${tabs.map((tk) => `<button class="cliente-tab-btn ${tk === activeTab ? "is-active" : ""}" data-tab="${tk}">${TAB_LABELS[tk]}</button>`).join("")}
      </div>` : ""}

      <div class="cliente-tab-body" id="cliente-tab-body"></div>

      <div class="modal-footer">
        ${isEdit ? `<button class="btn btn-danger" id="f-delete" style="margin-right:auto">Excluir</button>` : ""}
        <button class="btn btn-secondary" id="f-cancel">Cancelar</button>
        <button class="btn btn-primary" id="f-save">Salvar</button>
      </div>
    </div>`;

  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.getElementById("modal-close").addEventListener("click", closeModal);

    if (activeTab !== "geral") {

const state = {
  view: "grid",
  colaboradores: [],
  filters: { papel: "all", equipe: "all", status: "all", busca: "" },
  container: null,
};

const AVATAR_PALETTE = ["#2e63a6", "#14253b", "#f6a831", "#2fd07a", "#4fb3ff", "#ff5c6a"];

function gerarSenhaAleatoria() {
  const consoantes = "bcdfghjkmnpqrstvwxyz";
  const vogais = "aeiou";
  let s = "";
  for (let i = 0; i < 4; i++) {
    s += consoantes[Math.floor(Math.random() * consoantes.length)];
    s += vogais[Math.floor(Math.random() * vogais.length)];
  }
  return s + Math.floor(10 + Math.random() * 90);
}

function colorFor(nome) {
  let hash = 0;
  for (let i = 0; i < nome.length; i++) hash = nome.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_PALETTE[Math.abs(hash) % AVATAR_PALETTE.length];
}

function initials(nome) {
  return nome.split(" ").filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
}

function formatDatePt(iso) {
  return parseIso(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
}

function getFiltered() {
  const { papel, equipe, status, busca } = state.filters;
  return state.colaboradores.filter((c) => {
    if (papel !== "all" && c.papel !== papel) return false;
    if (equipe !== "all" && !(c.equipe || []).includes(equipe)) return false;
    if (status !== "all" && c.status !== status) return false;
    if (busca && !`${c.nome} ${c.cargo}`.toLowerCase().includes(busca.toLowerCase())) return false;
    return true;
  });
}

  overlay.querySelectorAll("#f-colab-equipe .chip-option").forEach((btn) => {
    btn.addEventListener("click", () => {
      const eq = btn.dataset.equipe;
      if (selectedEquipes.has(eq)) selectedEquipes.delete(eq);
      else selectedEquipes.add(eq);
      btn.classList.toggle("is-selected");
    });
  });
  overlay.querySelectorAll("#f-papel .chip-option").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedPapel = btn.dataset.papel;

    });
  });

        if (!file) return;

        reader.onload = () => {
          openImageCropModal(reader.result, { titulo: "Ajustar foto do colaborador", textoBotao: "Salvar foto" }, async (dataUrl) => {
            try {
              await MockAPI.updateColaborador(c.id, { fotoUrl: dataUrl });

              if (Auth.getCurrentUser()?.id === c.id) Auth.patchCurrentUser({ fotoUrl: dataUrl });

              showToast(err.message || "Não foi possível salvar a foto.", "erro");

        };

      cargo: document.getElementById("f-cargo").value.trim(),
      dataAdmissao: document.getElementById("f-admissao").value || null,
      email: document.getElementById("f-email").value.trim(),

      cnpj: document.getElementById("f-cnpj").value.trim(),

      closeModal();
      renderBody();
      showToast("Colaborador atualizado.");

      errorBox.innerHTML = `${err.message}${!isEdit ? ` <a href="#" id="colab-fallback" style="color:inherit;text-decoration:underline">Prefiro convidar manualmente</a>` : ""}`;

      saveBtn.disabled = false;
      document.getElementById("colab-fallback")?.addEventListener("click", (e) => {
        e.preventDefault();
        closeModal();
        openConviteInfoModal();
      });
    }
  });
}

function mostrarSenhaCriada(nome, email, senha) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "senha-criada-overlay";
  overlay.innerHTML = `
    <div class="modal-panel">
      <div class="modal-header"><h3>Acesso criado</h3><button class="modal-close-btn" id="sc-close">${icon("chevronDown", { size: 16 })}</button></div>
      <div class="modal-body">
        <p style="font-size:var(--fs-sm);color:var(--text-secondary)">
          <strong style="color:var(--text-primary)">${nome}</strong> já pode entrar na plataforma. Copia os dados abaixo e passa pra pessoa.
        </p>
        <div class="field"><label>E-mail</label><input type="text" readonly value="${email}" /></div>
        <div class="field">
          <label>Senha</label>
          <div style="display:flex;gap:8px">
            <input type="text" id="sc-senha" readonly value="${senha}" style="flex:1;font-family:var(--font-mono)" />
            <button type="button" class="btn btn-secondary btn-sm" id="sc-copiar">Copiar</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="sc-ok">Pronto</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  document.getElementById("sc-close").addEventListener("click", close);
  document.getElementById("sc-ok").addEventListener("click", close);
  document.getElementById("sc-copiar").addEventListener("click", async () => {
    const btn = document.getElementById("sc-copiar");
    try {
      await navigator.clipboard.writeText(`E-mail: ${email}\nSenha: ${senha}`);
      btn.textContent = "Copiado!";
      setTimeout(() => { btn.textContent = "Copiar"; }, 1500);
    } catch {
      document.getElementById("sc-senha").select();
    }
  });
}

  return { renderColaboradores };
})();

/* ===== js/modules/produtos.js (escopo isolado) ===== */
const { renderProdutos } = (function () {

/* ===== js/modules/produtos.js ===== */



const state = {
  view: "grid",
  produtos: [],

};

const CATEGORIA_PALETTE = { "Assessoria": "#2e63a6", "Social Media": "#f6a831", "Tráfego Pago": "#14253b", "Outro": "#8996a8" };

function getFiltered() {
  const { categoria, status, busca } = state.filters;
  return state.produtos.filter((p) => {
    if (categoria !== "all" && p.categoria !== categoria) return false;
    if (status !== "all" && p.status !== status) return false;
    if (busca && !p.nome.toLowerCase().includes(busca.toLowerCase())) return false;
    return true;
  });
}

async function renderProdutos(container) {
  state.container = container;

  paint();
}

function paint() {
  const container = state.container;
  container.innerHTML = `
    <div class="view-enter">
      <div class="tarefas-toolbar">

            </select>

      <div id="produtos-body"></div>
    </div>`;

  bindToolbar();
  renderBody();
}

function bindToolbar() {
  document.querySelectorAll("#view-tabs .tab-btn").forEach((btn) => {

  });
  document.getElementById("btn-new-produto").addEventListener("click", () => openProdutoModal({ mode: "create" }));

}

function renderBody() {
  const body = document.getElementById("produtos-body");
  const filtered = getFiltered();
  body.innerHTML = filtered.length
    ? (state.view === "grid" ? gridHtml(filtered) : listHtml(filtered))
    : `<div class="empty-state"><strong>Nenhum produto encontrado</strong><p>Ajuste os filtros ou cadastre um novo produto.</p></div>`;

}

function cardHtml(p) {
  const cor = CATEGORIA_PALETTE[p.categoria] || "#8996a8";

function gridHtml(list) {
  return `<div class="clientes-grid">${list.map(cardHtml).join("")}</div>`;
}

function listHtml(list) {
  return `
    <div class="agenda-card" style="overflow-x:auto">

function bindRowEvents() {
