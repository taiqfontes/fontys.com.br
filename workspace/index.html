        <div class="card-header">
          <div>
            <div class="card-title">Relatório ${en.numero}</div>
            <div class="card-subtitle">${formatDatePt(en.data)}${assessorNome ? ` · Assessor: ${assessorNome}` : ""}${en.interlocutor ? ` · Interlocutor: ${en.interlocutor}` : ""}</div>
          </div>
          <div class="relatorio-card-actions">
            ${isSelf ? `<button class="quick-action-btn relatorio-action-btn" data-editar-relatorio="${en.id}" title="Editar relatório">${icon("edit", { size: 15 })}</button>` : ""}
            <button class="quick-action-btn relatorio-action-btn" data-imprimir-relatorio="${en.id}" title="Imprimir relatório">${icon("briefing", { size: 15 })}</button>
            ${isSelf ? `<button class="quick-action-btn relatorio-action-btn is-danger" data-excluir-relatorio="${en.id}" title="Excluir relatório">×</button>` : ""}
          </div>
        </div>
        ${en.assuntos?.length ? `
          <div class="relatorio-secao">
            <div class="relatorio-secao-titulo">Assuntos abordados</div>
            <table class="relatorio-mini-table">
              <thead><tr><th>#</th><th>Assunto</th></tr></thead>
              <tbody>${en.assuntos.map((a, i) => `<tr><td>${letraAlfabeto(i)}</td><td>${a}</td></tr>`).join("")}</tbody>
            </table>
          </div>` : ""}
        ${en.observacoes ? `
          <div class="relatorio-secao">
            <div class="relatorio-secao-titulo">Observações</div>
            <p class="relatorio-observacoes">${en.observacoes}</p>
          </div>` : ""}
        ${en.cronogramaMes?.some((c) => c.data) ? `
          <div class="relatorio-secao">
            <div class="relatorio-secao-titulo">Cronograma do mês</div>
            <table class="relatorio-mini-table">
              <thead><tr><th>Data</th><th>Horário</th></tr></thead>
              <tbody>${en.cronogramaMes.filter((c) => c.data).map((c) => `<tr style="${c.feito ? "text-decoration:line-through;opacity:.55" : ""}"><td>${c.feito ? "✓ " : ""}${formatDatePt(c.data)}</td><td>${c.horario || "A definir"}</td></tr>`).join("")}</tbody>
            </table>
          </div>` : ""}
        ${totalTarefas ? `
          <div class="relatorio-secao">
            <div class="relatorio-secao-titulo">Tarefas operacionais</div>
            <table class="relatorio-mini-table">
              <thead><tr><th>#</th><th>Descrição</th><th>Responsável</th><th>Entrega</th></tr></thead>
              <tbody>${en.tarefasOperacionais.map((t, i) => `<tr><td>${i + 1}</td><td>${t.descricao}</td><td>${t.tipo === "assessor" ? (resp => resp?.nome ?? "Assessor")(personById(assessorSelecionado)) : "Cliente"}</td><td>${formatDatePt(t.dataEntrega)}</td></tr>`).join("")}</tbody>
            </table>
          </div>` : ""}
      </div>`;
  }

  function letraAlfabeto(i) {
    return String.fromCharCode(97 + i); // a, b, c...
  }

  function renderRelatorioForm() {
    const formArea = document.getElementById("relatorio-form-area");
    const r = relatorioRascunho;
    formArea.innerHTML = `
      <div class="card relatorio-form-card" style="margin-bottom:16px">
        <div class="card-header"><div class="card-title">${r.id ? `Editar Relatório ${r.numero}` : "Novo relatório"}</div></div>
        <div class="field-row">
          <div class="field"><label>Data do encontro</label><input type="date" id="rf-data" value="${r.data}" /></div>
          <div class="field"><label>Interlocutor</label><input type="text" id="rf-interlocutor" placeholder="Quem participou do lado do cliente" value="${r.interlocutor}" /></div>
        </div>

        <div class="field">
          <label>Assuntos abordados</label>
          <div id="rf-assuntos">
            ${r.assuntos.map((a, i) => `
              <div class="relatorio-form-row">
                <span class="relatorio-form-letra">${letraAlfabeto(i)})</span>
                <input type="text" data-assunto-idx="${i}" value="${a}" placeholder="Assunto discutido" />
                ${r.assuntos.length > 1 ? `<button type="button" class="modal-close-btn" data-del-assunto="${i}">×</button>` : ""}
              </div>`).join("")}
          </div>
          <button class="btn btn-secondary btn-sm" id="rf-add-assunto" style="margin-top:6px">${icon("plus", { size: 12 })} Adicionar assunto</button>
        </div>

        <div class="field"><label>Observações gerais</label><textarea id="rf-observacoes" rows="3" placeholder="Resumo geral do encontro">${r.observacoes}</textarea></div>

        <div class="field">
          <label>Cronograma do mês</label>
          <div id="rf-cronograma">
            ${r.cronogramaMes.map((c, i) => `
              <div class="relatorio-form-row">
                <input type="date" data-cron-idx="${i}" data-cron-campo="data" value="${c.data}" />
                <input type="time" data-cron-idx="${i}" data-cron-campo="horario" value="${c.horario}" />
                <label style="display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;cursor:pointer">
                  <input type="checkbox" data-cron-idx="${i}" data-cron-campo="feito" ${c.feito ? "checked" : ""} /> Feito
                </label>
                ${r.cronogramaMes.length > 1 ? `<button type="button" class="modal-close-btn" data-del-cron="${i}">×</button>` : ""}
              </div>`).join("")}
          </div>
          <button class="btn btn-secondary btn-sm" id="rf-add-cron" style="margin-top:6px">${icon("plus", { size: 12 })} Adicionar data</button>
        </div>

        <div class="field">
          <label>Tarefas operacionais</label>
          <div id="rf-tarefas">
            ${r.tarefasOperacionais.map((t, i) => `
              <div class="relatorio-form-row relatorio-form-row-tarefa">
                <input type="text" data-tarefa-idx="${i}" data-tarefa-campo="descricao" value="${t.descricao}" placeholder="O que precisa ser feito" />
                <select data-tarefa-idx="${i}" data-tarefa-campo="tipo">
                  <option value="assessor" ${t.tipo === "assessor" ? "selected" : ""}>Assessor</option>
                  <option value="interlocutor" ${t.tipo === "interlocutor" ? "selected" : ""}>Cliente</option>
                </select>
                <input type="date" data-tarefa-idx="${i}" data-tarefa-campo="dataEntrega" value="${t.dataEntrega}" />
                ${r.tarefasOperacionais.length > 1 ? `<button type="button" class="modal-close-btn" data-del-tarefa="${i}">×</button>` : ""}
              </div>`).join("")}
          </div>
          <button class="btn btn-secondary btn-sm" id="rf-add-tarefa" style="margin-top:6px">${icon("plus", { size: 12 })} Adicionar tarefa</button>
          <p class="text-tertiary" style="font-size:11px;margin-top:6px">Tarefas do Assessor entram automaticamente no módulo Tarefas, dentro de um projeto "Assessoria ${plano.clienteNome}". Tarefas do Cliente ficam só registradas aqui.</p>
        </div>

        <div class="modal-footer" style="padding:16px 0 0;border-top:1px solid var(--border-subtle);margin-top:8px">
          <button class="btn btn-secondary" id="rf-cancelar">Cancelar</button>
          <button class="btn btn-primary" id="rf-salvar">${r.id ? "Salvar alterações" : "Salvar relatório"}</button>
        </div>
      </div>`;

    // captura os valores dos campos simples antes de re-renderizar (evita perder o que foi digitado)
    function capturarCamposSimples() {
      r.data = document.getElementById("rf-data").value;
      r.interlocutor = document.getElementById("rf-interlocutor").value;
      r.observacoes = document.getElementById("rf-observacoes").value;
      formArea.querySelectorAll("[data-assunto-idx]").forEach((el) => { r.assuntos[Number(el.dataset.assuntoIdx)] = el.value; });
      formArea.querySelectorAll("[data-cron-idx]").forEach((el) => {
        r.cronogramaMes[Number(el.dataset.cronIdx)][el.dataset.cronCampo] = el.type === "checkbox" ? el.checked : el.value;
      });
      formArea.querySelectorAll("[data-tarefa-idx]").forEach((el) => { r.tarefasOperacionais[Number(el.dataset.tarefaIdx)][el.dataset.tarefaCampo] = el.value; });
    }

    document.getElementById("rf-add-assunto").addEventListener("click", () => { capturarCamposSimples(); r.assuntos.push(""); renderRelatorioForm(); });
    formArea.querySelectorAll("[data-del-assunto]").forEach((btn) => {
      btn.addEventListener("click", () => { capturarCamposSimples(); r.assuntos.splice(Number(btn.dataset.delAssunto), 1); renderRelatorioForm(); });
    });
    document.getElementById("rf-add-cron").addEventListener("click", () => { capturarCamposSimples(); r.cronogramaMes.push({ data: "", horario: "", feito: false }); renderRelatorioForm(); });
    formArea.querySelectorAll("[data-del-cron]").forEach((btn) => {
      btn.addEventListener("click", () => { capturarCamposSimples(); r.cronogramaMes.splice(Number(btn.dataset.delCron), 1); renderRelatorioForm(); });
    });
    document.getElementById("rf-add-tarefa").addEventListener("click", () => { capturarCamposSimples(); r.tarefasOperacionais.push({ descricao: "", tipo: "assessor", dataEntrega: "" }); renderRelatorioForm(); });
    formArea.querySelectorAll("[data-del-tarefa]").forEach((btn) => {
      btn.addEventListener("click", () => { capturarCamposSimples(); r.tarefasOperacionais.splice(Number(btn.dataset.delTarefa), 1); renderRelatorioForm(); });
    });

    document.getElementById("rf-cancelar").addEventListener("click", () => {
      relatorioRascunho = null;
      renderOperacionalConteudo();
    });

    document.getElementById("rf-salvar").addEventListener("click", async () => {
      capturarCamposSimples();
      const assuntosLimpos = r.assuntos.map((a) => a.trim()).filter(Boolean);
      const cronogramaLimpo = r.cronogramaMes.filter((c) => c.data);
      const tarefasLimpas = r.tarefasOperacionais.filter((t) => t.descricao.trim());

      try {
        // Tarefas do tipo "assessor" entram de verdade no módulo Tarefas, num
        // projeto próprio do cliente ("Assessoria {cliente}"). Cada item guarda
        // o id da tarefa real (tarefaId) depois de sincronizado uma vez, pra
        // isso funcionar tanto na criação quanto em edições futuras do
        // relatório sem duplicar nada: se já tem tarefaId, só atualiza título/
        // prazo; se não tem, cria a tarefa agora. Tarefas "cliente" não entram
        // (são responsabilidade do cliente, não de um colaborador nosso).
        const tarefasAssessor = tarefasLimpas.filter((t) => t.tipo === "assessor");
        if (tarefasAssessor.length) {
          const projetoId = await MockAPI.ensureProjetoAssessoria(plano.clienteNome, assessorSelecionado);
          for (const t of tarefasAssessor) {
            if (t.tarefaId) {
              await MockAPI.updateTarefa(t.tarefaId, { titulo: t.descricao, prazo: t.dataEntrega || null });
            } else {
              const novaTarefa = await MockAPI.createTarefa({
                titulo: t.descricao, clienteNome: plano.clienteNome, projetoId,
                responsavelId: assessorSelecionado, prazo: t.dataEntrega || null,
                status: "todo", prioridade: "media", etiquetas: [], criadoPor: Auth.getCurrentUser()?.id,
                origemModulo: "assessoria", origemChave: plano.id,
              });
              t.tarefaId = novaTarefa.id;
            }
          }
        }

        const payload = {
          data: r.data, interlocutor: r.interlocutor.trim(), assuntos: assuntosLimpos,
          observacoes: r.observacoes.trim(), cronogramaMes: cronogramaLimpo, tarefasOperacionais: tarefasLimpas,
        };

        if (r.id) {
          await MockAPI.updateEncontro(r.id, payload);
        } else {
          await MockAPI.addEncontro(plano.id, assessorSelecionado, payload);
        }

        relatorioRascunho = null;
        renderOperacionalConteudo();
        showToast("Relatório salvo.");
      } catch (err) {
        showToast(err.message || "Não foi possível salvar o relatório.", "erro");
      }
    });
  }

  async function refreshPlanoLocal() {
    state.planos = await MockAPI.getAssessoriaPlanos();
    plano = state.planos.find((p) => p.id === plano.id);
  }

  renderActiveTab();
}

function imprimirRelatorioIndividual(plano, en, assessor) {
  const anoAtual = new Date().getFullYear();
  const dataEncontro = new Date(en.data + "T00:00:00").toLocaleDateString("pt-BR");
  const dataHoje = new Date().toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });

  const html = `

const { renderCarteira } = (function () {

/* ===== js/modules/carteira.js ===== */





const state = {
  activeTab: "atendimento",
  competencia: mesAtualIso(),
  colaboradorAlvoId: null, // null = eu mesmo
  lancamentos: [],
  colaboradores: [],
  clientes: [],
  container: null,
};

function mesAtualIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function formatCompetencia(iso) {
  const [ano, mes] = iso.split("-").map(Number);
  const nomes = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
  return `${nomes[mes - 1]} de ${ano}`;
}

function mudarCompetencia(delta) {
  let [ano, mes] = state.competencia.split("-").map(Number);
  mes += delta;
  if (mes > 12) { mes = 1; ano++; }
  if (mes < 1) { mes = 12; ano--; }
  state.competencia = `${ano}-${String(mes).padStart(2, "0")}`;
}

function currency(v) {
  return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function formatDatePt(iso) {
  if (!iso) return "—";
  return parseIso(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function horasEntre(inicio, fim) {
  if (!inicio || !fim) return 0;
  let mins = timeToMinutes(fim) - timeToMinutes(inicio);
  if (mins < 0) mins += 24 * 60; // atravessa a meia-noite
  return mins / 60;
}

function formatHoras(decimais) {
  const totalMin = Math.round(decimais * 60);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}

function colaboradorAtual() {
  const alvo = state.colaboradorAlvoId || Auth.getCurrentUser()?.id;
  return state.colaboradores.find((c) => c.id === alvo) || null;
}

function souDono() {
  return !state.colaboradorAlvoId || state.colaboradorAlvoId === Auth.getCurrentUser()?.id;

function clienteById(id) {

/* ---------------- RESUMO ---------------- */

function calcularResumo(lista) {
  const linhas = [];
  const atendimentos = lista.filter((l) => l.tipo === "atendimento");
  const grupos = new Map();
  atendimentos.forEach((l) => {
    const chave = l.categoriaServico || "Atendimento";
    grupos.set(chave, (grupos.get(chave) || 0) + l.valor);
  });
  grupos.forEach((valor, label) => linhas.push({ label, valor }));

  const totalInterno = lista.filter((l) => l.tipo === "interno").reduce((s, l) => s + l.valor, 0);
  if (totalInterno) linhas.push({ label: "Trabalho Interno", valor: totalInterno });

  const totalReembolso = lista.filter((l) => l.tipo === "reembolso").reduce((s, l) => s + l.valor, 0);
  if (totalReembolso) linhas.push({ label: "Reembolso de Despesas", valor: totalReembolso });

  const total = linhas.reduce((s, l) => s + l.valor, 0);
  return { linhas, total };
}

function resumoHtml() {
  const { linhas, total } = calcularResumo(state.lancamentos);
  if (!linhas.length) return "";
  return `
    <div class="carteira-resumo-card">
      ${linhas.map((l) => `<div class="carteira-resumo-linha"><span>${l.label}</span><span class="text-mono">${currency(l.valor)}</span></div>`).join("")}
      <div class="carteira-resumo-linha carteira-resumo-total"><span>Total do mês</span><span class="text-mono">${currency(total)}</span></div>
    </div>`;
}

      };

      const horaInicio = document.getElementById("f-hora-inicio").value;
      const horaFim = document.getElementById("f-hora-fim").value;
      const vh = Number(document.getElementById("f-vh").value) || 0;
      payload = {
        ...payload,
        descricao: document.getElementById("f-descricao").value.trim(),
        horaInicio, horaFim, vh,

      };
    } else {
      payload = {
        ...payload,
        categoriaDespesa: document.getElementById("f-categoria-despesa").value,
        descricao: document.getElementById("f-descricao").value.trim(),
        valor: Number(document.getElementById("f-valor").value) || 0,
      };
    }

    if (isEdit) await MockAPI.updateCarteiraLancamento(l.id, payload);
    else await MockAPI.createCarteiraLancamento(payload);
    await carregarLancamentos();
    closeModal();
    renderBody();
    showToast(isEdit ? "Lançamento atualizado." : "Lançamento registrado.");
  });
}

/**

 * de renderização assíncrona `(container) => Promise<void>`.
 * Novos módulos devem ser adicionados aqui conforme forem construídos.
 */

  dashboard: renderDashboard,
  agenda: renderAgenda,
  tarefas: renderTarefas,
  clientes: renderClientes,
  colaboradores: renderColaboradores,
  produtos: renderProdutos,

};

/**
 * A navegação NÃO depende de window.location.hash como fonte de verdade —
 * só usamos o hash como um espelho "best effort" pra manter a URL legível
 * e permitir voltar/avançar no navegador quando possível. Em ambientes que
 * restringem navegação (ex: iframes sandboxed de preview), o app continua
 * funcionando 100% via este estado em memória.
 */
let currentKey = "dashboard";

function readInitialKeyFromHash() {
  try {
    const hash = window.location.hash.replace(/^#\//, "");
    return hash || "dashboard";
  } catch (e) {
    return "dashboard";
  }
}

function syncHash(key) {
  try {
    window.location.hash = `#/${key}`;
  } catch (e) {
    // navegação de hash bloqueada nesse ambiente — segue só com o estado em memória
  }
}

function renderShell(activeKey) {
  const shellRoot = document.getElementById("shell-root");
  shellRoot.innerHTML = `
    <div class="app-shell" id="app-shell">
      ${renderSidebar(activeKey)}
      <div class="app-main">
        ${renderTopbar(activeKey)}
        <main class="app-content" id="app-content"></main>
      </div>
    </div>`;

  bindTopbarEvents(async () => {
    await Auth.logout();
    currentKey = "dashboard";
    syncHash("");
    render();
  });

  document.getElementById("btn-toggle-sidebar")?.addEventListener("click", () => {
    document.getElementById("app-shell").classList.toggle("is-collapsed");
  });
}

async function navigateTo(key) {
  if (!Auth.can(key)) key = "dashboard";
  currentKey = key;
  syncHash(key);
  await render();
}

async function render() {
  if (!Auth.isAuthenticated()) {
    document.getElementById("shell-root").innerHTML = "";
    document.getElementById("login-root").classList.remove("hidden");
    renderLoginScreen(async () => {
      currentKey = readInitialKeyFromHash();
      await render();
    });
    return;
  }
  document.getElementById("login-root").classList.add("hidden");

  if (!Auth.visibleModulesReady()) {
    const permissoes = await MockAPI.getEquipePermissoes();
    Auth.loadVisibleModules(permissoes);
  }

  if (!Auth.can(currentKey)) currentKey = "dashboard";

  renderShell(currentKey);
  const container = document.getElementById("app-content");
  const renderFn = MODULES[currentKey];

  if (typeof renderFn === "function") {
    await renderFn(container);
  } else {
    renderPlaceholder(container, currentKey);
  }
}

/**
 * Delegação global de clique: qualquer link interno (href="#/algo"), em
 * qualquer módulo, presente ou futuro, navega através do estado em memória
 * em vez de depender do evento "hashchange" do navegador — que não é
 * confiável dentro de iframes com sandbox restrito (ex: previews).
 */
function bindGlobalLinkDelegation() {
  document.addEventListener("click", (e) => {
    const link = e.target.closest('a[href^="#/"]');
    if (!link) return;
    e.preventDefault();
    const key = link.getAttribute("href").replace(/^#\//, "");
    navigateTo(key);
  });
}

let initialized = false;

function initRouter() {
  if (!initialized) {
    bindGlobalLinkDelegation();
    // hashchange cobre navegação via voltar/avançar do navegador quando disponível
    window.addEventListener("hashchange", () => {
      currentKey = readInitialKeyFromHash();
      render();
    });
    initialized = true;
  }
  currentKey = readInitialKeyFromHash();
  render();
}

// mantido por compatibilidade (usado internamente)
const handleRoute = render;


/* ===== js/app.js ===== */




/**
 * Bootstrap da aplicação.
 * Antes de renderizar qualquer coisa, tenta restaurar uma sessão existente
 * do Supabase Auth (usuário que já tinha logado e não deslogou). Só depois
 * disso o roteador decide entre mostrar login ou o shell autenticado.
 *
 * Caso especial: quando a pessoa clica no link de convite (ou de "esqueci
 * minha senha") vindo do e-mail, o Supabase já autentica ela e adiciona
 * "type=invite" (ou "type=recovery") na URL — nesse caso, mostramos a tela
 * de "criar senha" antes de deixar entrar no app de verdade.
 */
function vemDeLinkDeConviteOuRecuperacao() {
  const hash = window.location.hash || "";
  return hash.includes("type=invite") || hash.includes("type=recovery");
}

async function bootstrap() {
  initTheme();

  // Link público de agendamento (#/agendar/slug): não passa por login nenhum,
  // nem restaura sessão — é a única tela do sistema acessível por qualquer
  // pessoa, então intercepta antes de tudo o resto.
  const slugPublico = lerSlugAgendamentoPublico();
  if (slugPublico) {
    renderAgendamentoPublico(slugPublico);
    return;
  }

  if (vemDeLinkDeConviteOuRecuperacao()) {
    await Auth.restoreSession(); // o SDK já trocou o token da URL por uma sessão válida
    renderSetPasswordScreen(() => {
      history.replaceState(null, "", window.location.pathname + window.location.search);
      initRouter();
    });
    return;
  }

  await Auth.restoreSession();
  initRouter();
}

document.addEventListener("DOMContentLoaded", bootstrap);

})();
