.kr-checkbox:checked { background: var(--accent-primary); border-color: var(--accent-primary); }
.kr-checkbox:checked::after {
  content: ""; position: absolute; left: 5px; top: 1px;
  width: 5px; height: 10px;
  border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.kr-title { flex: 1; font-size: var(--fs-xs); }
.kr-title.is-done { text-decoration: line-through; color: var(--text-tertiary); }
.kr-progress-track {
  flex: 1; max-width: 200px; height: 8px; border-radius: var(--radius-full);
  background: var(--bg-elevated); position: relative; cursor: pointer; touch-action: none; flex-shrink: 0;
}
.kr-progress-fill { height: 100%; border-radius: var(--radius-full); background: var(--accent-gradient); pointer-events: none; }
.kr-progress-handle {
  position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%;
  background: #fff; border: 2px solid var(--accent-primary); transform: translate(-50%, -50%);
  pointer-events: none; box-shadow: var(--shadow-sm);
}
.kr-progress-pct { flex: none; width: 36px; text-align: right; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-tertiary); }
.kr-remove { flex: none; width: 20px; height: 20px; color: var(--text-tertiary); }
.kr-remove:hover { color: var(--color-danger); }

.kr-add-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
.kr-add-row input {
  font-size: var(--fs-xs);
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  color: var(--text-primary);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease-standard);
}
.kr-add-row input:focus { border-color: var(--accent-primary); }
.kr-add-row input::placeholder { color: var(--text-tertiary); }

.advisor-tabs { display: flex; gap: 8px; margin-bottom: var(--space-4); flex-wrap: wrap; }

.encontro-item {
  background: var(--bg-elevated);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  margin-bottom: var(--space-2);
}
.encontro-item-date { font-size: 10.5px; color: var(--text-tertiary); font-family: var(--font-mono); margin-bottom: 4px; }
.encontro-item-resumo { font-size: var(--fs-sm); margin-bottom: 4px; }
.encontro-item-proximos { font-size: var(--fs-xs); color: var(--text-secondary); }
.encontro-item-proximos strong { color: var(--text-tertiary); font-weight: 600; }

.cronograma-item { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border-subtle); }
.cronograma-item:first-of-type { border-top: none; }
.cronograma-date {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--accent-primary);
  background: var(--accent-primary-soft); border-radius: var(--radius-sm); padding: 4px 8px; flex: none; height: fit-content;

/* ===== js/core/dateUtils.js ===== */
/**
 * FONTYS WORKSPACE — UTILITÁRIOS DE DATA
 * Funções puras de manipulação de datas, em pt-BR.
 */

const WEEKDAYS_SHORT = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const MONTHS_LONG = [
  "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
  "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro",
];

const pad = (n) => String(n).padStart(2, "0");

function isoDate(date) {
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

function parseIso(str) {
  const [y, m, d] = str.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

function addMonths(date, n) {
  const d = new Date(date);
  d.setMonth(d.getMonth() + n);
  return d;
}

function startOfWeek(date) {
  const d = new Date(date);
  d.setDate(d.getDate() - d.getDay());
  d.setHours(0, 0, 0, 0);
  return d;
}

function startOfMonth(date) {
  return new Date(date.getFullYear(), date.getMonth(), 1);
}

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function isSameMonth(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
}

function formatMonthYear(date) {
  return `${MONTHS_LONG[date.getMonth()]} de ${date.getFullYear()}`;
}

function formatWeekdayShort(date) {
  return WEEKDAYS_SHORT[date.getDay()];
}

function formatDayLong(date) {
  return date.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
}

function formatWeekRange(startDate) {
  const end = addDays(startDate, 6);
  const sameMonth = startDate.getMonth() === end.getMonth();
  const startStr = `${startDate.getDate()}`;
  const endStr = sameMonth
    ? `${end.getDate()} de ${MONTHS_LONG[end.getMonth()]}`
    : `${end.getDate()} de ${MONTHS_LONG[end.getMonth()]}`;
  return sameMonth
    ? `${startStr} – ${endStr} de ${end.getFullYear()}`
    : `${startStr} de ${MONTHS_LONG[startDate.getMonth()]} – ${endStr}`;
}

function timeToMinutes(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

function minutesToTime(mins) {
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${pad(h)}:${pad(m)}`;
}

    localStorage.setItem(THEME_KEY, theme);
  } catch (e) {
    // localStorage indisponível — segue só com a memória
  }
}

function getTheme() {
  // Dark é sempre o padrão; claro só entra se o usuário escolher explicitamente.
  return readStoredTheme() || "dark";
}

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  writeStoredTheme(theme);
  window.dispatchEvent(new CustomEvent("d2n:theme-changed", { detail: { theme } }));
}

function toggleTheme() {
  const next = getTheme() === "dark" ? "light" : "dark";
  applyTheme(next);
  return next;
}

/**
 * FONTYS WORKSPACE — AUTH
 * ---------------------------------------------------------------------------
 * Autenticação real via Supabase Auth. Mantém a mesma interface pública de
 * antes (Auth.login, Auth.logout, Auth.getCurrentUser, Auth.can, etc.) — o
 * resto do app (router, sidebar, topbar) não precisa saber que a troca
 * aconteceu.
 *
 * `getCurrentUser()` continua síncrono (lê de um cache em memória) porque
 * várias partes da UI chamam ele sem await. Por isso o app faz
 * `await Auth.restoreSession()` uma vez, no bootstrap, antes de renderizar
 * qualquer coisa — ver js/app.js.
 */


/** Perfis disponíveis no sistema */
const ROLES = {
  ADMIN: "admin",
  GESTOR: "gestor",
  COLABORADOR: "colaborador",
};

/**
 * Matriz de permissões por módulo.
 * "full"    -> acesso total (ver, criar, editar, excluir, ver de todos)
 * "team"    -> gerencia dados da própria equipe / cria e edita
 * "own"     -> vê e edita apenas o que está atribuído a si
 * "none"    -> sem acesso, item não aparece na sidebar
 */
const PERMISSION_MATRIX = {
  dashboard:   { admin: "full", gestor: "team", colaborador: "own" },
  agenda:      { admin: "full", gestor: "team", colaborador: "own" },
  tarefas:     { admin: "full", gestor: "team", colaborador: "own" },
  clientes:    { admin: "full", gestor: "team", colaborador: "own" },
  colaboradores:{ admin: "full", gestor: "none", colaborador: "none" },
  produtos:    { admin: "full", gestor: "team", colaborador: "own" },
  pipeline:    { admin: "full", gestor: "team", colaborador: "own" },
  briefing:    { admin: "full", gestor: "team", colaborador: "own" },
  assessoria:  { admin: "full", gestor: "team", colaborador: "own" },
  social:      { admin: "full", gestor: "team", colaborador: "own" },
  carteira:    { admin: "full", gestor: "team", colaborador: "own" },
  conhecimento:{ admin: "full", gestor: "team", colaborador: "own" },
  configuracoes:{ admin: "full", gestor: "none", colaborador: "none" },
};

// Cache síncrono do usuário logado (perfil da tabela `colaboradores`,
// já mesclado com os dados da sessão do Supabase Auth).
let currentUser = null;

// Módulos visíveis por equipe/departamento — carregado uma vez após o login
// (ver Auth.loadVisibleModules). Mantido aqui (não em mock.js) de propósito:
// mock.js já importa este arquivo, então importar MockAPI aqui criaria uma
// dependência circular. Quem busca os dados e entrega pra cá é o router.js.
const AUTH_MODULOS_BASE = ["dashboard", "agenda", "tarefas"];
let visibleModules = null; // Set<string> | null
let visibleModulesLoaded = false;

function traduzErroLogin(error) {
  const msg = error?.message || "";
  if (msg.includes("Invalid login credentials")) return "E-mail ou senha inválidos.";
  if (msg.includes("Email not confirmed")) return "E-mail ainda não confirmado. Verifique sua caixa de entrada.";
  if (msg.includes("Failed to fetch") || msg.includes("NetworkError")) return "Não foi possível conectar ao servidor. Verifique sua conexão.";
  return "Não foi possível entrar. Tente novamente em instantes.";
}

async function carregarPerfil(userId, fallbackEmail) {
  const supabase = getSupabaseClient();
  if (!supabase) return null;
  const { data, error } = await supabase
    .from("colaboradores")
    .select("*")
    .eq("id", userId)
    .single();

  if (error || !data) {
    // Sessão válida no Auth mas sem linha em `colaboradores` ainda
    // (não deveria acontecer — o trigger handle_new_user() cria automaticamente
    // — mas cobrimos o caso pra não travar a tela em branco).
    currentUser = {
      id: userId, name: fallbackEmail || "Usuário", email: fallbackEmail || "",
      role: "colaborador", title: "", avatarColor: "#2e63a6", team: "", fotoUrl: null,
    };
    return currentUser;
  }

  currentUser = {
    id: data.id,
    name: data.nome,
    email: data.email,
    role: data.papel,
    title: data.cargo || "",
    avatarColor: data.avatar_color || "#2e63a6",
    fotoUrl: data.foto_url || null,
    team: data.equipe || [],
    status: data.status,
  };
  return currentUser;
}

const Auth = {
  /** Autentica via Supabase Auth. Lança erro (com mensagem em pt-BR) se falhar. */
  async login(email, password) {
    const supabase = getSupabaseClient();
    if (!supabase) throw new Error("Conexão com o servidor não configurada.");

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) throw new Error(traduzErroLogin(error));

    await carregarPerfil(data.user.id, data.user.email);
    return currentUser;
  },

  async logout() {
    const supabase = getSupabaseClient();
    if (supabase) {
      try { await supabase.auth.signOut(); } catch (e) { /* segue mesmo se falhar */ }
    }
    currentUser = null;
    visibleModules = null;
    visibleModulesLoaded = false;
  },

  /**
   * Chamado uma vez no bootstrap do app: verifica se já existe uma sessão
   * válida (usuário que não deslogou da última vez) e recarrega o perfil.
   */
  async restoreSession() {
    const supabase = getSupabaseClient();
    if (!supabase) return null;
    try {
      const { data } = await supabase.auth.getSession();
      if (data?.session?.user) {
        await carregarPerfil(data.session.user.id, data.session.user.email);
      }
    } catch (e) {
      console.error("Falha ao restaurar sessão:", e);
    }
    return currentUser;
  },

  getCurrentUser() {
    return currentUser;
  },

  /**
   * Atualiza campos do usuário logado no cache local (ex: depois que a
   * própria pessoa troca a foto de perfil), sem precisar buscar tudo no banco
   * de novo. Quem chama já salvou a mudança no banco antes.
   */
  patchCurrentUser(patch) {
    if (!currentUser) return;
    currentUser = { ...currentUser, ...patch };
  },

  isAuthenticated() {
    return !!currentUser;
  },

  /** Retorna o nível de acesso ("full" | "team" | "own" | "none") de um módulo */
  permissionFor(moduleKey) {
    if (!currentUser) return "none";
    return PERMISSION_MATRIX[moduleKey]?.[currentUser.role] ?? "none";
  },

  /**
   * Recebe as linhas da tabela equipe_permissoes (já buscadas por quem chamou,
   * pra evitar importar MockAPI aqui) e calcula quais módulos "de negócio"
   * (fora os universais) a pessoa enxerga, somando as equipes dela.
   * Admin sempre enxerga tudo, então nem precisa calcular.
   */
  loadVisibleModules(equipePermissoesRows) {
    if (currentUser?.role === "admin") {
      visibleModules = null; // null = sem restrição (tratado no can())
      visibleModulesLoaded = true;
      return;
    }
    const minhasEquipes = currentUser?.team || [];
    const set = new Set();
    (equipePermissoesRows || [])
      .filter((r) => minhasEquipes.includes(r.equipe))
      .forEach((r) => (r.modulos || []).forEach((m) => set.add(m)));
    visibleModules = set;
    visibleModulesLoaded = true;
  },

  visibleModulesReady() {
    return visibleModulesLoaded;
  },

  /** Atalho booleano: usuário pode acessar o módulo? */
  can(moduleKey) {
    if (this.permissionFor(moduleKey) === "none") return false;
    if (AUTH_MODULOS_BASE.includes(moduleKey)) return true;
    if (!currentUser || currentUser.role === "admin") return true;
    if (visibleModules === null) return true; // ainda não carregou — não esconde de cara
    return visibleModules.has(moduleKey);
  },

  roleLabel(role) {
    return { admin: "Administrador", gestor: "Gestor", colaborador: "Colaborador" }[role] ?? role;
  },
};

/**
 * Sistema de notificação do app — dois utilitários:
 *  - showToast(mensagem, tipo): avisa que algo foi feito (salvo, excluído...)
 *  - confirmDialog(mensagem, opções): substitui o confirm() nativo do
 *    navegador por um modal que segue o tema (claro/escuro) do site.
 * Os dois usam as mesmas variáveis de CSS do resto do app, então já
 * respeitam o tema automaticamente, sem trabalho extra.
 */

const TOAST_ICONS = {
  success: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  error: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
  info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
};

let toastContainer = null;
function ensureToastContainer() {
  if (!toastContainer || !document.body.contains(toastContainer)) {
    toastContainer = document.createElement("div");
    toastContainer.className = "toast-container";
    toastContainer.id = "toast-container";
    document.body.appendChild(toastContainer);
  }
  return toastContainer;
}

/** Mostra um aviso rápido no canto da tela. tipo: "success" | "error" | "info" */
function showToast(mensagem, tipo = "success") {
  const container = ensureToastContainer();
  const toast = document.createElement("div");
  toast.className = `toast toast-${tipo}`;
  toast.innerHTML = `<span class="toast-icon">${TOAST_ICONS[tipo] || TOAST_ICONS.info}</span><span>${mensagem}</span>`;
  container.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add("is-visible"));
  setTimeout(() => {
    toast.classList.remove("is-visible");
    setTimeout(() => toast.remove(), 250);
  }, 2800);
}

/**
 * Substitui o confirm() nativo. Retorna uma Promise<boolean> — sempre usar
 * com await. Ex: if (!(await confirmDialog("Excluir isto?"))) return;
 */
function confirmDialog(mensagem, { textoConfirmar = "Confirmar", textoCancelar = "Cancelar", perigo = true } = {}) {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay confirm-dialog-overlay";
    overlay.innerHTML = `
      <div class="modal-panel confirm-dialog-panel">
        <div class="modal-body confirm-dialog-body">
          <p class="confirm-dialog-message">${mensagem}</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="confirm-dialog-cancelar">${textoCancelar}</button>
          <button class="btn ${perigo ? "btn-danger" : "btn-primary"}" id="confirm-dialog-ok">${textoConfirmar}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const finalizar = (valor) => { overlay.remove(); resolve(valor); };
    overlay.addEventListener("click", (e) => { if (e.target === overlay) finalizar(false); });
    document.getElementById("confirm-dialog-cancelar").addEventListener("click", () => finalizar(false));
    document.getElementById("confirm-dialog-ok").addEventListener("click", () => finalizar(true));
    document.getElementById("confirm-dialog-ok").focus();
  });
}

/* ==========================================================================
   ASSESSORIA
   Estratégico e Tático são únicos por cliente (compartilhados entre todos os
   assessores). Operacional é um por assessor vinculado ao cliente — todos
   veem o operacional uns dos outros, mas cada um edita só o seu.
   Progresso do estratégico é calculado a partir do tático (resultados-chave).
   ========================================================================== */

function clampPct(v) { return Math.max(0, Math.min(100, Math.round(v))); }

function progressoResultado(kr) {
  return clampPct(kr.progresso || 0);
}

function progressoArea(area) {
  if (!area.resultadosChave.length) return 0;
  const soma = area.resultadosChave.reduce((s, kr) => s + progressoResultado(kr), 0);
  return clampPct(soma / area.resultadosChave.length);
}

/* ---- Funções de pontuação do diagnóstico (mesma lógica do modelo original) ---- */
function diagnosticoStatusFor(score) {
  if (score < 40) return { label: "Crítico", cor: "#e53e3e" };
  if (score < 60) return { label: "Atenção", cor: "#d97706" };
  if (score < 80) return { label: "Bom", cor: "#0f6e56" };
  return { label: "Excelente", cor: "#2e63a6" };
}
function diagnosticoAreaScore(respostas, areaId) {
  const area = DIAGNOSTICO_AREAS.find((a) => a.id === areaId);
  const vals = area.questions.map((_, i) => { const v = respostas[areaId]?.[i]; return v >= 0 ? v + 1 : 1; });
  return Math.round((vals.reduce((s, v) => s + v, 0) / (area.questions.length * 5)) * 100);
}
function diagnosticoOverallScore(respostas) {
  return Math.round(DIAGNOSTICO_AREAS.reduce((s, a) => s + diagnosticoAreaScore(respostas, a.id), 0) / DIAGNOSTICO_AREAS.length);
}
function diagnosticoAreaLevel(score) {
  if (score < 25) return 1; if (score < 45) return 2; if (score < 65) return 3; if (score < 85) return 4; return 5;
}
function diagnosticoAreaCompleta(respostas, areaId) {
  return DIAGNOSTICO_AREAS.find((a) => a.id === areaId).questions.every((_, i) => respostas[areaId]?.[i] >= 0);
}
function diagnosticoCompleto(respostas) {
  return DIAGNOSTICO_AREAS.every((a) => diagnosticoAreaCompleta(respostas, a.id));
}
function diagnosticoRespondidas(respostas) {
  return DIAGNOSTICO_AREAS.reduce((s, a) => s + a.questions.filter((_, i) => respostas[a.id]?.[i] >= 0).length, 0);
}

/**
 * Converte um erro do Supabase numa mensagem que faz sentido pra pessoa ler.
 * Erro de RLS (código 42501 do Postgres, "insufficient_privilege") quase
 * sempre significa "essa ação é restrita ao seu papel" — muito mais claro
 * do que a mensagem genérica de "não foi possível salvar".
 */
function mensagemDeErroSupabase(error, mensagemPadrao) {
  if (error?.code === "42501") return "Você não tem permissão para fazer essa ação.";
  return mensagemPadrao;
}

/**
 * disponibilidade_regra, disponibilidade_excecao e agendamento_publico não
 * guardam colaborador_id — elas apontam pra agenda_publica_config (config_id),
 * que por sua vez pertence a um colaborador. Esse helper resolve esse id
 * intermediário antes de ler/gravar nessas tabelas.
 */
async function resolverAgendaPublicaConfigId(supabase, colaboradorId, { somenteAtiva = false } = {}) {
  let query = supabase.from("agenda_publica_config").select("id").eq("colaborador_id", colaboradorId);
  if (somenteAtiva) query = query.eq("ativo", true);
  const { data, error } = await query.maybeSingle();
  if (error) { console.error("resolverAgendaPublicaConfigId:", error); return null; }
  return data?.id || null;
}

  async criarAgendamentoPublico({ colaboradorId, titulo, data, horaInicio, horaFim, recorrente, nomeCliente, telefoneCliente, emailCliente }) {
    const recorrencia = recorrente ? "weekly" : "none";
    const supabase = getSupabaseClient();
    if (!supabase) {
      await delay(150);
      const evento = {
        id: `ev-${eventoSeq++}`, titulo, data, horaInicio, horaFim, cor: "#2e63a6", local: "A combinar",
        participantes: [colaboradorId], recorrencia, diaInteiro: false, criadoPor: null,
      };
      eventosAgenda = [...eventosAgenda, evento];
      const agendamento = { id: `ap-${agendamentosPublicos.length + 1}`, colaboradorId, eventoId: evento.id, nomeCliente, telefoneCliente, emailCliente, criadoEm: new Date().toISOString() };
      agendamentosPublicos = [...agendamentosPublicos, agendamento];
      notificacoes = [...notificacoes, {
        id: `not-${notificacaoSeq++}`, destinatarioId: colaboradorId, remetenteId: null,
        tipo: "agendamento_publico", titulo: "Novo agendamento pelo seu link",
        corpo: `${nomeCliente} marcou "${titulo}" em ${new Date(`${data}T00:00:00`).toLocaleDateString("pt-BR")} às ${horaInicio}${recorrente ? " (recorrente, toda semana)" : ""}.`,
        eventoConvidadoId: null, lida: false, criadoEm: new Date().toISOString(),
      }];
      return evento;
    }
    // Gera o id no navegador e não pede a linha de volta (sem .select()):
    // o visitante anônimo não tem — e não deveria ter — permissão de LEITURA
    // em eventos_agenda (só de criação). Pedir a linha de volta (RETURNING)
    // faria o Postgres checar a política de SELECT também, e como o anônimo
    // não passa nela, o INSERT inteiro seria rejeitado mesmo estando correto.
    const eventoId = crypto.randomUUID();
    const { error: errEvento } = await supabase.from("eventos_agenda").insert({
      id: eventoId,
      titulo, data, hora_inicio: horaInicio, hora_fim: horaFim, local: "A combinar",
      participantes: [colaboradorId], recorrencia, dia_inteiro: false, criado_por: null,
    });
    if (errEvento) { console.error("criarAgendamentoPublico:", errEvento); throw new Error("Não foi possível confirmar o agendamento — talvez esse horário tenha acabado de ser preenchido. Atualize a página e tente outro."); }

    const configId = await resolverAgendaPublicaConfigId(supabase, colaboradorId, { somenteAtiva: true });
    const { error: errAgendamento } = await supabase.from("agendamento_publico").insert({
      config_id: configId, evento_id: eventoId, nome_solicitante: nomeCliente, telefone_cliente: telefoneCliente || null, email_solicitante: emailCliente || null,
    });
    if (errAgendamento) console.error("criarAgendamentoPublico (registro do cliente):", errAgendamento);

    return { id: eventoId, titulo, data, horaInicio, horaFim, colaboradorId };
  },

  async createColaborador(payload) {
    const supabase = getSupabaseClient();
    if (!supabase) {
      await delay(150);
      const novo = { id: `u-${String(colaboradorSeq++).padStart(3, "0")}`, status: "ativo", ...payload };
      colaboradores = [novo, ...colaboradores];
      return novo;
    }
    // Chama a Edge Function (roda no servidor do Supabase) que cria o acesso
    // e já completa o perfil dela — publicada no Supabase como "clever-worker"
    // (nome que o painel sugeriu ao criar; o código é o mesmo de supabase/functions/invite-colaborador).
    const { data, error } = await supabase.functions.invoke("clever-worker", { body: payload });
    if (error) {
      console.error("createColaborador:", error);
      let msg = "Não foi possível criar o acesso. Verifique se a Edge Function 'clever-worker' está publicada no seu projeto Supabase.";
      try {
        if (error.context && typeof error.context.json === "function") {
          const body = await error.context.json();
          if (body?.error) msg = body.error; // motivo real devolvido pela função (ex: "Já existe uma conta com esse e-mail.")
        }
      } catch (_) { /* mantém a mensagem genérica se não der pra ler o corpo do erro */ }
      throw new Error(msg);
    }
    if (data?.error) { throw new Error(data.error); }
    const todos = await this.getColaboradores();
    return todos.find((c) => c.id === data.id);
  },

  async getOrCreateOperacional(planoId, assessorId) {
    const supabase = getSupabaseClient();
    if (!supabase) {
      await delay(80);
      const plano = assessoriaPlanos.find((p) => p.id === planoId);
      let op = plano.operacionais.find((o) => o.assessorId === assessorId);
      if (!op) {
        op = { id: `op-${planoId}-${assessorId}`, assessorId, encontros: [], cronograma: [] };
        assessoriaPlanos = assessoriaPlanos.map((p) =>
          p.id === planoId ? { ...p, operacionais: [...p.operacionais, op] } : p
        );
      }
      return op;
    }
    const { data: existente, error: selError } = await supabase
      .from("assessoria_operacionais")
      .select("*, assessoria_encontros(*), assessoria_cronograma(*)")
      .eq("plano_id", planoId)
      .eq("assessor_id", assessorId)
      .maybeSingle();
    if (selError) { console.error("getOrCreateOperacional (select):", selError); throw new Error("Não foi possível carregar o operacional."); }
    if (existente) return mapOperacional(existente);

    const { data: criado, error: insError } = await supabase
      .from("assessoria_operacionais")
      .insert({ plano_id: planoId, assessor_id: assessorId })
      .select()
      .single();
    if (insError) { console.error("getOrCreateOperacional (insert):", insError); throw new Error("Não foi possível criar o operacional."); }
    return { id: criado.id, assessorId: criado.assessor_id, encontros: [], cronograma: [] };
  },

  async addEncontro(planoId, assessorId, encontro) {
    const supabase = getSupabaseClient();
    if (!supabase) {
      await delay(100);
      let novo;
      assessoriaPlanos = assessoriaPlanos.map((p) => {
        if (p.id !== planoId) return p;
        return {
          ...p,
          operacionais: p.operacionais.map((o) => {
            if (o.assessorId !== assessorId) return o;
            const proximoNumero = (o.encontros[0]?.numero || 0) + 1;
            novo = { id: `en${assessoriaSeq.encontro++}`, numero: proximoNumero, ...encontro };
            return { ...o, encontros: [novo, ...o.encontros] };
          }),
        };
      });
      return novo;
    }
    const op = await this.getOrCreateOperacional(planoId, assessorId);
    const atual = (op.encontros || []);
    const proximoNumero = (atual[0]?.numero || 0) + 1;
    const { data, error } = await supabase.from("assessoria_encontros").insert({
      operacional_id: op.id, data: encontro.data, numero: proximoNumero,
      interlocutor: encontro.interlocutor || "", assuntos: encontro.assuntos || [],
      observacoes: encontro.observacoes || "", cronograma_mes: encontro.cronogramaMes || [],
      tarefas_operacionais: encontro.tarefasOperacionais || [],
    }).select().single();
    if (error) { console.error("addEncontro:", error); throw new Error("Não foi possível registrar o relatório."); }
    return mapEncontro(data);
  },

  /**
   * Garante que existe um projeto de tarefas "Assessoria {cliente}" PRÓPRIO
   * de quem está chamando e devolve o id dele. Importante: o projeto é
   * pessoal — se dois assessores diferentes atendem o mesmo cliente, cada
   * um tem o seu próprio projeto "Assessoria {cliente}" (mesmo nome, donos
   * diferentes). Casar só pelo nome faria as tarefas de um assessor
   * caírem no projeto do outro.
   */
  async ensureProjetoAssessoria(clienteNome, criadoPor) {
    const nomeProjeto = `Assessoria ${clienteNome}`;
    const projetos = await this.getProjetosTarefa();
    const existente = projetos.find((p) => p.nome === nomeProjeto && p.criadoPor === criadoPor);
    if (existente) return existente.id;
    const novo = await this.createProjetoTarefa({ nome: nomeProjeto, cor: "#2e63a6", criadoPor });
    return novo.id;
  },

    if (!supabase) {

      const novo = { id: `cr${assessoriaSeq.cronograma++}`, ...item };
      assessoriaPlanos = assessoriaPlanos.map((p) =>
        p.id === planoId
          ? { ...p, operacionais: p.operacionais.map((o) => (o.assessorId === assessorId ? { ...o, cronograma: [...o.cronograma, novo] } : o)) }
          : p
      );
      return novo;
    }
    const op = await this.getOrCreateOperacional(planoId, assessorId);
    const { error } = await supabase.from("assessoria_cronograma").insert({
      operacional_id: op.id, data: item.data, titulo: item.titulo, descricao: item.descricao,
    });
    if (error) { console.error("addCronogramaItem:", error); throw new Error("Não foi possível adicionar ao cronograma."); }
  },

  async getCarteiraLancamentos(colaboradorId) {
    const supabase = getSupabaseClient();
    if (!supabase) {
      await delay(120);
      return colaboradorId ? carteiraLancamentos.filter((l) => l.colaboradorId === colaboradorId) : carteiraLancamentos;
    }
    let query = supabase.from("carteira_lancamentos").select("*").order("data", { ascending: false });
    if (colaboradorId) query = query.eq("colaborador_id", colaboradorId);
    const { data, error } = await query;
    if (error) { console.error("getCarteiraLancamentos:", error); return []; }
    return data.map(mapCarteiraLancamento);
  },

  async createCarteiraLancamento(payload) {
    const supabase = getSupabaseClient();
    if (!supabase) {
      await delay(120);
      const novo = { id: `cl${carteiraSeq++}`, ...payload };
      carteiraLancamentos = [novo, ...carteiraLancamentos];
      return novo;
    }
    const { data, error } = await supabase.from("carteira_lancamentos").insert(toCarteiraLancamentoRow(payload)).select().single();
    if (error) { console.error("createCarteiraLancamento:", error); throw new Error("Não foi possível salvar o lançamento."); }
    return mapCarteiraLancamento(data);
  },

  async updateCarteiraLancamento(id, patch) {
    const supabase = getSupabaseClient();
    if (!supabase) {
      await delay(100);
      carteiraLancamentos = carteiraLancamentos.map((l) => (l.id === id ? { ...l, ...patch } : l));
      return carteiraLancamentos.find((l) => l.id === id);
    }
    const { data, error } = await supabase.from("carteira_lancamentos").update(toCarteiraLancamentoRow(patch)).eq("id", id).select().single();
    if (error) { console.error("updateCarteiraLancamento:", error); throw new Error("Não foi possível salvar as alterações."); }
    return mapCarteiraLancamento(data);
  },

  async deleteCarteiraLancamento(id) {
    const supabase = getSupabaseClient();
    if (!supabase) {
      await delay(100);
      carteiraLancamentos = carteiraLancamentos.filter((l) => l.id !== id);
      return;
    }
    const { error } = await supabase.from("carteira_lancamentos").delete().eq("id", id);
    if (error) { console.error("deleteCarteiraLancamento:", error); throw new Error("Não foi possível excluir o lançamento."); }
  },

  async getEquipePermissoes() {
    const supabase = getSupabaseClient();
    if (!supabase) { await delay(100); return equipePermissoes; }
    const { data, error } = await supabase.from("equipe_permissoes").select("*");
    if (error) { console.error("getEquipePermissoes:", error); return []; }
    return data.map((row) => ({ equipe: row.equipe, modulos: row.modulos || [] }));
  },

  async updateEquipePermissoes(equipe, modulos) {
    const supabase = getSupabaseClient();
    if (!supabase) {
      await delay(100);
      const existe = equipePermissoes.some((e) => e.equipe === equipe);
      equipePermissoes = existe
        ? equipePermissoes.map((e) => (e.equipe === equipe ? { ...e, modulos } : e))
        : [...equipePermissoes, { equipe, modulos }];
      return;
    }
    const { error } = await supabase.from("equipe_permissoes").upsert({ equipe, modulos });
    if (error) { console.error("updateEquipePermissoes:", error); throw new Error("Não foi possível salvar as permissões."); }
  },
};

function initials(name) {
  return name.split(" ").filter(Boolean).slice(0, 2).map((n) => n[0]).join("").toUpperCase();
}

/**
 * Avatar de uma pessoa (colaborador): foto real se ela já subiu uma
 * (pessoa.fotoUrl), senão cai pras iniciais coloridas de sempre.
 * Compartilhado entre todos os módulos — por isso vive em core, não dentro
 * de um módulo isolado, e reproduz exatamente o tamanho/fonte que cada
 * lugar já usava antes (pra não mudar o visual de ninguém).
 */
function avatarHtml(pessoa, { sizePx, fontSizePx, twoLetters = false, title, fallbackColor = "#8996a8" } = {}) {
  const nome = pessoa?.nome || pessoa?.name || "";
  const label = nome ? (twoLetters ? initials(nome) : nome[0].toUpperCase()) : "?";
  const sizeStyle = sizePx ? `width:${sizePx}px;height:${sizePx}px;` : "";
  const titleAttr = title ? ` title="${title}"` : "";
  if (pessoa?.fotoUrl) {
    return `<span class="avatar" style="${sizeStyle}padding:0;overflow:hidden"${titleAttr}><img src="${pessoa.fotoUrl}" style="width:100%;height:100%;object-fit:cover" /></span>`;
  }
  const fontStyle = fontSizePx ? `font-size:${fontSizePx}px;` : "";
  const cor = pessoa?.avatarColor || fallbackColor;
  return `<span class="avatar" style="${sizeStyle}${fontStyle}background:${cor}"${titleAttr}>${label}</span>`;
}

let topbarDocClickBound = false;

function bindTopbarEvents(onLogout) {
  // Helper genérico: liga um trigger a um menu dropdown (abre/fecha ao clicar
  // nele, fecha ao clicar fora). Usado pelos 3 dropdowns do topbar.
  function bindDropdown(triggerId, menuId) {
    const trigger = document.getElementById(triggerId);
    const menu = document.getElementById(menuId);
    if (!trigger || !menu) return null;
    trigger.addEventListener("click", (e) => {
      e.stopPropagation();
      const abrindo = menu.classList.contains("hidden");
      document.querySelectorAll(".user-dropdown-menu").forEach((m) => m.classList.add("hidden"));
      if (abrindo) menu.classList.remove("hidden");
    });
    return menu;
  }
  // O topbar inteiro é redesenhado a cada navegação (renderShell troca o
  // innerHTML), então os listeners presos aos elementos antigos somem
  // sozinhos. Mas um listener no `document` não é preso a nenhum desses
  // elementos e sobreviveria pra sempre — por isso só registra uma vez.
  if (!topbarDocClickBound) {
    document.addEventListener("click", () => {
      document.querySelectorAll(".user-dropdown-menu").forEach((m) => m.classList.add("hidden"));
    });
    topbarDocClickBound = true;
  }

  const userMenu = bindDropdown("user-menu-trigger", "user-dropdown-menu");
  const btnPerfil = document.getElementById("btn-meu-perfil");
  if (btnPerfil) {
    btnPerfil.addEventListener("click", (e) => {
      e.stopPropagation();
      userMenu?.classList.add("hidden");
      openMeuPerfilModal();
    });
  }
  const btnSair = document.getElementById("btn-sair");
  if (btnSair) {
    btnSair.addEventListener("click", async (e) => {
      e.stopPropagation();
      userMenu?.classList.add("hidden");
      const confirmed = await confirmDialog("Deseja sair do Fontys Workspace?", { textoConfirmar: "Sair", perigo: false });
      if (confirmed) onLogout();
    });
  }

  const novoItemMenu = bindDropdown("btn-novo-item", "novo-item-menu");
  document.getElementById("btn-novo-tarefa")?.addEventListener("click", async (e) => {
    e.stopPropagation();
    novoItemMenu?.classList.add("hidden");
    await navigateTo("tarefas");
    document.getElementById("btn-new-tarefa")?.click();
  });
  document.getElementById("btn-novo-compromisso")?.addEventListener("click", async (e) => {
    e.stopPropagation();
    novoItemMenu?.classList.add("hidden");
    await navigateTo("agenda");
    document.getElementById("btn-new-event")?.click();
  });

  bindDropdown("btn-notificacoes", "notificacoes-menu");
  carregarNotificacoesTopbar();

  const themeBtn = document.getElementById("btn-theme-toggle");
  if (themeBtn) {
    themeBtn.addEventListener("click", () => {
      const next = toggleTheme();
      themeBtn.innerHTML = icon(next === "dark" ? "sun" : "moon", { size: 17 });
    });
  }
}

/**
 * Busca as notificações pendentes do usuário logado e preenche o dropdown
 * do sino no topbar (bolinha vermelha se tiver alguma, lista com
 * Aceitar/Recusar pra convites de evento). Chamado toda vez que o topbar é
 * desenhado de novo (troca de módulo) — como o dropdown começa fechado,
 * isso não incomoda ninguém, só mantém o contador atualizado.
 */
async function carregarNotificacoesTopbar() {
  const user = Auth.getCurrentUser();
  const lista = document.getElementById("notificacoes-lista");
  const dot = document.getElementById("notificacoes-dot");
  if (!user || !lista) return;

  const notifs = await MockAPI.getNotificacoesPendentes(user.id);

  // Se a pessoa já navegou pra outro lugar (topbar foi redesenhado de novo)
  // enquanto isso carregava, esses elementos já não existem mais — aborta.
  if (!document.getElementById("notificacoes-lista")) return;

  dot?.classList.toggle("hidden", notifs.length === 0);

  if (!notifs.length) {
    lista.innerHTML = `<p class="text-tertiary" style="font-size:12px;padding:var(--space-3)">Nenhuma notificação por aqui.</p>`;
    return;
  }

  lista.innerHTML = notifs.map((n) => `
    <div class="notificacao-item" data-notif-id="${n.id}">
      <div class="notificacao-item-corpo"><strong>${n.titulo}</strong><br>${n.corpo || ""}</div>
      <div class="notificacao-item-quando">${tempoRelativo(n.criadoEm)}</div>
      ${n.tipo === "convite_evento" ? `
      <div class="notificacao-item-acoes">
        <button type="button" class="btn btn-secondary" data-recusar="${n.id}" data-convite="${n.eventoConvidadoId}">Recusar</button>
        <button type="button" class="btn btn-primary" data-aceitar="${n.id}" data-convite="${n.eventoConvidadoId}">Aceitar</button>
      </div>` : ""}
    </div>`).join("");

  lista.querySelectorAll("[data-aceitar]").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      await MockAPI.responderConvite(btn.dataset.convite, btn.dataset.aceitar, "aceito");
      showToast("Convite aceito.");
      carregarNotificacoesTopbar();
    });
  });
  lista.querySelectorAll("[data-recusar]").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      await MockAPI.responderConvite(btn.dataset.convite, btn.dataset.recusar, "recusado");
      showToast("Convite recusado.");
      carregarNotificacoesTopbar();
    });
  });
}

function tempoRelativo(isoString) {
  if (!isoString) return "";
  const diffMs = Date.now() - new Date(isoString).getTime();
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return "agora mesmo";
  if (min < 60) return `há ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `há ${h}h`;
  const d = Math.floor(h / 24);
  return `há ${d}d`;
}

/**
 * Modal "Meu perfil": qualquer colaborador logado pode trocar a própria
 * foto por aqui. Reaproveita o mesmo fluxo de recorte usado na logo de
 * cliente (js/core/imageCropModal.js) e salva em colaboradores.foto_url.
 * Depois de salvar, atualiza o cache de Auth e o avatar do topbar na hora,
 * sem precisar recarregar a página.
 */
function openMeuPerfilModal() {
  document.querySelector(".modal-overlay")?.remove();
  const user = Auth.getCurrentUser();
  if (!user) return;

  const closePerfilModal = () => document.getElementById("perfil-modal-overlay")?.remove();

  const avatarBotaoHtml = () => `
    <button type="button" id="perfil-foto-trigger" title="Trocar foto" style="position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:50%;background:var(--accent-primary);border:2px solid var(--bg-elevated);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer">
      ${icon("briefing", { size: 13 })}
    </button>
    <input type="file" id="perfil-foto-input" accept="image/*" class="hidden" />`;

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "perfil-modal-overlay";
  overlay.innerHTML = `
    <div class="modal-panel" style="width:360px">
      <div class="modal-header">
        <h3>Meu perfil</h3>
        <button class="modal-close-btn" id="perfil-modal-close">${icon("chevronDown", { size: 16 })}</button>
      </div>
      <div class="modal-body" style="align-items:center;text-align:center">
        <div style="position:relative;width:88px;height:88px" id="perfil-avatar-wrap">
          ${avatarHtml(user, { sizePx: 88, fontSizePx: 28, twoLetters: true, fallbackColor: "#2e63a6" })}
          ${avatarBotaoHtml()}
        </div>
        <h3 style="margin-top:var(--space-3)">${user.name}</h3>
        <p class="text-tertiary" style="font-size:12px">${Auth.roleLabel(user.role)}${user.title ? ` · ${user.title}` : ""}</p>
        <p class="text-tertiary" style="font-size:12px;margin-top:4px">${user.email}</p>
        <p class="text-tertiary" style="font-size:11px;margin-top:var(--space-4)">Clique no ícone sobre a foto pra trocar. Só você vê essa tela — pra editar outros dados, fale com um administrador.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="perfil-modal-cancel">Fechar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closePerfilModal(); });
  document.getElementById("perfil-modal-close").addEventListener("click", closePerfilModal);
  document.getElementById("perfil-modal-cancel").addEventListener("click", closePerfilModal);

  function bindFotoInput() {
    document.getElementById("perfil-foto-trigger")?.addEventListener("click", () => {
      document.getElementById("perfil-foto-input").click();
    });
    document.getElementById("perfil-foto-input")?.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        openImageCropModal(reader.result, { titulo: "Ajustar foto de perfil", textoBotao: "Salvar foto" }, async (dataUrl) => {
          try {
            await MockAPI.updateColaborador(user.id, { fotoUrl: dataUrl });
            Auth.patchCurrentUser({ fotoUrl: dataUrl });

            const wrap = document.getElementById("perfil-avatar-wrap");
            if (wrap) {
              wrap.innerHTML = avatarHtml(Auth.getCurrentUser(), { sizePx: 88, fontSizePx: 28, twoLetters: true, fallbackColor: "#2e63a6" }) + avatarBotaoHtml();
              bindFotoInput();
            }

            const chipTrigger = document.getElementById("user-menu-trigger");
            const avatarSpan = chipTrigger?.querySelector(".avatar");
            if (avatarSpan) avatarSpan.outerHTML = avatarHtml(Auth.getCurrentUser(), { twoLetters: true, fallbackColor: "#2e63a6" });

            showToast("Foto de perfil atualizada.");
          } catch (err) {
            console.error("openMeuPerfilModal:", err);
            showToast(err.message || "Não foi possível salvar a foto.", "erro");
          }
        });
      };
      reader.readAsDataURL(file);
    });
  }
  bindFotoInput();
}

/**
 * Frase do dia — tela de login.
 * Gera, uma vez por ano civil, um "baralho" com as 365 frases em ordem
 * embaralhada, garantindo que a mesma categoria nunca apareça em dois dias
 * seguidos (algoritmo guloso: a cada posição, escolhe a categoria com mais
 * frases restantes que não seja igual à do dia anterior). O baralho é
 * guardado em localStorage e reaproveitado o ano inteiro — cada dia do ano
 * aponta pra uma posição fixa dele, então a mesma frase aparece o dia
 * inteiro (não muda a cada recarregamento da página) e as 365 frases são
 * usadas exatamente uma vez cada, sem repetição, até o ano virar — quando
 * um novo baralho é sorteado do zero.
 * Sem localStorage disponível (ex: modo privado), o baralho é gerado em
 * memória a cada carregamento — perde a persistência, mas não quebra.
 */
const FRASE_DIA_STORAGE_KEY = "d2n_frase_dia_v1";

function embaralharComSeed(lista, seed) {
  const arr = [...lista];
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  const proximo = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(proximo() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function gerarBaralhoFrasesDoAno(ano) {
  const porCategoria = {};
  FRASES_DO_DIA.forEach((f, i) => { (porCategoria[f.categoria] = porCategoria[f.categoria] || []).push(i); });

  const grupos = FRASES_CATEGORIAS_ORDEM.map((cat, ci) => ({
    categoria: cat,
    fila: embaralharComSeed(porCategoria[cat] || [], ano * 1000 + ci * 97 + 7),
  }));

  const baralho = [];
  let categoriaAnterior = null;
  let restantes = grupos.reduce((s, g) => s + g.fila.length, 0);
  while (restantes > 0) {
    const candidatos = grupos.filter((g) => g.fila.length > 0).sort((a, b) => b.fila.length - a.fila.length);
    const escolhido = candidatos.find((g) => g.categoria !== categoriaAnterior) || candidatos[0];
    baralho.push(escolhido.fila.shift());
    categoriaAnterior = escolhido.categoria;
    restantes--;
  }
  return baralho;
}

function fraseDoDia() {
  const hoje = new Date();
  const anoAtual = hoje.getFullYear();
  const inicioAno = new Date(anoAtual, 0, 1);
  const diaDoAno = Math.floor((hoje - inicioAno) / 86400000);

  let registro = null;
  try {
    const raw = localStorage.getItem(FRASE_DIA_STORAGE_KEY);
    registro = raw ? JSON.parse(raw) : null;
  } catch (e) {
    registro = null;
  }

  const baralhoValido = registro && registro.ano === anoAtual && Array.isArray(registro.baralho) && registro.baralho.length === FRASES_DO_DIA.length;
  const baralho = baralhoValido ? registro.baralho : gerarBaralhoFrasesDoAno(anoAtual);

  if (!baralhoValido) {
    try {
      localStorage.setItem(FRASE_DIA_STORAGE_KEY, JSON.stringify({ ano: anoAtual, baralho }));
    } catch (e) {
      // sem persistência disponível — o baralho é regerado em memória a cada carregamento
    }
  }

  const indice = baralho[diaDoAno % baralho.length];
  return FRASES_DO_DIA[indice].texto;
}
function capitalizar(texto) {
  return texto.charAt(0).toUpperCase() + texto.slice(1);
}

function dataHoraAtual() {
  const agora = new Date();
  const dia = capitalizar(agora.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }));
  const hora = agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  return { dia, hora };
}

function bindLoginEvents(onSuccess) {
  const errorBox = document.getElementById("login-error");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("btn-login");

  const themeBtn = document.getElementById("btn-theme-toggle-login");
  themeBtn.addEventListener("click", () => {
    const next = toggleTheme();
    themeBtn.innerHTML = icon(next === "dark" ? "sun" : "moon", { size: 17 });
    const logoImg = document.getElementById("login-brand-logo");
    if (logoImg) logoImg.src = fontysFullLogoSrc(next);
  });

  async function attemptLogin() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      errorBox.textContent = "Preencha e-mail e senha.";
      errorBox.classList.add("is-visible");
      return;
    }
    loginBtn.textContent = "Entrando...";
    loginBtn.disabled = true;
    try {
      await Auth.login(email, password);
      errorBox.classList.remove("is-visible");
      if (relogioIntervalId) { clearInterval(relogioIntervalId); relogioIntervalId = null; }
      onSuccess();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("is-visible");
      loginBtn.textContent = "Entrar na plataforma";
      loginBtn.disabled = false;
    }
  }

  loginBtn.addEventListener("click", attemptLogin);

  // Enter em qualquer um dos campos também tenta logar (sem depender de <form>/submit,
  // que pode ser bloqueado em iframes com sandbox restrito e sem "allow-forms").
  [emailInput, passwordInput].forEach((input) => {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") attemptLogin();
    });
  });
}

function bindSetPasswordEvents(onDone) {
  const errorBox = document.getElementById("setpw-error");
  const pw1 = document.getElementById("setpw-1");
  const pw2 = document.getElementById("setpw-2");
  const btn = document.getElementById("btn-setpw");

  const themeBtn = document.getElementById("btn-theme-toggle-login");
  themeBtn.addEventListener("click", () => {
    const next = toggleTheme();
    themeBtn.innerHTML = icon(next === "dark" ? "sun" : "moon", { size: 17 });
    const logoImg = document.getElementById("login-brand-logo");
    if (logoImg) logoImg.src = fontysFullLogoSrc(next);
  });

  async function submit() {
    const senha1 = pw1.value;
    const senha2 = pw2.value;
    if (senha1.length < 6) {
      errorBox.textContent = "A senha precisa ter pelo menos 6 caracteres.";
      errorBox.classList.add("is-visible");
      return;
    }
    if (senha1 !== senha2) {
      errorBox.textContent = "As senhas não são iguais.";
      errorBox.classList.add("is-visible");
      return;
    }
    const supabase = getSupabaseClient();
    if (!supabase) {
      errorBox.textContent = "Conexão com o servidor não configurada.";
      errorBox.classList.add("is-visible");
      return;
    }
    btn.textContent = "Salvando...";
    btn.disabled = true;
    const { error } = await supabase.auth.updateUser({ password: senha1 });
    if (error) {
      errorBox.textContent = "Não foi possível salvar a senha. Tente clicar no link do e-mail de novo.";
      errorBox.classList.add("is-visible");
      btn.textContent = "Salvar senha e entrar";
      btn.disabled = false;
      return;
    }
    onDone();
  }

  btn.addEventListener("click", submit);
  [pw1, pw2].forEach((input) => {
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  });
}


/* ===== js/core/agendaPublica.js ===== */
/**
 * Página pública de agendamento — a única tela do sistema acessível sem
 * login. O cliente externo abre um link tipo #/agendar/{slug}, vê os
 * horários livres do colaborador e reserva um, direto na agenda dele.
 * Renderizada em #agendamento-root, fora do fluxo normal de autenticação
 * (ver lerSlugAgendamentoPublico + bootstrap em js/app.js).
 */
function lerSlugAgendamentoPublico() {
  const hash = window.location.hash || "";
  const m = hash.match(/^#\/agendar\/([^/?]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}

function paginaAgendamentoPublicoShell(conteudoHtml) {
  return `
    <div class="agendamento-publico-page">
      <div class="agendamento-publico-container">
        <div class="login-brand-row" style="margin-bottom:var(--space-6);justify-content:center">
          ${renderLogoMark(36)}
        </div>
        ${conteudoHtml}
      </div>
    </div>`;
}

async function renderAgendamentoPublico(slug) {
  // #app-root tem "height: 100%" fixo — mesmo escondendo só os filhos dele
  // (login-root/shell-root), ele continuava de pé, vazio, ocupando uma tela
  // inteira de altura no fluxo normal da página, e empurrava o
  // agendamento-root (que vem depois no HTML) pra baixo da área visível.
  // Escondendo o #app-root inteiro, ele colapsa e o conteúdo público some
  // de empurrar pra baixo, aparecendo certinho no topo.
  document.getElementById("app-root")?.classList.add("hidden");
  document.getElementById("login-root")?.classList.add("hidden");
  document.getElementById("shell-root")?.classList.add("hidden");
  const root = document.getElementById("agendamento-root");
  root.classList.remove("hidden");
  root.innerHTML = paginaAgendamentoPublicoShell(`<p class="text-tertiary" style="text-align:center;padding:var(--space-8)">Carregando horários disponíveis...</p>`);

  const colaboradorId = await MockAPI.resolverSlugAgendaPublica(slug);
  if (!colaboradorId) {
    root.innerHTML = paginaAgendamentoPublicoShell(`<div class="card" style="padding:var(--space-6);text-align:center"><h3>Link não encontrado</h3><p class="text-tertiary" style="margin-top:8px">Esse endereço não existe ou não está mais ativo. Confira o link com quem te enviou.</p></div>`);
    return;
  }

  const pagina = await MockAPI.getPaginaAgendaPublica(colaboradorId);
  if (!pagina) {
    root.innerHTML = paginaAgendamentoPublicoShell(`<div class="card" style="padding:var(--space-6);text-align:center"><h3>Agenda indisponível</h3><p class="text-tertiary" style="margin-top:8px">Essa pessoa não está com o agendamento público ativo no momento.</p></div>`);
    return;
  }

  const hoje = new Date();
  const dataInicio = isoDate(hoje);
  const dataFim = isoDate(new Date(hoje.getTime() + pagina.config.diasFuturos * 86400000));

  const [disponibilidade, ocupados] = await Promise.all([
    MockAPI.getDisponibilidadePublica(colaboradorId),
    MockAPI.getHorariosOcupadosPublico(colaboradorId, dataInicio, dataFim),
  ]);

  const slots = calcularSlotsDisponiveis({
    regras: disponibilidade.regras, excecoes: disponibilidade.excecoes, ocupados,
    duracaoMin: pagina.config.duracaoSlotMin,
    antecedenciaHoras: pagina.config.antecedenciaMinimaHoras,
    diasFuturos: pagina.config.diasFuturos,
    intervaloMin: pagina.config.intervaloMin,
  });

  renderPaginaAgendamentoConteudo(root, { colaboradorId, pagina, slots });
}

function renderPaginaAgendamentoConteudo(root, { colaboradorId, pagina, slots }) {
  const porDia = {};
  slots.forEach((s) => { (porDia[s.data] = porDia[s.data] || []).push(s); });

  const hoje = new Date();
  let modo = "semana"; // padrão — melhor pra celular; "mes" também disponível
  let refDate = new Date(hoje);

  const avatarSrc = pagina.fotoUrl
    ? `<img src="${pagina.fotoUrl}" style="width:56px;height:56px;border-radius:50%;object-fit:cover" />`
    : `<span class="avatar lg" style="width:56px;height:56px;font-size:20px;background:${pagina.avatarColor || "#2e63a6"}">${(pagina.nome || "?").split(" ").filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase()}</span>`;

  function cabecalho() {
    return `
      <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-5)">
        ${avatarSrc}
        <div>
          <h2 style="margin:0">${pagina.tituloPagina || `Agende um horário com ${pagina.nome}`}</h2>
          <p class="text-tertiary" style="font-size:13px;margin-top:2px">${pagina.cargo || ""}</p>
        </div>
      </div>
      <div class="agendamento-modo-toggle">
        <button type="button" class="agendamento-modo-btn ${modo === "semana" ? "is-ativo" : ""}" id="agpub-modo-semana">Semana</button>
        <button type="button" class="agendamento-modo-btn ${modo === "mes" ? "is-ativo" : ""}" id="agpub-modo-mes">Mês</button>
      </div>`;
  }

  function bindModoToggle(renderAtual) {
    document.getElementById("agpub-modo-semana").addEventListener("click", () => {
      if (modo === "semana") return;
      modo = "semana"; refDate = new Date(hoje);
      renderAtual();
    });
    document.getElementById("agpub-modo-mes").addEventListener("click", () => {
      if (modo === "mes") return;
      modo = "mes"; refDate = new Date(hoje);
      renderAtual();
    });
  }

  function bindCliqueSlots() {
    root.querySelectorAll(".agendamento-slot-quadrado-pequeno").forEach((btn) => {
      btn.addEventListener("click", () => {
        const params = { colaboradorId, pagina, data: btn.dataset.data, horaInicio: btn.dataset.inicio, horaFim: btn.dataset.fim };
        if (btn.dataset.origem === "recorrente") {
          abrirEscolhaRecorrencia(root, params);
        } else {
          abrirFormularioConfirmacao(root, { ...params, recorrente: false });
        }
      });
    });
  }

  function renderPainel() {
    if (modo === "semana") renderSemana(); else renderMes();
  }

  function renderSemana() {
    const inicioSemana = new Date(refDate);
    inicioSemana.setDate(inicioSemana.getDate() - inicioSemana.getDay());
    const dias = [];
    for (let i = 0; i < 7; i++) { const d = new Date(inicioSemana); d.setDate(d.getDate() + i); dias.push(d); }

    const fimSemana = dias[6];
    const mesmoMes = inicioSemana.getMonth() === fimSemana.getMonth();
    const tituloSemana = mesmoMes
      ? `${inicioSemana.getDate()} – ${fimSemana.getDate()} de ${fimSemana.toLocaleDateString("pt-BR", { month: "long" })}`
      : `${inicioSemana.getDate()} de ${inicioSemana.toLocaleDateString("pt-BR", { month: "short" })} – ${fimSemana.getDate()} de ${fimSemana.toLocaleDateString("pt-BR", { month: "short" })}`;

    const inicioHoje = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
    const podeVoltar = inicioSemana > inicioHoje;

    root.innerHTML = paginaAgendamentoPublicoShell(`
      <div class="card" style="padding:var(--space-6)">
        ${cabecalho()}
        <div class="agendamento-mes-nav">
          <button type="button" class="agendamento-mes-nav-btn" id="agpub-nav-anterior" ${podeVoltar ? "" : "disabled"}>‹</button>
          <div class="agendamento-mes-titulo">${tituloSemana}</div>
          <button type="button" class="agendamento-mes-nav-btn" id="agpub-nav-proximo">›</button>
        </div>
        <div class="agendamento-mes-grid">
          <div class="agendamento-mes-cabecalho">
            ${["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"].map((d) => `<div>${d}</div>`).join("")}
          </div>
          <div class="agendamento-mes-semana">
            ${dias.map((dia) => {
              const dataIso = isoDate(dia);
              const slotsDoDia = (porDia[dataIso] || []).slice().sort((a, b) => a.horaInicio.localeCompare(b.horaInicio));
              return `
              <div class="agendamento-mes-dia">
                <div class="agendamento-mes-dia-numero">${dia.getDate()}</div>
                <div class="agendamento-mes-dia-slots">
                  ${slotsDoDia.map((s) => `<button type="button" class="agendamento-slot-quadrado-pequeno" data-data="${s.data}" data-inicio="${s.horaInicio}" data-fim="${s.horaFim}" data-origem="${s.origem}">${s.horaInicio}</button>`).join("")}
                </div>
              </div>`;
            }).join("")}
          </div>
        </div>
      </div>
    `);

    bindModoToggle(renderPainel);
    document.getElementById("agpub-nav-anterior").addEventListener("click", () => {
      refDate.setDate(refDate.getDate() - 7);
      renderSemana();
    });
    document.getElementById("agpub-nav-proximo").addEventListener("click", () => {
      refDate.setDate(refDate.getDate() + 7);
      renderSemana();
    });
    bindCliqueSlots();
  }

  function renderMes() {
    const mesAno = refDate.getFullYear();
    const mesMes = refDate.getMonth();
    const primeiroDiaMes = new Date(mesAno, mesMes, 1);
    const ultimoDiaMes = new Date(mesAno, mesMes + 1, 0);
    const inicioGrid = new Date(primeiroDiaMes);
    inicioGrid.setDate(inicioGrid.getDate() - primeiroDiaMes.getDay());
    const fimGrid = new Date(ultimoDiaMes);
    fimGrid.setDate(fimGrid.getDate() + (6 - ultimoDiaMes.getDay()));

    const semanas = [];
    const cursor = new Date(inicioGrid);
    while (cursor <= fimGrid) {
      const semana = [];
      for (let i = 0; i < 7; i++) { semana.push(new Date(cursor)); cursor.setDate(cursor.getDate() + 1); }
      semanas.push(semana);
    }

    const nomeMes = primeiroDiaMes.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    const nomeMesCap = nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1);
    const mesAtualReal = hoje.getMonth();
    const anoAtualReal = hoje.getFullYear();
    const podeVoltar = mesAno > anoAtualReal || (mesAno === anoAtualReal && mesMes > mesAtualReal);

    root.innerHTML = paginaAgendamentoPublicoShell(`
      <div class="card" style="padding:var(--space-6)">
        ${cabecalho()}
        <div class="agendamento-mes-nav">
          <button type="button" class="agendamento-mes-nav-btn" id="agpub-nav-anterior" ${podeVoltar ? "" : "disabled"}>‹</button>
          <div class="agendamento-mes-titulo">${nomeMesCap}</div>
          <button type="button" class="agendamento-mes-nav-btn" id="agpub-nav-proximo">›</button>
        </div>

        <div class="agendamento-mes-grid">
          <div class="agendamento-mes-cabecalho">
            ${["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"].map((d) => `<div>${d}</div>`).join("")}
          </div>
          ${semanas.map((semana) => `
            <div class="agendamento-mes-semana">
              ${semana.map((dia) => {
                const dataIso = isoDate(dia);
                const foraDoMes = dia.getMonth() !== mesMes;
                const slotsDoDia = (porDia[dataIso] || []).slice().sort((a, b) => a.horaInicio.localeCompare(b.horaInicio));
                return `
                <div class="agendamento-mes-dia ${foraDoMes ? "is-fora-mes" : ""}">
                  <div class="agendamento-mes-dia-numero">${dia.getDate()}</div>
                  <div class="agendamento-mes-dia-slots">
                    ${slotsDoDia.map((s) => `<button type="button" class="agendamento-slot-quadrado-pequeno" data-data="${s.data}" data-inicio="${s.horaInicio}" data-fim="${s.horaFim}" data-origem="${s.origem}">${s.horaInicio}</button>`).join("")}
                  </div>
                </div>`;
              }).join("")}
            </div>`).join("")}
        </div>
      </div>
    `);

    bindModoToggle(renderPainel);
    document.getElementById("agpub-nav-anterior").addEventListener("click", () => {
      refDate = new Date(mesAno, mesMes - 1, 1);
      renderMes();
    });
    document.getElementById("agpub-nav-proximo").addEventListener("click", () => {
      refDate = new Date(mesAno, mesMes + 1, 1);
      renderMes();
    });
    bindCliqueSlots();
  }

  renderPainel();
}

function abrirEscolhaRecorrencia(root, { colaboradorId, pagina, data, horaInicio, horaFim }) {
  const d = new Date(`${data}T00:00:00`);
  const dataFmt = d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
  const diaSemanaFmt = d.toLocaleDateString("pt-BR", { weekday: "long" });
  root.innerHTML = paginaAgendamentoPublicoShell(`
    <div class="card" style="padding:var(--space-6)">
      <h3 style="margin:0 0 4px">Como você quer reservar?</h3>
      <p class="text-tertiary" style="font-size:13px;margin-bottom:var(--space-5)">${dataFmt}, ${horaInicio} – ${horaFim} · com ${pagina.nome}</p>

      <div style="display:flex;flex-direction:column;gap:10px">
        <button type="button" class="btn btn-secondary" id="agpub-so-esta" style="text-align:left;padding:14px 16px">
          <strong>Só esta data</strong><br><span class="text-tertiary" style="font-size:12px;font-weight:400">Reserva única em ${dataFmt}.</span>
        </button>
        <button type="button" class="btn btn-secondary" id="agpub-recorrente" style="text-align:left;padding:14px 16px">
          <strong>Toda ${diaSemanaFmt}</strong><br><span class="text-tertiary" style="font-size:12px;font-weight:400">Reserva fixa, repete toda semana nesse horário.</span>
        </button>
      </div>

      <button type="button" class="btn btn-secondary" id="agpub-voltar-escolha" style="width:100%;margin-top:var(--space-4)">Voltar</button>
    </div>
  `);

  document.getElementById("agpub-so-esta").addEventListener("click", () => {
    abrirFormularioConfirmacao(root, { colaboradorId, pagina, data, horaInicio, horaFim, recorrente: false });
  });
  document.getElementById("agpub-recorrente").addEventListener("click", () => {
    abrirFormularioConfirmacao(root, { colaboradorId, pagina, data, horaInicio, horaFim, recorrente: true });
  });
  document.getElementById("agpub-voltar-escolha").addEventListener("click", () => {
    renderAgendamentoPublico(lerSlugAgendamentoPublico());
  });
}

function abrirFormularioConfirmacao(root, { colaboradorId, pagina, data, horaInicio, horaFim, recorrente }) {
  const d = new Date(`${data}T00:00:00`);
  const dataFmt = d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
  const diaSemanaFmt = d.toLocaleDateString("pt-BR", { weekday: "long" });
  root.innerHTML = paginaAgendamentoPublicoShell(`
    <div class="card" style="padding:var(--space-6)">
      <h3 style="margin:0 0 4px">Confirmar horário</h3>
      <p class="text-tertiary" style="font-size:13px;margin-bottom:var(--space-5)">
        ${recorrente ? `Toda ${diaSemanaFmt}` : dataFmt}, ${horaInicio} – ${horaFim} · com ${pagina.nome}
        ${recorrente ? `<br><span style="color:var(--accent-primary)">Reserva recorrente — repete toda semana.</span>` : ""}
      </p>

      <div class="login-error" id="agpub-error"></div>
      <div class="field"><label>Seu nome</label><input type="text" id="agpub-nome" placeholder="Nome completo" /></div>
      <div class="field"><label>Telefone (WhatsApp)</label><input type="text" id="agpub-telefone" placeholder="(11) 99999-0000" /></div>
      <div class="field"><label>E-mail (opcional)</label><input type="email" id="agpub-email" placeholder="voce@email.com" /></div>
      <div class="field"><label>Assunto</label><input type="text" id="agpub-assunto" placeholder="Ex: Sessão de assessoria" /></div>

      <div style="display:flex;gap:10px;margin-top:var(--space-4)">
        <button type="button" class="btn btn-secondary" id="agpub-voltar" style="flex:1">Voltar</button>
        <button type="button" class="btn btn-primary" id="agpub-confirmar" style="flex:1">Confirmar agendamento</button>
      </div>
    </div>
  `);

  document.getElementById("agpub-voltar").addEventListener("click", () => {
    renderAgendamentoPublico(lerSlugAgendamentoPublico());
  });

  document.getElementById("agpub-confirmar").addEventListener("click", async () => {
    const nome = document.getElementById("agpub-nome").value.trim();
    const telefone = document.getElementById("agpub-telefone").value.trim();
    const email = document.getElementById("agpub-email").value.trim();
    const assunto = document.getElementById("agpub-assunto").value.trim() || `Compromisso com ${pagina.nome}`;
    const errorBox = document.getElementById("agpub-error");
    if (!nome) { errorBox.textContent = "Informe seu nome."; return; }
    if (!telefone) { errorBox.textContent = "Informe um telefone de contato."; return; }

    const btn = document.getElementById("agpub-confirmar");
    btn.disabled = true;
    btn.textContent = "Confirmando...";
    try {
      await MockAPI.criarAgendamentoPublico({
        colaboradorId, titulo: assunto, data, horaInicio, horaFim, recorrente,
        nomeCliente: nome, telefoneCliente: telefone, emailCliente: email,
      });
      root.innerHTML = paginaAgendamentoPublicoShell(`
        <div class="card" style="padding:var(--space-6);text-align:center">
          <h3 style="margin:0 0 8px">Horário reservado! 🎉</h3>
          <p class="text-tertiary">Seu compromisso com ${pagina.nome} ficou marcado ${recorrente ? `toda <strong>${diaSemanaFmt}</strong>` : `pra <strong>${dataFmt}</strong>`}, das ${horaInicio} às ${horaFim}.</p>
          <p class="text-tertiary" style="margin-top:8px;font-size:12px">Se precisar reagendar ou cancelar, entre em contato diretamente.</p>
        </div>
      `);
    } catch (err) {
      errorBox.textContent = err.message || "Não foi possível confirmar. Tente novamente.";
      btn.disabled = false;
      btn.textContent = "Confirmar agendamento";
    }
  });
}


/* ===== js/core/imageCropModal.js ===== */
/* Cropper simples e independente, sem biblioteca externa: arrasta pra reposicionar
   e um slider pra zoom, sempre recortando um quadrado. Gera um PNG (data URL) e
   devolve via callback. Compartilhado entre módulos (logo de cliente, foto de
   colaborador, etc) — por isso vive em core, não dentro de um módulo isolado. */
function openImageCropModal(sourceDataUrl, { titulo = "Ajustar imagem", textoBotao = "Salvar" } = {}, onSave) {
  const VIEWPORT = 260;
  const OUTPUT = 320;

  const img = new Image();
  img.onload = () => {
    let baseScale = Math.max(VIEWPORT / img.naturalWidth, VIEWPORT / img.naturalHeight);
    let userScale = 1;
    let offsetX = 0, offsetY = 0;

    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.id = "crop-modal-overlay";
    overlay.style.zIndex = "300";
    overlay.innerHTML = `
      <div class="modal-panel" style="width:auto">
        <div class="modal-header"><h3>${titulo}</h3><button class="modal-close-btn" id="crop-close">${icon("chevronDown", { size: 16 })}</button></div>
        <div class="modal-body" style="align-items:center">
          <div class="crop-viewport" id="crop-viewport" style="width:${VIEWPORT}px;height:${VIEWPORT}px">
            <img id="crop-img" src="${sourceDataUrl}" draggable="false" />
          </div>
          <div class="field" style="width:${VIEWPORT}px;margin-top:16px">
            <label>Zoom</label>
            <input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1" style="width:100%" />
          </div>
          <p class="text-tertiary" style="font-size:11px;margin-top:8px">Arraste a imagem para posicionar.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="crop-cancel">Cancelar</button>
          <button class="btn btn-primary" id="crop-save">${textoBotao}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    const viewport = document.getElementById("crop-viewport");
    const imgEl = document.getElementById("crop-img");
    const zoomInput = document.getElementById("crop-zoom");

    function clampOffset() {
      const effScale = baseScale * userScale;
      const dw = img.naturalWidth * effScale;
      const dh = img.naturalHeight * effScale;
      const maxX = Math.max(0, (dw - VIEWPORT) / 2);
      const maxY = Math.max(0, (dh - VIEWPORT) / 2);
      offsetX = Math.min(maxX, Math.max(-maxX, offsetX));
      offsetY = Math.min(maxY, Math.max(-maxY, offsetY));
    }

    function render() {
      clampOffset();
      const effScale = baseScale * userScale;
      imgEl.style.width = `${img.naturalWidth * effScale}px`;
      imgEl.style.height = `${img.naturalHeight * effScale}px`;
      imgEl.style.transform = `translate(-50%, -50%) translate(${offsetX}px, ${offsetY}px)`;
    }
    render();

    zoomInput.addEventListener("input", () => {
      userScale = Number(zoomInput.value);
      render();
    });

    let dragging = false, startX = 0, startY = 0, startOffX = 0, startOffY = 0;
    viewport.addEventListener("pointerdown", (e) => {
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      startOffX = offsetX; startOffY = offsetY;
      viewport.setPointerCapture(e.pointerId);
    });
    viewport.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      offsetX = startOffX + (e.clientX - startX);
      offsetY = startOffY + (e.clientY - startY);
      render();
    });
    viewport.addEventListener("pointerup", () => { dragging = false; });
    viewport.addEventListener("pointerleave", () => { dragging = false; });

    const close = () => overlay.remove();
    overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
    document.getElementById("crop-close").addEventListener("click", close);
    document.getElementById("crop-cancel").addEventListener("click", close);

    document.getElementById("crop-save").addEventListener("click", () => {
      const effScale = baseScale * userScale;
      const dw = img.naturalWidth * effScale;
      const dh = img.naturalHeight * effScale;
      const imgLeft = (VIEWPORT - dw) / 2 + offsetX;
      const imgTop = (VIEWPORT - dh) / 2 + offsetY;
      const sx = Math.max(0, -imgLeft / effScale);
      const sy = Math.max(0, -imgTop / effScale);
      const sSize = VIEWPORT / effScale;

      const canvas = document.createElement("canvas");
      canvas.width = OUTPUT;
      canvas.height = OUTPUT;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, sx, sy, sSize, sSize, 0, 0, OUTPUT, OUTPUT);
      const croppedDataUrl = canvas.toDataURL("image/png");
      close();
      onSave(croppedDataUrl);
    });
  };
  img.src = sourceDataUrl;
}


/* ===== js/core/disponibilidade.js ===== */
/**
 * Calcula os horários livres pra agendamento público, cruzando:
 *  - regras recorrentes semanais (ex: seg-sex 9h-12h)
 *  - exceções manuais de uma data específica (abre horário fora da regra,
 *    ou bloqueia um horário que a regra normalmente liberaria)
 *  - horários já ocupados na agenda (eventos existentes)
 *  - antecedência mínima (não deixa marcar em cima da hora) e janela de
 *    quantos dias pra frente mostrar
 * Compartilhado entre a prévia dentro do app (Agenda > Meus horários) e a
 * página pública do link — por isso vive em core.
 */
function minutosDoHorario(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}
function horarioDosMinutos(min) {
  const h = String(Math.floor(min / 60)).padStart(2, "0");
  const m = String(min % 60).padStart(2, "0");
  return `${h}:${m}`;
}

/** Subtrai um intervalo ocupado [oIni,oFim) de uma lista de intervalos livres, podendo partir um em dois. */
function subtrairIntervaloLivre(livres, oIni, oFim) {
  const resultado = [];
  for (const [ini, fim] of livres) {
    if (oFim <= ini || oIni >= fim) { resultado.push([ini, fim]); continue; } // não sobrepõe
    if (oIni > ini) resultado.push([ini, Math.min(oIni, fim)]);
    if (oFim < fim) resultado.push([Math.max(oFim, ini), fim]);
  }
  return resultado.filter(([ini, fim]) => fim > ini);
}

function calcularSlotsDisponiveis({ regras, excecoes, ocupados, duracaoMin, antecedenciaHoras = 2, diasFuturos = 30, intervaloMin = 0 }) {
  const agora = new Date();
  const limiteAntecedencia = new Date(agora.getTime() + antecedenciaHoras * 3600000);
  const slots = [];

  for (let i = 0; i < diasFuturos; i++) {
    const dia = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate() + i);
    const dataIso = isoDate(dia);
    const diaSemana = dia.getDay();

    const janelasRegra = regras.filter((r) => r.diaSemana === diaSemana).map((r) => [minutosDoHorario(r.horaInicio), minutosDoHorario(r.horaFim)]);
    let livres = [...janelasRegra];

    const excecoesDoDia = excecoes.filter((e) => e.data === dataIso);
    const janelasExcecaoDisponivel = excecoesDoDia.filter((e) => e.tipo === "disponivel").map((e) => [minutosDoHorario(e.horaInicio), minutosDoHorario(e.horaFim)]);
    for (const janela of janelasExcecaoDisponivel) livres.push(janela);
    for (const exc of excecoesDoDia.filter((e) => e.tipo === "bloqueado")) {
      livres = subtrairIntervaloLivre(livres, minutosDoHorario(exc.horaInicio), minutosDoHorario(exc.horaFim));
    }

    const ocupadosDoDia = ocupados.filter((o) => o.data === dataIso && o.horaInicio && o.horaFim);
    for (const o of ocupadosDoDia) {
      livres = subtrairIntervaloLivre(livres, minutosDoHorario(o.horaInicio), minutosDoHorario(o.horaFim));
    }

    // Se o horário está dentro de alguma janela de regra recorrente, o slot é
    // "recorrente" (o cliente pode escolher reservar só essa data ou toda
    // semana); senão, se veio só de uma exceção pontual, é "unico".
    const dentroDeAlgumaJanela = (inicioSlot, fimSlot, janelas) => janelas.some(([wIni, wFim]) => inicioSlot >= wIni && fimSlot <= wFim);

    livres.sort((a, b) => a[0] - b[0]);
    for (const [ini, fim] of livres) {
      for (let inicioSlot = ini; inicioSlot + duracaoMin <= fim; inicioSlot += (duracaoMin + intervaloMin)) {
        const inicioAbsoluto = new Date(dia.getFullYear(), dia.getMonth(), dia.getDate(), 0, inicioSlot);
        if (inicioAbsoluto < limiteAntecedencia) continue;
        const fimSlot = inicioSlot + duracaoMin;
        const origem = dentroDeAlgumaJanela(inicioSlot, fimSlot, janelasRegra) ? "recorrente" : "unico";
        slots.push({ data: dataIso, horaInicio: horarioDosMinutos(inicioSlot), horaFim: horarioDosMinutos(fimSlot), origem });
      }
    }
  }
  return slots;
}

function expandParaIntervalo(eventos, rangeStart, rangeEnd) {

  for (const ev of eventos) {

    if (ev.recorrencia === "weekly") {

function colorForNome(nome) {

const DIAS_SEMANA_LABEL = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];

function ocorrenciaNoMes(date) {
  return Math.ceil(date.getDate() / 7); // 1ª, 2ª, 3ª... ocorrência daquele dia da semana no mês
}

function nEsimoDiaSemanaDoMes(year, monthIndex, weekday, n) {
  const primeiro = new Date(year, monthIndex, 1);
  const primeiroDiaSemana = primeiro.getDay();
  const dia = 1 + ((7 + weekday - primeiroDiaSemana) % 7) + (n - 1) * 7;
  const date = new Date(year, monthIndex, dia);
  return date.getMonth() === monthIndex ? date : null;
}

function descricaoMensalPorDiaSemana(dataIso) {

}

const hex2rgba = (hex, alpha) => {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${alpha})`;
};

/* ============================== RECORRÊNCIA ============================== */

function ocorrenciaValida(ev, dataIso) {
  if (ev.excecoes?.includes(dataIso)) return false;
  if (ev.recorrenciaFim && dataIso >= ev.recorrenciaFim) return false;
  return true;
}

function expandOccurrences(events, rangeStart, rangeEnd) {
  const out = [];
  for (const ev of events) {
    const evDate = parseIso(ev.data);
    if (ev.recorrencia === "weekly") {
      let cursor = new Date(evDate);
      while (cursor < rangeStart) cursor = addDays(cursor, 7);
      while (cursor <= rangeEnd) {
        const d = isoDate(cursor);
        if (ocorrenciaValida(ev, d)) out.push({ ...ev, data: d, occId: `${ev.id}_${d}` });
        cursor = addDays(cursor, 7);
      }
    } else if (ev.recorrencia === "biweekly") {
      let cursor = new Date(evDate);
      let guard = 0;
      while (cursor < rangeStart && guard++ < 104) cursor = addDays(cursor, 14);
      while (cursor <= rangeEnd) {
        const d = isoDate(cursor);
        if (ocorrenciaValida(ev, d)) out.push({ ...ev, data: d, occId: `${ev.id}_${d}` });
        cursor = addDays(cursor, 14);
      }
    } else if (ev.recorrencia === "monthly") {
      let cursor = new Date(evDate);
      let guard = 0;
      while (cursor < rangeStart && guard++ < 24) cursor = addMonths(cursor, 1);
      guard = 0;
      while (cursor <= rangeEnd && guard++ < 24) {
        const d = isoDate(cursor);
        if (ocorrenciaValida(ev, d)) out.push({ ...ev, data: d, occId: `${ev.id}_${d}` });
        cursor = addMonths(cursor, 1);
      }
    } else if (ev.recorrencia === "monthly_weekday") {
      const weekday = evDate.getDay();
      const n = ocorrenciaNoMes(evDate);
      let y = rangeStart.getFullYear(), m = rangeStart.getMonth();
      const endY = rangeEnd.getFullYear(), endM = rangeEnd.getMonth();
      let guard = 0;
      while ((y < endY || (y === endY && m <= endM)) && guard++ < 36) {
        const occ = nEsimoDiaSemanaDoMes(y, m, weekday, n);
        if (occ && occ >= evDate && occ >= rangeStart && occ <= rangeEnd) {
          const d = isoDate(occ);
          if (ocorrenciaValida(ev, d)) out.push({ ...ev, data: d, occId: `${ev.id}_${d}` });
        }
        m++;
        if (m > 11) { m = 0; y++; }
      }
    } else {
      if (evDate >= rangeStart && evDate <= rangeEnd) {
        out.push({ ...ev, occId: ev.id });
      }
    }
  }
  return out;
}
