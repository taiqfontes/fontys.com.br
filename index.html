document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0\" opacity=\"0.55\" style=\"flex-shrink:0;\"><path d=\"M9.9 5.5C6.9 7 5 9.9 5 13.2V18.5h5.4v-5.4H7.9c0-2.2 1.1-3.9 3-4.7l-1-2.9zm8.1 0c-3 1.5-4.9 4.4-4.9 7.7v5.3h5.4v-5.4h-2.5c0-2.2 1.1-3.9 3-4.7l-1-2.9z\"><\u002Fpath><\u002Fsvg>\n        <p style=\"margin-top:20px; font-family:'Newsreader',serif; font-size:19px; line-height:1.55; color:rgba(255,255,255,0.88); letter-spacing:-0.2px; flex:1;\">\"Terceirizar a rotina financeira liberou meu tempo para focar no crescimento do negócio. Suporte atencioso e muito profissional.\"<\u002Fp>\n        <div style=\"margin-top:26px; display:flex; align-items:center; gap:14px;\">\n          <div style=\"width:46px; height:46px; border-radius:50%; border:1px solid rgba(255,255,255,0.28); background:rgba(74,124,236,0.10); box-shadow:0 0 24px rgba(74,124,236,0.4); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; font-size:16px; flex-shrink:0;\">JS<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:2px;\">\n            <span style=\"font-size:15px; font-weight:600; color:#fff;\">Juliana Santos<\u002Fspan>\n            <span style=\"font-size:13px; color:rgba(255,255,255,0.5);\">CEO · Agência<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n\n<!-- ============ CONTAINER 6 — CTA final / contato ============ -->\n<section class=\"cta-section\" style=\"position:relative; background:transparent; padding:60px 32px 130px; overflow:hidden; font-family:'Hanken Grotesk',sans-serif;\">\n\n  <div style=\"position:relative; max-width:900px; margin:0 auto; display:flex; flex-direction:column; align-items:center; text-align:center;\">\n\n    <h2 style=\"font-family:'Newsreader',serif; font-weight:500; font-size:clamp(34px,4.4vw,60px); color:#fff; letter-spacing:-1.2px; line-height:1.08; text-wrap:balance;\">Vamos construir uma <span style=\"color:#6f9fe0;\">gestão financeira<\u002Fspan> mais inteligente?<\u002Fh2>\n\n    <p style=\"margin-top:26px; font-size:clamp(16px,1.6vw,20px); line-height:1.55; color:rgba(255,255,255,0.6); max-width:620px;\">Seja para sua empresa ou para sua vida financeira, a Fontys pode ajudar você a enxergar seus números com mais clareza e transformar informação em resultado.<\u002Fp>\n\n    <a href=\"https://wa.me/5511947082567?text=Oi%2C%20tudo%20bem%3F!%20Vim%20do%20site%20e%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es.\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:44px; display:inline-flex; align-items:center; gap:14px; padding:18px 38px; border-radius:100px; background:linear-gradient(180deg,#d4b872,#c2a15c); color:#122040; text-decoration:none; font-size:17px; font-weight:700; letter-spacing:-0.2px; box-shadow:0 0 60px rgba(205,171,107,0.45); transition:transform .18s ease, box-shadow .18s ease;\" style-hover=\"transform:translateY(-2px); box-shadow:0 0 84px rgba(205,171,107,0.7);\">\n      Falar no WhatsApp\n      <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17 17 7\"><\u002Fpath><path d=\"M8 7h9v9\"><\u002Fpath><\u002Fsvg>\n    <\u002Fa>\n\n  <\u002Fdiv>\n\n<\u002Fsection>\n\n  <footer class=\"site-footer\" style=\"position:relative; border-top:1px solid rgba(255,255,255,0.06); background:transparent; padding:44px 40px; display:flex; flex-wrap:wrap; gap:32px; align-items:center; justify-content:space-between; font-family:'Hanken Grotesk',sans-serif;\">\n    <div class=\"foot-brand\" style=\"display:flex; align-items:center; gap:28px;\">\n      <img src=\"0e37d4ca-c48d-458c-9769-6f633dc8a7cd\" alt=\"Fontys\" style=\"height:34px; width:auto; opacity:0.95;\">\n      <div class=\"foot-divider\" style=\"width:1px; height:38px; background:rgba(255,255,255,0.14);\"><\u002Fdiv>\n      <span style=\"font-family:'Newsreader',serif; font-style:italic; font-size:17px; color:rgba(255,255,255,0.55);\">Inteligência financeira para você e seu negócio.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"text-align:right; display:flex; flex-direction:column; gap:5px;\">\n      <p style=\"font-size:15px; color:rgba(255,255,255,0.7);\">Fontys Inteligência Financeira · <strong style=\"color:#fff; font-weight:600;\">(11) 94708-2567<\u002Fstrong><\u002Fp>\n      <p style=\"font-size:14px; color:rgba(255,255,255,0.4);\">Fontys Inteligência Empresarial LTDA · CNPJ 64.623.626/0001-37<\u002Fp>\n      <p style=\"font-size:14px; color:rgba(255,255,255,0.4);\">Rua Pais Leme, 215 — Conj. 1713, Pinheiros, São Paulo - SP, 05424-150<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1900, &quot;height&quot;: 1000 },\n  &quot;showStats&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Conteúdo&quot; },\n  &quot;showBeams&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Fundo&quot; },\n\n  &quot;glowIntensity&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 0.75, &quot;min&quot;: 0, &quot;max&quot;: 1, &quot;step&quot;: 0.05, &quot;unit&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Fundo&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { px: 0, py: 0 };\n\n  componentDidMount() {\n    this._onMove = (e) => {\n      const px = e.clientX / window.innerWidth - 0.5;\n      const py = e.clientY / window.innerHeight - 0.5;\n      this.setState({ px, py });\n    };\n    window.addEventListener('mousemove', this._onMove);\n    this._startNeural();\n  }\n\n  _startNeural() {\n    const canvas = this._neural;\n    if (!canvas) { requestAnimationFrame(() => this._startNeural()); return; }\n    const ctx = canvas.getContext('2d');\n    let W, H, dpr, nodes, bokeh, hubs, tickers, mouse = { x: -9999, y: -9999 };\n\n    const C_LINE = '120,170,255';\n    const C_NODE = '150,195,255';\n    const C_HOT = '210,235,255';\n    const rand = (a, b) => a + Math.random() * (b - a);\n\n    const makeSprite = (size, inner, mid) => {\n      const s = document.createElement('canvas');\n      s.width = s.height = size;\n      const c = s.getContext('2d');\n      const g = c.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);\n      g.addColorStop(0, inner);\n      g.addColorStop(0.35, mid);\n      g.addColorStop(1, 'rgba(' + C_LINE + ',0)');\n      c.fillStyle = g;\n      c.fillRect(0, 0, size, size);\n      return s;\n    };\n    const nodeSprite = makeSprite(40, 'rgba(' + C_NODE + ',0.95)', 'rgba(' + C_NODE + ',0.32)');\n    const hubSprite  = makeSprite(120, 'rgba(' + C_HOT + ',1)', 'rgba(' + C_NODE + ',0.35)');\n\n    const build = () => {\n      dpr = Math.min(window.devicePixelRatio || 1, 1.5);\n      const r = canvas.getBoundingClientRect();\n      W = r.width; H = r.height;\n      canvas.width = W * dpr; canvas.height = H * dpr;\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      const density = Math.round((W * H) / 20000);\n      const count = Math.max(45, Math.min(90, density));\n      const cx = W * 0.5, cy = H * 0.5;\n      nodes = Array.from({ length: count }, () => {\n        const ang = rand(0, Math.PI * 2);\n        const rad = Math.pow(Math.random(), 0.7) * Math.min(W, H) * 0.62;\n        return {\n          x: cx + Math.cos(ang) * rad + rand(-40, 40),\n          y: cy + Math.sin(ang) * rad * 0.7 + rand(-40, 40),\n          vx: rand(-0.16, 0.16), vy: rand(-0.16, 0.16),\n          r: rand(0.8, 2.0),\n          pulse: rand(0, Math.PI * 2),\n          pulseSpeed: rand(0.006, 0.018),\n        };\n      });\n      hubs = Array.from({ length: Math.max(4, Math.round(count / 22)) }, () => ({\n        x: cx + rand(-W * 0.22, W * 0.22),\n        y: cy + rand(-H * 0.18, H * 0.18),\n        vx: rand(-0.07, 0.07), vy: rand(-0.07, 0.07),\n        r: rand(2.6, 4.2),\n        pulse: rand(0, Math.PI * 2),\n        pulseSpeed: rand(0.01, 0.022),\n      }));\n      bokeh = Array.from({ length: Math.max(10, Math.round(count / 6)) }, () => ({\n        x: rand(0, W), y: rand(0, H),\n        vx: rand(-0.1, 0.1), vy: rand(-0.12, 0.04),\n        r: rand(18, 64),\n        a: rand(0.05, 0.16),\n        pulse: rand(0, Math.PI * 2),\n        pulseSpeed: rand(0.004, 0.012),\n      }));\n\n      const genTicker = () => {\n        const kind = Math.floor(rand(0, 3));\n        if (kind === 0) {\n          const v = (rand(1, 900)).toFixed(2).replace('.', ',');\n          return 'R$ ' + v.replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.');\n        }\n        if (kind === 1) {\n          const up = Math.random() > 0.42;\n          return (up ? '+' : '−') + rand(0.1, 9.9).toFixed(2) + '%';\n        }\n        const idx = ['IBOV', 'CDI', 'IPCA', 'SELIC', 'USD', 'PL', 'ROI', 'EBITDA'];\n        return idx[Math.floor(rand(0, idx.length))] + ' ' + rand(10, 9999).toFixed(0);\n      };\n      tickers = Array.from({ length: Math.max(7, Math.round(count / 7)) }, () => ({\n        x: rand(0, W), y: rand(0, H),\n        vy: rand(-0.28, -0.10),\n        txt: genTicker(),\n        size: rand(11, 17),\n        a: rand(0.12, 0.4),\n        pulse: rand(0, Math.PI * 2),\n        pulseSpeed: rand(0.004, 0.011),\n        life: rand(0, 1),\n      }));\n      this._genTicker = genTicker;\n    };\n\n    this._onNeuralMove = (e) => {\n      const r = canvas.getBoundingClientRect();\n      mouse.x = e.clientX - r.left;\n      mouse.y = e.clientY - r.top;\n    };\n    window.addEventListener('mousemove', this._onNeuralMove);\n    this._onLeave = () => { mouse.x = -9999; mouse.y = -9999; };\n    window.addEventListener('mouseout', this._onLeave);\n\n    const LINK = 122, LINK2 = LINK * LINK;\n\n    const frame = () => {\n      if (!this._neuralActive) { this._neuralRAF = requestAnimationFrame(frame); return; }\n      ctx.clearRect(0, 0, W, H);\n      ctx.globalCompositeOperation = 'lighter';\n\n      for (const o of bokeh) {\n        o.x += o.vx; o.y += o.vy; o.pulse += o.pulseSpeed;\n        if (o.x < -80) o.x = W + 80; if (o.x > W + 80) o.x = -80;\n        if (o.y < -80) o.y = H + 80; if (o.y > H + 80) o.y = -80;\n        const fl = 0.6 + 0.4 * Math.sin(o.pulse);\n        ctx.globalAlpha = o.a * fl * 3;\n        ctx.drawImage(nodeSprite, o.x - o.r, o.y - o.r, o.r * 2, o.r * 2);\n      }\n      ctx.globalAlpha = 1;\n\n      const all = nodes.concat(hubs);\n      for (const n of all) {\n        n.x += n.vx; n.y += n.vy;\n        if (n.x < 0 || n.x > W) n.vx *= -1;\n        if (n.y < 0 || n.y > H) n.vy *= -1;\n        n.x = Math.max(0, Math.min(W, n.x));\n        n.y = Math.max(0, Math.min(H, n.y));\n        const dx = n.x - mouse.x, dy = n.y - mouse.y;\n        const md2 = dx * dx + dy * dy;\n        if (md2 < 26000) {\n          const f = (1 - md2 / 26000) * 0.8;\n          const d = Math.sqrt(md2) || 1;\n          n.x += (dx / d) * f; n.y += (dy / d) * f;\n        }\n        n.pulse += n.pulseSpeed;\n      }\n\n      ctx.lineWidth = 0.8;\n      for (let i = 0; i < all.length; i++) {\n        const a = all[i];\n        for (let j = i + 1; j < all.length; j++) {\n          const b = all[j];\n          const dx = a.x - b.x, dy = a.y - b.y;\n          const d2 = dx * dx + dy * dy;\n          if (d2 < LINK2) {\n            const o = (1 - d2 / LINK2) * 0.5;\n            ctx.strokeStyle = 'rgba(' + C_LINE + ',' + o.toFixed(3) + ')';\n            ctx.beginPath();\n            ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);\n            ctx.stroke();\n          }\n        }\n      }\n\n      for (const n of nodes) {\n        const glow = 0.55 + 0.45 * Math.sin(n.pulse);\n        const rr = (n.r + glow * 1.1) * 4;\n        ctx.globalAlpha = 0.35 + glow * 0.5;\n        ctx.drawImage(nodeSprite, n.x - rr, n.y - rr, rr * 2, rr * 2);\n      }\n\n      for (const n of hubs) {\n        const glow = 0.6 + 0.4 * Math.sin(n.pulse);\n        const rr = (n.r + glow * 2.2) * 7;\n        ctx.globalAlpha = 0.6 + glow * 0.35;\n        ctx.drawImage(hubSprite, n.x - rr, n.y - rr, rr * 2, rr * 2);\n      }\n      ctx.globalAlpha = 1;\n      ctx.globalCompositeOperation = 'source-over';\n\n      // floating finance tickers\n      ctx.textBaseline = 'middle';\n      for (const t of tickers) {\n        t.y += t.vy; t.pulse += t.pulseSpeed;\n        if (t.y < -20) {\n          t.y = H + 20; t.x = rand(0, W);\n          t.txt = this._genTicker(); t.size = rand(11, 17); t.a = rand(0.12, 0.4);\n        }\n        const fl = 0.55 + 0.45 * Math.sin(t.pulse);\n        const col = t.txt.charAt(0) === '+' ? '150,205,255'\n                  : t.txt.charAt(0) === '−' ? '120,150,215'\n                  : C_NODE;\n        ctx.font = '600 ' + t.size.toFixed(0) + 'px \"Hanken Grotesk\", sans-serif';\n        ctx.fillStyle = 'rgba(' + col + ',' + (t.a * fl).toFixed(3) + ')';\n        ctx.fillText(t.txt, t.x, t.y);\n      }\n\n      this._neuralRAF = requestAnimationFrame(frame);\n    };\n\n    this._neuralActive = true;\n    this._io = new IntersectionObserver((ents) => {\n      this._neuralActive = ents[0].isIntersecting && !document.hidden;\n    }, { threshold: 0.01 });\n    this._io.observe(canvas);\n    this._onVis = () => {\n      const r = canvas.getBoundingClientRect();\n      this._neuralActive = !document.hidden && r.bottom > 0 && r.top < window.innerHeight;\n    };\n    document.addEventListener('visibilitychange', this._onVis);\n\n    this._onResize = () => build();\n    window.addEventListener('resize', this._onResize);\n    build();\n    frame();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('mousemove', this._onMove);\n    window.removeEventListener('mousemove', this._onNeuralMove);\n    window.removeEventListener('mouseout', this._onLeave);\n    window.removeEventListener('resize', this._onResize);\n    document.removeEventListener('visibilitychange', this._onVis);\n    if (this._io) this._io.disconnect();\n    cancelAnimationFrame(this._neuralRAF);\n  }\n\n  renderVals() {\n    const { px, py } = this.state;\n    return {\n      neuralRef: (el) => { this._neural = el; },\n      showStats: this.props.showStats ?? true,\n      showBeams: this.props.showBeams ?? true,\n      glowIntensity: this.props.glowIntensity ?? 0.75,\n      beamTransform: `translate(${(-px * 34).toFixed(1)}px, ${(-py * 24).toFixed(1)}px) scale(1.06)`,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
